        </div>
        {view==="zakończone"&&<div style={{display:"flex",gap:6,padding:"0 20px 12px"}}>
          {[{k:"wszystkie",l:`Wszystkie (${cnt.zakończone})`},{k:"okresowe",l:`Okresowe (${cntZakOkres})`},{k:"cykliczne",l:`🔄 Cykl. (${cntZakCykl})`}].map(x=>
            <button key={x.k} onClick={()=>setZakSubView(x.k)} style={{flex:1,padding:"6px 4px",borderRadius:16,border:"none",cursor:"pointer",fontWeight:600,fontSize:11,whiteSpace:"nowrap",background:zakSubView===x.k?"#5A7A9A":dk?"#1A2A2A":"#EAF0F5",color:zakSubView===x.k?"#fff":dk?"#5A8A8A":"#4A6070",fontFamily:"inherit",textAlign:"center"}}>{x.l}</button>
          )}
        </div>}
        <StockPanel rentals={rentals} stock={stock} setStock={setStock}/>
        <div style={{padding:"0 20px"}}>
          {filt.length===0?<Empty text="Brak wypożyczeń w tej kategorii"/>:filt.map(r=><RCard key={r.id} r={r} onClick={()=>setDetail(r.id)}/>)}
        </div>
        {showAdd&&<Modal title="Nowe wypożyczenie" onClose={()=>setShowAdd(false)}>
          <Sel label="Sprzęt" value={form.equipment} onChange={v=>setForm(f=>({...f,equipment:v}))} options={[{value:"",label:"❓ Do ustalenia"},...EQUIPMENT.map(x=>({value:x,label:x}))]}/>

          <PatientPicker label="Pacjent *" value={form.patientName} onChange={v=>setForm(f=>({...f,patientName:v}))} onSelect={p=>setForm(f=>({...f,patientName:p.name,phone:p.phone,address:p.address,patientId:p.id}))} patients={allClients||patients}/>
          <Inp label="Telefon" value={form.phone} onChange={v=>setForm(f=>({...f,phone:v}))} type="tel"/>
          <Inp label="Adres" value={form.address} onChange={v=>setForm(f=>({...f,address:v}))}/>
          <div style={{marginBottom:14}}>
            <div style={{fontSize:12,fontWeight:600,color:"#7A8FA6",marginBottom:8,textTransform:"uppercase",letterSpacing:.5}}>Typ</div>
            <div style={{display:"flex",gap:8}}>{[{v:false,l:"Jednorazowe"},{v:true,l:"🔄 Odnawialne miesięcznie"}].map(o=><button key={String(o.v)} onClick={()=>setForm(f=>({...f,renewable:o.v,endDate:o.v?"":f.endDate}))} style={{flex:1,padding:"10px 8px",borderRadius:12,border:`2px solid ${form.renewable===o.v?"#0A7C7C":"#E4EAF0"}`,background:form.renewable===o.v?"#E6F4F4":"#fff",color:form.renewable===o.v?"#0A7C7C":"#7A8FA6",fontWeight:600,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>{o.l}</button>)}</div>
          </div>
          <Inp label="Data od" value={form.startDate} onChange={v=>setForm(f=>({...f,startDate:v}))} type="date"/>
          <div style={{marginBottom:6,fontSize:12,fontWeight:600,color:"#7A8FA6",textTransform:"uppercase",letterSpacing:.5}}>Dowóz</div>
          <div style={{display:"flex",gap:6,marginBottom:10}}>{[{v:false,l:"⏰ Konkretna godzina"},{v:true,l:"🗓 Całodniowy"}].map(o=><button key={String(o.v)} onClick={()=>setForm(f=>({...f,startAllDay:o.v}))} style={{flex:1,padding:"8px",borderRadius:10,border:`2px solid ${(form.startAllDay||false)===o.v?"#0A7C7C":"#E4EAF0"}`,background:(form.startAllDay||false)===o.v?"#E6F4F4":"#fff",color:(form.startAllDay||false)===o.v?"#0A7C7C":"#7A8FA6",fontWeight:600,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>{o.l}</button>)}</div>
          {!form.startAllDay&&<TimeSel label="Godzina dowozu" value={form.startTime||"10:00"} onChange={v=>setForm(f=>({...f,startTime:v}))}/>}
          {!form.renewable&&<Inp label="Data do (opcjonalna)" value={form.endDate} onChange={v=>setForm(f=>({...f,endDate:v}))} type="date"/>}
          {!form.renewable&&form.endDate&&<><div style={{marginBottom:6,fontSize:12,fontWeight:600,color:"#7A8FA6",textTransform:"uppercase",letterSpacing:.5}}>Odbiór</div>
          <div style={{display:"flex",gap:6,marginBottom:10}}>{[{v:false,l:"⏰ Konkretna godzina"},{v:true,l:"🗓 Całodniowy"}].map(o=><button key={String(o.v)} onClick={()=>setForm(f=>({...f,endAllDay:o.v}))} style={{flex:1,padding:"8px",borderRadius:10,border:`2px solid ${(form.endAllDay||false)===o.v?"#0A7C7C":"#E4EAF0"}`,background:(form.endAllDay||false)===o.v?"#E6F4F4":"#fff",color:(form.endAllDay||false)===o.v?"#0A7C7C":"#7A8FA6",fontWeight:600,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>{o.l}</button>)}</div>
          {!form.endAllDay&&<TimeSel label="Godzina odbioru" value={form.endTime||"10:00"} onChange={v=>setForm(f=>({...f,endTime:v}))}/>}</>}
          <Inp label="Kwota (zł)" value={form.amount} onChange={v=>setForm(f=>({...f,amount:v}))} type="number" placeholder="400"/>
          {!form.renewable&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <Inp label="Zapłacono (zł)" value={form.amountPaid} onChange={v=>setForm(f=>({...f,amountPaid:v}))} type="number" placeholder="0"/>
            <div style={{marginBottom:14}}><div style={{fontSize:12,fontWeight:600,color:"#7A8FA6",marginBottom:5,textTransform:"uppercase",letterSpacing:.5}}>Pozostało</div><div style={{padding:"11px 14px",border:"1.5px solid #E4EAF0",borderRadius:12,fontSize:15,background:"#F2F5F7",color:(+form.amount-(+form.amountPaid||0))>0?"#E05C5C":"#3DAA72",fontWeight:700}}>{form.amount?(+form.amount-(+form.amountPaid||0))+" zł":"—"}</div></div>
          </div>}
          <Inp label="Transport (zł)" value={form.transport||""} onChange={v=>setForm(f=>({...f,transport:v}))} type="number" placeholder="0"/>
          <Txa label="Notatki" value={form.notes} onChange={v=>setForm(f=>({...f,notes:v}))} rows={2}/>
          <Sel label="Skąd dowiedział się o wypożyczeniu?" value={form.source||""} onChange={v=>setForm(f=>({...f,source:v}))} options={[{value:"",label:"— nie wiem / nie podał"},...RENTAL_SOURCES.map(s=>({value:s.value,label:s.label}))]}/>
          <Btn disabled={!form.patientName} style={{width:"100%",justifyContent:"center"}} onClick={()=>{
            const pid=Date.now(),rid=Date.now()+1,paid=form.renewable?0:+(form.amountPaid||0);
            const pat=patients.find(p=>p.name===form.patientName);
            const nr={...form,id:rid,patientId:pat?.id||null,amount:+form.amount,amountPaid:paid,payments:paid>0?[{id:pid,amount:paid,date:form.startDate}]:[],cycles:[],status:"aktywne",startAllDay:form.startAllDay||false,endAllDay:form.endAllDay||false,allDay:undefined};
            setRentals(r=>[nr,...r]);
            if(paid>0)setFinances(fs=>[{id:Date.now()+Math.random(),sourceId:"payment-"+pid,date:form.startDate,type:"przychód",category:"Wypożyczalnia",amount:paid,description:"Wypożyczenie – "+form.patientName+" ("+form.equipment+")"},...fs]);
            if(setPatients&&!pat){setPatients(ps=>[...(ps||[]),{id:Date.now()+2,name:form.patientName,phone:form.phone||"",address:form.address||"",diagnosis:"",notes:"",defaultPrice:"",birthday:""}]);}
            setShowAdd(false);setToast("Wypożyczenie dodane");
          }}>Zapisz wypożyczenie</Btn>
        </Modal>}
        {showImport&&<Modal title="Import CSV" onClose={()=>{setShowImport(false);setCsvRows([]);setCsvError("");}}>
          <div style={{marginBottom:14,background:dk?"#0F2020":"#F0F9F5",borderRadius:12,padding:"12px 14px"}}>
            <div style={{fontSize:13,fontWeight:600,marginBottom:4}}>1. Pobierz szablon Excel/CSV</div>
            <div style={{fontSize:12,color:"#7A8FA6",marginBottom:10}}>Otwórz w Excelu, uzupełnij, zapisz jako CSV UTF-8</div>
            <button onClick={()=>{
              const h="Pacjent;Telefon;Adres;Sprzęt;Data od;Data do;Kwota;Zapłacono;Dowóz;Skąd;Notatki";
              const ex1="Jan Kowalski;600123456;Ulica 1 Katowice;Artromot K1 2025;09-01-2025;23-01-2025;540;540;0;slawek;przykład";
              const ex2="Anna Nowak;601234567;Nowa 5 Sosnowiec;;01-02-2025;14-02-2025;480;480;50;reklama;";
              const ex3=";;Sprzęt: Artromot K1 2025 / Artromot K1 I / Kinetec Spectra / Kinetec Spectra SZ / Optiflex;;;;;;Skąd: slawek / reklama / szpital / organicznie;;";
              const blob=new Blob(["﻿"+h+"\n"+ex1+"\n"+ex2+"\n"+ex3],{type:"text/csv;charset=utf-8"});
              const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="szablon_wypozyczenia.csv";a.click();URL.revokeObjectURL(url);
            }} style={{width:"100%",padding:"10px",borderRadius:10,border:"none",background:"#0A7C7C",color:"#fff",fontWeight:600,fontSize:14,cursor:"pointer",fontFamily:"inherit"}}>📥 Pobierz szablon</button>
          </div>
          <div style={{marginBottom:14,background:dk?"#0F2020":"#F0F9F5",borderRadius:12,padding:"12px 14px"}}>
            <div style={{fontSize:13,fontWeight:600,marginBottom:4}}>2. Wgraj wypełniony plik</div>
            <input ref={importRef} type="file" accept=".csv,.xlsx,.xls,text/csv" style={{display:"none"}} onChange={e=>{
              const f=e.target.files?.[0];if(!f)return;
              const toYMD=v=>{
                if(!v&&v!==0)return"";
                if(typeof v==="number"){const d=new Date(Math.round((v-25569)*86400*1000));return d.toISOString().slice(0,10);}
                const s=String(v).trim();
                if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
                const dm=s.match(/^(\d{1,2})[.\-\/](\d{1,2})[.\-\/](\d{4})$/);
                if(dm)return`${dm[3]}-${dm[2].padStart(2,"0")}-${dm[1].padStart(2,"0")}`;
                return s;
              };
              const processRows=rawRows=>{
                try{
                  if(rawRows.length<2){setCsvError("Brak danych poza nagłówkiem");setCsvRows([]);return;}
                  const rows=[],errs=[];
                  const skadMap={"slawek":"slawek","sławek":"slawek","reklama":"reklama","szpital":"szpital","organicznie":"organicznie","organiczne":"organicznie","organic":"organicznie"};
                  for(let i=1;i<rawRows.length;i++){
                    const cells=rawRows[i];
                    const rowHasData=cells.some(c=>String(c||"").trim()!=="");
                    if(!rowHasData)continue;
                    const adres=String(cells[2]||"").trim();
                    const pacjentRaw=String(cells[0]||"").trim();
                    const pacjent=pacjentRaw||adres||"(brak danych — wiersz "+(i+1)+")";
                    if(!pacjentRaw)errs.push("Wiersz "+(i+1)+": brak nazwiska — użyto adresu jako tymczasowej nazwy");
                    const sprzet=String(cells[3]||"").trim();
                    const dataOdRaw=toYMD(cells[4]);
                    const dataOd=/^\d{4}-\d{2}-\d{2}$/.test(dataOdRaw)?dataOdRaw:"";
                    const dataDoRaw=toYMD(cells[5]);
                    const dataDo=/^\d{4}-\d{2}-\d{2}$/.test(dataDoRaw)?dataDoRaw:"";
                    const skadRaw=String(cells[9]||"").trim().toLowerCase();
                    rows.push({pacjent,telefon:String(cells[1]||"").trim(),adres,sprzet,dataOd,dataDo:dataDo||dataOd,kwota:+(cells[6]||0),zaplacono:+(cells[7]||0),dowoz:+(cells[8]||0),skad:skadMap[skadRaw]||"",notatki:String(cells[10]||"").trim()});
                  }
                  setCsvRows(rows);setCsvError(errs.length?"⚠️ "+errs.join("\n"):"");
                  if(importRef.current)importRef.current.value="";
                }catch(ex){setCsvError("Błąd przetwarzania: "+ex.message);setCsvRows([]);}
              };
              const isExcel=f.name.match(/\.(xlsx|xls)$/i);
              if(isExcel){
                const reader=new FileReader();
                reader.onload=ev=>{
                  try{
                    const wb=window.XLSX.read(new Uint8Array(ev.target.result),{type:"array",cellDates:false});
                    let bodyRows=[];
                    wb.SheetNames.forEach(sn=>{
                      const sheetRows=window.XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:""});
                      if(sheetRows.length>1)bodyRows=bodyRows.concat(sheetRows.slice(1)); // pomija nagłówek KAŻDEJ zakładki
                    });
                    processRows([[],...bodyRows]); // sztuczny nagłówek na pozycji 0, dane już bez nagłówków arkuszy
                  }catch(ex){setCsvError("Błąd odczytu Excela: "+ex.message);setCsvRows([]);}
                };
                reader.readAsArrayBuffer(f);
              }else{
                const reader=new FileReader();
                reader.onload=ev=>{
                  const text=ev.target.result;
                  const lines=text.trim().split(/\r?\n/).filter(l=>l.trim());
                  if(lines.length<2){setCsvError("Plik jest pusty lub brak danych");setCsvRows([]);return;}
                  const sep=lines[0].includes(";")?";":",";
                  const rawRows=lines.map(ln=>{const cells=[];let cur="",inQ=false;for(let c=0;c<ln.length;c++){if(ln[c]==='"'){inQ=!inQ;}else if(ln[c]===sep&&!inQ){cells.push(cur.trim().replace(/^"|"$/g,""));cur="";}else cur+=ln[c];}cells.push(cur.trim().replace(/^"|"$/g,""));return cells;});
                  processRows(rawRows);
                };
                reader.readAsText(f,"UTF-8");
              }
            }}/>
            <button onClick={()=>importRef.current&&importRef.current.click()} style={{width:"100%",padding:"10px",borderRadius:10,border:"2px dashed #0A7C7C",background:"transparent",color:"#0A7C7C",fontWeight:600,fontSize:14,cursor:"pointer",fontFamily:"inherit"}}>📂 Wybierz plik Excel (.xlsx) lub CSV</button>
          </div>
          {csvError&&<div style={{marginBottom:12,background:"#FFF0F0",borderRadius:10,padding:"10px 12px",fontSize:12,color:"#E05C5C",whiteSpace:"pre-wrap"}}>{csvError}</div>}
          {csvRows.length>0&&<div style={{marginBottom:14}}>
            <div style={{fontSize:13,fontWeight:600,marginBottom:8,color:"#3DAA72"}}>✅ Załadowano {csvRows.length} wierszy:</div>
            <div style={{maxHeight:180,overflowY:"auto",display:"flex",flexDirection:"column",gap:5}}>
              {csvRows.slice(0,25).map((row,i)=><div key={i} style={{background:dk?"#1A2A2A":"#F0F9F5",borderRadius:8,padding:"7px 10px",fontSize:12,display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
                <span style={{fontWeight:600}}>{row.pacjent}</span>
                <span style={{color:"#7A8FA6"}}>{row.dataOd}→{row.dataDo}</span>
                <span style={{color:"#3DAA72",fontWeight:600}}>{row.kwota} zł</span>
                {row.skad&&<span style={{color:"#7C6AF4",fontSize:11}}>({row.skad})</span>}
              </div>)}
              {csvRows.length>25&&<div style={{fontSize:12,color:"#7A8FA6",textAlign:"center",padding:"4px"}}>...i {csvRows.length-25} więcej</div>}
            </div>
          </div>}
          <Btn disabled={csvRows.length===0} style={{width:"100%",justifyContent:"center"}} onClick={()=>{
            const now=Date.now();
            const existingByKey={};
            rentals.forEach(r=>{const k=(r.patientName||"")+"|"+(r.startDate||"");if(!existingByKey[k])existingByKey[k]=r;});
            const newRentals=[];
            const updatedMap={};
            const financeUpserts=[];
            const seenInBatch=new Set();
            let dupSkipped=0;
            csvRows.forEach((row,i)=>{
              const k=(row.pacjent||"")+"|"+(row.dataOd||"");
              if(seenInBatch.has(k)){dupSkipped++;return;} // ten sam pacjent+data już w tym imporcie — pomija powtórzony wiersz
              seenInBatch.add(k);
              const paid=+row.zaplacono;
              const existing=existingByKey[k];
              if(existing){
                const payId=(existing.payments&&existing.payments[0]&&existing.payments[0].id)||(now+i*100+1);
                updatedMap[existing.id]={...existing,
                  phone:row.telefon||existing.phone,
                  address:row.adres||existing.address,
                  equipment:row.sprzet||existing.equipment,
                  endDate:row.dataDo||existing.endDate,
                  amount:row.kwota?+row.kwota:existing.amount,
                  amountPaid:paid||existing.amountPaid,
                  payments:paid>0?[{id:payId,amount:paid,date:row.dataOd}]:(existing.payments||[]),
                  transport:row.dowoz?+row.dowoz:existing.transport,
                  source:row.skad||existing.source,
                  notes:row.notatki||existing.notes};
                if(paid>0)financeUpserts.push({sourceId:"payment-"+payId,date:row.dataOd,amount:paid,description:"Wypożyczenie – "+row.pacjent+" (import)"});
              }else{
                const payId=now+i*100+1;
                newRentals.push({id:now+i*100,patientId:null,patientName:row.pacjent,phone:row.telefon,address:row.adres,equipment:row.sprzet||"",startDate:row.dataOd,endDate:row.dataDo,amount:+row.kwota,amountPaid:paid,payments:paid>0?[{id:payId,amount:paid,date:row.dataOd}]:[],cycles:[],status:"zakończone",renewable:false,startAllDay:true,endAllDay:true,transport:+row.dowoz,source:row.skad,notes:row.notatki});
                if(paid>0)financeUpserts.push({sourceId:"payment-"+payId,date:row.dataOd,amount:paid,description:"Wypożyczenie – "+row.pacjent+" (import)"});
              }
            });
            const updatedCount=Object.keys(updatedMap).length;
            setRentals(rs=>[...newRentals,...rs.map(r=>updatedMap[r.id]||r)]);
            setFinances(fs=>{
              const existingSids=new Set(fs.map(f=>f.sourceId));
              const merged=fs.map(f=>{const u=financeUpserts.find(x=>x.sourceId===f.sourceId);return u?{...f,date:u.date,amount:u.amount,description:u.description}:f;});
              const toAdd=financeUpserts.filter(u=>!existingSids.has(u.sourceId)).map((u,i)=>({id:now+90000+i,sourceId:u.sourceId,date:u.date,type:"przychód",category:"Wypożyczalnia",amount:u.amount,description:u.description}));
              return [...toAdd,...merged];
            });
            setShowImport(false);setCsvRows([]);setCsvError("");
            setToast("Zaimportowano "+newRentals.length+(updatedCount>0?", zaktualizowano "+updatedCount:"")+(dupSkipped>0?", pominięto "+dupSkipped+" duplikatów":"")+" ✅");
          }}>Importuj {csvRows.length > 0 ? csvRows.length+" " : ""}wypożyczeń →</Btn>
        </Modal>}
        {toast&&<Toast msg={toast} onDone={()=>setToast(null)}/>}
      </div>;
    }

    // ── FINANCES ──────────────────────────────────────────────────────────────

    function Finances({finances,setFinances,visits,setVisits,rentals,setRentals,nfzCases,setNfzCases,budget,setBudget,desk,anthropicKey,stock,setStock,machines,setMachines}) {
      const demo=useDemo();
      const dk=useContext(DarkCtx);
      const [showAdd,setShowAdd]=useState(false);
      const [editE,setEditE]=useState(null);
      const [viewMode,setViewMode]=useState(()=>{const h=window.location.hash.replace("#","").split("-");return h[1]||"month";});
      useEffect(()=>{window.location.replace("#finances-"+viewMode);},[viewMode]);
      const [month,setMonth]=useState(()=>todayLocal().slice(0,7));
      const [year,setYear]=useState(()=>todayLocal().slice(0,4));
      const [weekStart,setWeekStart]=useState(()=>{const d=new Date();const day=d.getDay()||7;d.setDate(d.getDate()-day+1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");});
      const [rangeFrom,setRangeFrom]=useState(()=>todayLocal().slice(0,7)+"-01");
      const [rangeTo,setRangeTo]=useState(()=>todayLocal());
      const [toast,setToast]=useState(null);
      const [showAllPats,setShowAllPats]=useState(false);
      const [expandedCat,setExpandedCat]=useState(null);
      const cats=["Wizyta","Wypożyczalnia","Wózek","Inne"];
      const ef=()=>({date:todayLocal(),category:"Wizyta",amount:"",description:""});
      const [form,setForm]=useState(ef);

      const weekEnd=useMemo(()=>{const d=new Date(weekStart+"T12:00:00");d.setDate(d.getDate()+6);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");},[weekStart]);

      // visitMap: sourceId -> actual visit date
      const visitMap=useMemo(()=>{
        const m={};
        (visits||[]).forEach(v=>{if(v.id)m["visit-"+v.id]=v.date;});
        return m;
      },[visits]);

      const inPeriod=(date)=>{
        if(!date)return false;
        if(viewMode==="month")return date.startsWith(month);
        if(viewMode==="week")return date>=weekStart&&date<=weekEnd;
        if(viewMode==="range")return date>=rangeFrom&&date<=rangeTo;
        return date.startsWith(year);
      };
      const inPrevPeriod=(date)=>{
        if(!date)return false;
        if(viewMode==="month"){const d=new Date(month+"-15");d.setMonth(d.getMonth()-1);return date.startsWith(d.toISOString().slice(0,7));}
        if(viewMode==="week"){const ps=new Date(weekStart);ps.setDate(ps.getDate()-7);const pe=new Date(weekEnd);pe.setDate(pe.getDate()-7);return date>=ps.toISOString().slice(0,10)&&date<=pe.toISOString().slice(0,10);}
        if(viewMode==="range")return false;
        return date.startsWith(String(+year-1));
      };

      const inc=useMemo(()=>finances.filter(f=>{
        if(f.type!=="przychód")return false;
        const d=(f.sourceId||"").startsWith("visit-")?(visitMap[f.sourceId]||f.date):f.date;
        return inPeriod(d);
      }).reduce((s,f)=>s+(+f.amount||0),0),[finances,visits,visitMap,viewMode,month,year,weekStart,weekEnd,rangeFrom,rangeTo]);
      const prevInc=useMemo(()=>finances.filter(f=>{
        if(f.type!=="przychód")return false;
        const d=(f.sourceId||"").startsWith("visit-")?(visitMap[f.sourceId]||f.date):f.date;
        return inPrevPeriod(d);
      }).reduce((s,f)=>s+(+f.amount||0),0),[finances,visits,visitMap,viewMode,month,year,weekStart,weekEnd,rangeFrom,rangeTo]);
      const diff=prevInc>0?Math.round((inc-prevInc)/prevInc*100):null; // prevInc still from finances for comparison
      // ── SPÓJNA LOGIKA FILTROWANIA ────────────────────────────────────────────
      // Reguła: dla wpisów visit-* data = visits[id].date (aktualna data wizyty)
      //         dla reszty (payment, cycle, extend, wozek) = f.date z finances
      // visitMap już zbudowany wyżej

      // Wizyty w okresie (źródło: visits)
      const periodVisits=useMemo(()=>(visits||[]).filter(v=>inPeriod(v.date)&&v.status!=="anulowana"&&visitStatus(v)==="zakończona"),[visits,viewMode,month,year,weekStart,weekEnd,rangeFrom,rangeTo]);
      const visitCount=periodVisits.length;
      const visitAvg=visitCount>0?periodVisits.reduce((s,v)=>s+(+v.price||0),0)/visitCount:0;

      // Finanse nie-wizytowe w okresie (payment, cycle, extend, wozek, ręczne)
      const periodNonVisitFinances=useMemo(()=>finances.filter(f=>{
        if(f.type!=="przychód")return false;
        if((f.sourceId||"").startsWith("visit-"))return false; // wizyty liczymy z visits
        return inPeriod(f.date);
      }),[finances,viewMode,month,year,weekStart,weekEnd,rangeFrom,rangeTo]);

      // Łączny przychód: wizyty (z visits.price) + reszta (z finances)
      // inc już wyliczony wyżej przez finances — nadpisujemy spójnie
      const incVisits=periodVisits.reduce((s,v)=>s+(+v.price||0),0);
      const incOther=periodNonVisitFinances.reduce((s,f)=>s+(+f.amount||0),0);
      const incTotal=incVisits+incOther;

      // Kategorie
      const catBreakdown=useMemo(()=>{
        const map={Wizyta:incVisits,Wypożyczalnia:0,Wózek:0,Inne:0};
        periodNonVisitFinances.forEach(f=>{
          const c=f.category||"Inne";
          if(map[c]!==undefined)map[c]+=+f.amount||0;
          else map["Inne"]+=+f.amount||0;
        });
        const colors={Wizyta:"#0A7C7C",Wypożyczalnia:"#2E86AB",Wózek:"#7B4FBF",Inne:"#7A8FA6"};
        return Object.entries(map).filter(([,v])=>v>0).map(([k,v])=>({label:k,v,color:colors[k]||"#7A8FA6"}));
      },[periodVisits,periodNonVisitFinances,incVisits]);

      // Pacjenci (wizyty + wypożyczenia + wózki)
      const topPats=useMemo(()=>{
        const map={};const cnt={};
        periodVisits.forEach(v=>{
          const name=v.patientName||"Nieznany";
          if(name==="Nieznany")return;
          cnt[name]=(cnt[name]||0)+1;
          map[name]=(map[name]||0)+(+v.price||0);
        });
        periodNonVisitFinances.forEach(f=>{
          const raw=(f.description||"").split(" – ")[1];
          if(!raw)return;
          const name=raw.split(" (")[0].trim();
          if(!name)return;
          map[name]=(map[name]||0)+(+f.amount||0);
        });
        return Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([n,v])=>([n,v,cnt[n]||0]));
      },[periodVisits,periodNonVisitFinances]);
      const visiblePats=showAllPats?topPats:topPats.slice(0,5);

      // Lista wpisów: wizyty z visits + reszta z finances
      const listEntries=useMemo(()=>{
        const visitRows=periodVisits.map(v=>({
          id:"v-"+v.id,sourceId:"visit-"+v.id,date:v.date,
          category:"Wizyta",amount:v.price||0,
          description:"Wizyta – "+v.patientName,type:"przychód"
        }));
        const otherRows=periodNonVisitFinances;
        return [...visitRows,...otherRows].sort((a,b)=>b.date.localeCompare(a.date));
      },[periodVisits,periodNonVisitFinances]);

      // Wpisy pogrupowane po kategorii (do rozwijanej listy w karcie "Kategorie"), już sort. po dacie (najnowsze pierwsze)
      const catEntries=useMemo(()=>{
        const known=new Set(["Wizyta","Wypożyczalnia","Wózek"]);
        const map={};
        listEntries.forEach(f=>{
          const c=known.has(f.category)?f.category:"Inne";
          (map[c]=map[c]||[]).push(f);
        });
        return map;
      },[listEntries]);

      // Koszt marketingu w całym roku (suma po miesiącach, ta sama reguła dopasowania co w zakładce Sprzęt)
      const yearMarketingSpend=useMemo(()=>{
        const mktgCat=(stock&&stock.marketingCat)||"";
        const mktgSub=(stock&&stock.marketingSub)||"";
        const matchCat=(cat,sub)=>{
          if(mktgCat)return cat===mktgCat&&(!mktgSub||sub===mktgSub);
          return (cat||"").toLowerCase()==="firma"&&(sub||"").toLowerCase()==="marketing";
        };
        let total=0;
        for(let m=1;m<=12;m++){
          const ym=year+"-"+String(m).padStart(2,"0");
          const mData=(budget&&budget.months&&budget.months[ym])||{};
          (mData.expenses||[]).forEach(e=>{if(matchCat(e.cat,e.subcat))total+=(+e.amount||0);});
          ((budget&&budget.recurring)||[]).filter(r=>r.type==="expense"&&matchCat(r.cat,r.subcat)).forEach(r=>{
            const rStart=(r.startMonth||"0000-00").slice(0,7);
            const rEnd=(r.endMonth||"9999-99").slice(0,7);
            if(ym>=rStart&&ym<=rEnd){
              const ov=((budget.months||{})[ym]||{}).recurringOverrides||{};
              const amt=ov[r.id]!==undefined?+ov[r.id].amount:(+r.amount||0);
              total+=amt*(r.cycle==="weekly"?4:1);
            }
          });
        }
        return total;
      },[year,budget,stock]);

      const months=useMemo(()=>{const c=todayLocal().slice(0,7),s=new Set([c]);finances.forEach(f=>{if(f.date)s.add(f.date.slice(0,7));});return Array.from(s).sort((a,b)=>b.localeCompare(a));},[finances]);
      const years=useMemo(()=>{const c=todayLocal().slice(0,4),s=new Set([c]);finances.forEach(f=>{if(f.date)s.add(f.date.slice(0,4));});return Array.from(s).sort((a,b)=>b.localeCompare(a));},[finances]);

      const deleteWithSource=(entry)=>{
        const sid=entry.sourceId;
        if(!sid){setFinances(fs=>fs.filter(f=>f.id!==entry.id));return;}
        if(sid.startsWith("visit-")){const vid=+sid.replace("visit-","");setVisits(vs=>vs.filter(v=>+v.id!==vid));}
        else if(sid.startsWith("payment-")){const pid=+sid.replace("payment-","");setRentals(rs=>rs.map(r=>{const found=(r.payments||[]).find(p=>+p.id===pid);if(!found)return r;const newPmts=(r.payments||[]).filter(p=>+p.id!==pid);return{...r,payments:newPmts,amountPaid:newPmts.reduce((s,p)=>s+(+p.amount||0),0)};}));}
        else if(sid.startsWith("extend-")){const rest=sid.slice(7);const di=rest.indexOf("-");const rid=+rest.slice(0,di);const eid=+rest.slice(di+1);setRentals(rs=>rs.map(r=>+r.id!==rid?r:{...r,extensions:(r.extensions||[]).map(e=>+e.id===eid?{...e,amountPaid:0,paidDate:null}:e)}));}
        else if(sid.startsWith("cycle-")){const rest=sid.slice(6);const di=rest.indexOf("-");const rid=+rest.slice(0,di);const mo=rest.slice(di+1);setRentals(rs=>rs.map(r=>+r.id!==rid?r:{...r,cycles:(r.cycles||[]).map(c=>c.month===mo?{...c,paid:false,paidDate:null}:c)}));}
        else if(sid.startsWith("wozek-")){const cid=+sid.replace("wozek-","");setNfzCases(cs=>(cs||[]).map(c=>+c.id===cid?{...c,realized:false}:c));}
        else if(sid.startsWith("transport-")){const rid=+sid.slice(10);setRentals(rs=>rs.map(r=>+r.id===rid?{...r,transportPaid:false,transportPaidDate:null}:r));}
        else if(sid.startsWith("serwis-")){const rest=sid.slice(7);const di=rest.indexOf("-");const mid=+rest.slice(0,di);const eid=+rest.slice(di+1);setMachines(ms=>(ms||[]).map(m=>{if(m.id!==mid)return m;const log=(m.serviceLog||[]).filter(s=>s.id!==eid);const lastServiceDate=log.length>0?log.reduce((a,b)=>(a.date>b.date?a:b)).date:null;return{...m,serviceLog:log,lastServiceDate};}));}
        setFinances(fs=>fs.filter(f=>f.id!==entry.id));
      };

      const bg2=dk?"#1A2A2A":"#fff";
      const border=dk?"#2A4040":"#E4EAF0";
      const sub="#7A8FA6";
      const catColors={Wizyta:"#0A7C7C",Wypożyczalnia:"#2E86AB",Wózek:"#7B4FBF",Inne:"#7A8FA6"};

      return <>
        <div>
          <div style={{padding:"28px 20px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{fontFamily:"'Syne',sans-serif",fontSize:24,fontWeight:800}}>Finanse</div>
            {viewMode!=="sprzet"&&<Btn small onClick={()=>{setForm(ef());setShowAdd(true);}}><Ico d={I.plus} s={16} c="#fff"/> Dodaj</Btn>}
          </div>
          <div style={{padding:"0 20px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,gap:8}}>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {[{k:"week",l:"Tydzień"},{k:"month",l:"Miesiąc"},{k:"year",l:"Rok"},{k:"range",l:"Zakres"}].map(x=>
                  <button key={x.k} onClick={()=>setViewMode(x.k)} style={{padding:"7px 14px",borderRadius:20,border:"none",cursor:"pointer",fontWeight:600,fontSize:13,whiteSpace:"nowrap",background:viewMode===x.k?"#0A7C7C":dk?"#1E3A3A":"#E4EAF0",color:viewMode===x.k?"#fff":dk?"#5A8A8A":"#4A6070",fontFamily:"inherit"}}>{x.l}</button>
                )}
              </div>
              <div style={{display:"flex",gap:6,flexShrink:0}}>
                {[{k:"budget",l:"🏠"},{k:"sprzet",l:"📦"}].map(x=>
                  <button key={x.k} onClick={()=>setViewMode(x.k)} title={x.k==="budget"?"Dom":"Sprzęt"} style={{width:36,height:34,borderRadius:10,border:`1.5px solid ${viewMode===x.k?"#0A7C7C":border}`,cursor:"pointer",fontSize:16,background:viewMode===x.k?(dk?"#0A3030":"#E6F4F4"):dk?"#1A2A2A":"#fff",color:viewMode===x.k?"#0A7C7C":sub,fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"center"}}>{x.l}</button>
                )}
              </div>
            </div>

            {(viewMode==="week"||viewMode==="month"||viewMode==="year")&&<div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
              <button onClick={()=>{
                if(viewMode==="week"){const d=new Date(weekStart);d.setDate(d.getDate()-7);setWeekStart(d.toISOString().slice(0,10));}
                else if(viewMode==="month"){const d=new Date(month+"-15");d.setMonth(d.getMonth()-1);setMonth(d.toISOString().slice(0,7));}
                else setYear(String(+year-1));
              }} style={{width:34,height:34,borderRadius:10,border:`1.5px solid ${border}`,background:dk?"#1A2A2A":"#F2F5F7",cursor:"pointer",fontSize:18,color:sub,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>‹</button>
              <div style={{flex:1,textAlign:"center",fontWeight:600,fontSize:13,color:dk?"#C8E8E8":"#1C2B3A",textTransform:"capitalize"}}>
                {viewMode==="week"?weekStart+" – "+weekEnd:viewMode==="month"?new Date(month+"-15").toLocaleDateString("pl-PL",{month:"long",year:"numeric"}):year}
              </div>
              <button onClick={()=>{
                if(viewMode==="week"){const d=new Date(weekStart);d.setDate(d.getDate()+7);setWeekStart(d.toISOString().slice(0,10));}
                else if(viewMode==="month"){const d=new Date(month+"-15");d.setMonth(d.getMonth()+1);setMonth(d.toISOString().slice(0,7));}
                else setYear(String(+year+1));
              }} style={{width:34,height:34,borderRadius:10,border:`1.5px solid ${border}`,background:dk?"#1A2A2A":"#F2F5F7",cursor:"pointer",fontSize:18,color:sub,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>›</button>
            </div>}
            {viewMode==="budget"&&<Budget finances={finances} visits={visits} rentals={rentals} budget={budget} setBudget={setBudget} desk={desk} anthropicKey={anthropicKey}/>}
            {viewMode==="sprzet"&&<RentalStats rentals={rentals} stock={stock} setStock={setStock} finances={finances} setFinances={setFinances} budget={budget} machines={machines} setMachines={setMachines}/>}
            {viewMode==="range"&&<div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16,flexWrap:"wrap"}}>
              <input type="date" value={rangeFrom} onChange={e=>setRangeFrom(e.target.value)} style={{flex:1,minWidth:120,padding:"9px 12px",borderRadius:12,border:`1.5px solid ${border}`,background:dk?"#0F1F1F":"#FAFCFD",color:dk?"#E8F5F5":"#1C2B3A",fontSize:14,fontFamily:"inherit"}}/>
              <span style={{color:sub,fontWeight:600}}>—</span>
              <input type="date" value={rangeTo} onChange={e=>setRangeTo(e.target.value)} style={{flex:1,minWidth:120,padding:"9px 12px",borderRadius:12,border:`1.5px solid ${border}`,background:dk?"#0F1F1F":"#FAFCFD",color:dk?"#E8F5F5":"#1C2B3A",fontSize:14,fontFamily:"inherit"}}/>
            </div>}

            {viewMode!=="budget"&&viewMode!=="sprzet"&&<>
              <div style={{background:bg2,borderRadius:16,padding:"16px",marginBottom:12,boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:4}}>
                  <div>
                    <div style={{fontSize:11,color:sub,fontWeight:600,textTransform:"uppercase",letterSpacing:.5,marginBottom:4}}>Przychód</div>
                    <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:28,color:"#3DAA72",lineHeight:1}}>{demo?"****":incTotal.toFixed(2)} zł</div>
                    {visitCount>0&&<div style={{fontSize:12,color:sub,marginTop:6}}>{visitCount} {visitCount===1?"wizyta":visitCount<5?"wizyty":"wizyt"} · śr. <b style={{color:dk?"#C8E8E8":"#1C2B3A"}}>{demo?"**":Math.round(visitAvg)} zł</b></div>}
                  </div>
                  {diff!==null&&<div style={{background:diff>=0?"#3DAA7220":"#E05C5C20",borderRadius:10,padding:"6px 10px",textAlign:"center"}}>
                    <div style={{fontWeight:700,fontSize:14,color:diff>=0?"#3DAA72":"#E05C5C"}}>{diff>=0?"+":""}{diff}%</div>
                    <div style={{fontSize:10,color:sub}}>vs poprz.</div>
                  </div>}
                </div>

              </div>

              {catBreakdown.length>0&&<div style={{background:bg2,borderRadius:16,padding:"16px",marginBottom:12,boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
                <div style={{fontSize:11,fontWeight:700,color:sub,textTransform:"uppercase",letterSpacing:.5,marginBottom:12}}>Kategorie</div>
                {catBreakdown.map(c=>{
                  const pct=inc>0?(c.v/inc*100):0;
                  const isOpen=expandedCat===c.label;
                  const entries=catEntries[c.label]||[];
                  return <div key={c.label} style={{marginBottom:10}}>
                    <div onClick={()=>setExpandedCat(isOpen?null:c.label)} style={{cursor:"pointer"}}>
                      <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                        <span style={{fontSize:13,fontWeight:600,color:dk?"#C8E8E8":"#1C2B3A"}}>{c.label} <span style={{color:sub,fontSize:10}}>{isOpen?"▲":"▼"}</span></span>
                        <span style={{fontSize:13,color:sub}}>{demo?"****":c.v.toFixed(2)} zł <span style={{color:c.color,fontWeight:700}}>({pct.toFixed(0)}%)</span></span>
                      </div>
                      <div style={{height:7,borderRadius:4,background:dk?"#2A4040":"#F0F4F8"}}>
                        <div style={{height:"100%",width:pct+"%",background:c.color,borderRadius:4,transition:"width .3s"}}/>
                      </div>
                    </div>
                    {isOpen&&<div style={{marginTop:8,paddingLeft:2}}>
                      {entries.length===0&&<div style={{fontSize:12,color:sub,padding:"4px 0"}}>Brak wpisów</div>}
                      {entries.map((f,i)=>(
                        <div key={f.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:i<entries.length-1?`1px solid ${border}`:"none"}}>
                          <div style={{minWidth:0,flex:1,paddingRight:8}}>
                            <div style={{fontSize:12,fontWeight:600,color:dk?"#C8E8E8":"#1C2B3A",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{demo?c.label:(f.description||f.category)}</div>
                            <div style={{fontSize:11,color:sub}}>{f.date}</div>
                          </div>
                          <span style={{fontSize:12,fontWeight:700,color:"#3DAA72",flexShrink:0}}>+{demo?"****":(+f.amount).toFixed(2)} zł</span>
                        </div>
                      ))}
                    </div>}
                  </div>;
                })}
              </div>}

              {topPats.length>0&&<div style={{background:bg2,borderRadius:16,padding:"16px",marginBottom:12,boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
                <div style={{fontSize:11,fontWeight:700,color:sub,textTransform:"uppercase",letterSpacing:.5,marginBottom:12}}>Pacjenci</div>
                {visiblePats.map(([name,v,c],i)=>(
                  <div key={name} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:i<visiblePats.length-1?`1px solid ${border}`:"none"}}>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <div style={{width:22,height:22,borderRadius:7,background:"#0A7C7C20",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:"#0A7C7C"}}>{i+1}</div>
                      <div>
                        <div style={{fontSize:13,fontWeight:600,color:dk?"#C8E8E8":"#1C2B3A"}}>{demo?"Pacjent "+String.fromCharCode(65+i):name}</div>
                        <div style={{fontSize:11,color:sub}}>{c} {c===1?"wizyta":c<5?"wizyty":"wizyt"}</div>
                      </div>
                    </div>
                    <span style={{fontSize:13,fontWeight:700,color:"#3DAA72"}}>{demo?"****":v.toFixed(2)} zł</span>
                  </div>
                ))}
                {topPats.length>5&&<button onClick={()=>setShowAllPats(v=>!v)} style={{width:"100%",marginTop:10,padding:"8px 0",borderRadius:10,border:"none",background:"none",cursor:"pointer",fontWeight:600,fontSize:12,color:"#0A7C7C",fontFamily:"inherit"}}>{showAllPats?"Pokaż mniej ↑":"Pokaż wszystkich ("+topPats.length+") ↓"}</button>}
              </div>}

              <div style={{fontSize:11,fontWeight:700,color:sub,textTransform:"uppercase",letterSpacing:.5,margin:"16px 0 8px"}}>Wpisy</div>
              {listEntries.length===0&&<Empty text="Brak przychodów w tym okresie"/>}
              {listEntries.map(f=>(
                <Card key={f.id} onClick={()=>setEditE({...f,amount:String(f.amount)})}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div style={{minWidth:0,flex:1}}>
                      <div style={{fontWeight:600,fontSize:14,color:dk?"#E8F5F5":"#1C2B3A"}}>{demo?f.category:f.description||f.category}</div>
                      <div style={{fontSize:12,color:sub,marginTop:2,display:"flex",alignItems:"center",gap:6}}>{f.date} · <Badge color={catColors[f.category]||"#7A8FA6"}>{f.category}</Badge></div>
                    </div>
                    <span style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:16,color:"#3DAA72",marginLeft:8,flexShrink:0}}>+{demo?"****":f.amount} zł</span>
                  </div>
                </Card>
              ))}

              {viewMode==="year"&&<div style={{background:bg2,borderRadius:16,padding:"16px",marginTop:12,boxShadow:"0 1px 4px rgba(0,0,0,.06)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span style={{fontSize:12,color:sub,fontWeight:600}}>📣 Koszt marketingu (cały rok)</span>
                <span style={{fontSize:15,fontWeight:800,color:"#E05C5C"}}>{demo?"****":yearMarketingSpend.toFixed(2)+" zł"}</span>
              </div>}
            </>}

          </div>
        </div>

        {showAdd&&<Modal title="Nowy przychód" onClose={()=>setShowAdd(false)}>
          <Sel label="Kategoria" value={form.category} onChange={v=>setForm(f=>({...f,category:v}))} options={cats.map(c=>({value:c,label:c}))}/>
          <Inp label="Kwota (zł) *" value={form.amount} onChange={v=>setForm(f=>({...f,amount:v}))} type="number" placeholder="150"/>
          <Inp label="Opis" value={form.description} onChange={v=>setForm(f=>({...f,description:v}))} placeholder="np. wizyta u Jana Kowalskiego"/>
          <Inp label="Data" value={form.date} onChange={v=>setForm(f=>({...f,date:v}))} type="date"/>
          <Btn disabled={!form.amount} style={{width:"100%",justifyContent:"center"}} onClick={()=>{if(!form.amount)return;setFinances(fs=>[{...form,id:Date.now(),type:"przychód",amount:+form.amount},...fs]);setForm(ef());setShowAdd(false);setToast("Wpis dodany");}}>Zapisz</Btn>
        </Modal>}

        {editE&&<Modal title="Edytuj wpis" onClose={()=>setEditE(null)}>
          <Sel label="Kategoria" value={editE.category||"Wizyta"} onChange={v=>setEditE(f=>({...f,category:v}))} options={cats.map(c=>({value:c,label:c}))}/>
          <Inp label="Kwota (zł)" value={editE.amount} onChange={v=>setEditE(f=>({...f,amount:v}))} type="number"/>
          <Inp label="Opis" value={editE.description||""} onChange={v=>setEditE(f=>({...f,description:v}))}/>
          <Inp label="Data" value={editE.date} onChange={v=>setEditE(f=>({...f,date:v}))} type="date"/>
          <Btn style={{width:"100%",justifyContent:"center",marginBottom:8}} onClick={()=>{setFinances(fs=>fs.map(f=>f.id===editE.id?{...f,...editE,amount:+editE.amount}:f));setEditE(null);setToast("Zmiany zapisane");}}>Zapisz zmiany</Btn>
          <Btn variant="danger" style={{width:"100%",justifyContent:"center"}} onClick={()=>{deleteWithSource(editE);setEditE(null);}}>🗑️ Usuń wpis</Btn>
        </Modal>}
        {toast&&<Toast msg={toast} onDone={()=>setToast(null)}/>}
      </>;
    }

    

    // ── RECEIPT SCANNER ───────────────────────────────────────────────────────
    function ReceiptScanner({onClose,onConfirm,expCats,incCats,memory,setMemory,selMonth,existingExpenses,anthropicKey}) {
      const dk=useContext(DarkCtx);
      const bg2=dk?"#1A2A2A":"#fff";
      const border=dk?"#2A4040":"#E4EAF0";
      const sub="#7A8FA6";

      const [images,setImages]=useState([]); // base64 strings
      const [step,setStep]=useState("upload"); // upload | analyzing | review | done
      const [items,setItems]=useState([]); // {id, name, amount, cat, subcat, confidence, discount, isDiscount}
      const [receiptDate,setReceiptDate]=useState(todayLocal());
      const [receiptTotal,setReceiptTotal]=useState("");
      const [aiError,setAiError]=useState(null);
      const [dupWarning,setDupWarning]=useState(false);

      const allExpCatNames=expCats.flatMap(c=>[c.name,...(c.subs||[]).map(s=>c.name+"/"+s)]);

      const addImage=(e)=>{
        const files=Array.from(e.target.files);
        files.forEach(file=>{
          const reader=new FileReader();
          reader.onload=ev=>{
            const b64=ev.target.result.split(",")[1];
            setImages(prev=>[...prev,{b64,mime:file.type,preview:ev.target.result}]);
          };
          reader.readAsDataURL(file);
        });
      };

      const removeImage=(i)=>setImages(prev=>prev.filter((_,j)=>j!==i));

      const analyze=async()=>{
        if(!images.length)return;
        setStep("analyzing");
        setAiError(null);

        const memoryHints=Object.entries(memory||{}).slice(0,40).map(([k,v])=>`"${k}" => "${v}"`).join(", ");
        const catList=allExpCatNames.join(", ");

        const prompt=`Jesteś asystentem do analizy paragonów. Przeanalizuj paragon(y) na zdjęciach.

Dostępne kategorie kosztów: ${catList}
${memoryHints?`Zapamiętane przypisania produktów: ${memoryHints}`:""}

Zwróć TYLKO JSON (bez markdown) w formacie:
{
  "date": "YYYY-MM-DD lub null jeśli nieczytelna",
  "total": liczba (suma z paragonu, pole SUMA/RAZEM/DO ZAPŁATY),
  "items": [
    {
      "name": "nazwa z paragonu",
      "amount": liczba (kwota po rabacie),
      "cat": "kategoria z listy lub null",
      "subcat": "podkategoria lub null",
      "confidence": "high|medium|low",
      "isDiscount": false,
      "discountApplied": liczba lub 0
    }
  ],
  "unreadable": ["linia której nie mogłem odczytać"]
}

Zasady:
- Jeśli pozycja to rabat/promocja/zniżka: isDiscount=true, amount=wartość rabatu (ujemna liczba), odejmij od poprzedniej pozycji
- Nie wliczaj linii z VAT, numerem NIP, adresem sklepu, podsumowaniami
- Dla pozycji ilość×cena: amount = wynik mnożenia
- Jeśli nie możesz przypisać kategorii: cat=null
- Data: szukaj na paragonie w formatach DD.MM.YYYY, DD-MM-YYYY, YYYY-MM-DD — zwróć jako YYYY-MM-DD. Jeśli data nieczytelna lub jej nie ma — zwróć null (NIE zgaduj daty)`;

        try {
          const content=[
            {type:"text",text:prompt},
            ...images.map(img=>({type:"image",source:{type:"base64",media_type:img.mime,data:img.b64}}))
          ];

          if(!anthropicKey){setAiError("Brak klucza API — dodaj go w Ustawieniach");setStep("upload");return;}
          const resp=await fetch("https://api.anthropic.com/v1/messages",{
            method:"POST",
            headers:{"Content-Type":"application/json","x-api-key":anthropicKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
            body:JSON.stringify({
              model:"claude-haiku-4-5-20251001",
              max_tokens:4000,
              messages:[{role:"user",content}]
            })
          });

          const data=await resp.json();
          if(!resp.ok||data.error){
            setAiError("Błąd API: "+(data.error?.message||data.error||resp.status));
            setStep("upload");
            return;
          }
          const text=data.content?.[0]?.text||"";
          if(!text){
            setAiError("Pusta odpowiedź — spróbuj ponownie");
            setStep("upload");
            return;
          }
          // Extract JSON - find first { and last }
          const jsonStart=text.indexOf("{");
          const jsonEnd=text.lastIndexOf("}");
          if(jsonStart===-1||jsonEnd===-1){
            setAiError("AI nie zwrócił poprawnych danych. Spróbuj z wyraźniejszym zdjęciem.");
            setStep("upload");
            return;
          }
          const clean=text.slice(jsonStart,jsonEnd+1);
          let parsed;
          try {
            parsed=JSON.parse(clean);
          } catch(pe) {
            setAiError("Błąd parsowania. Spróbuj z lepszym zdjęciem.");
            setStep("upload");
            return;
          }

          // Build items list
          const newItems=(parsed.items||[]).filter(i=>!i.isDiscount).map((i,idx)=>({
            id:idx,
            name:i.name||"?",
            amount:Math.max(0,+i.amount||0),
            cat:i.cat||null,
            subcat:i.subcat||null,
            confidence:i.confidence||"low",
            discountApplied:i.discountApplied||0,
            unreadable:false
          }));

          // Add unreadable items
          (parsed.unreadable||[]).forEach((line,idx)=>{
            newItems.push({id:1000+idx,name:line,amount:0,cat:null,subcat:null,confidence:"low",unreadable:true});
          });

          setItems(newItems);
          if(parsed.date)setReceiptDate(parsed.date);
          else setReceiptDate(todayLocal());
          if(parsed.total)setReceiptTotal(String(parsed.total));

          // Check duplicate — sprawdź w miesiącu daty paragonu
          const day=parsed.date||receiptDate;
          const sameDayTotal=existingExpenses.filter(e=>e.date===day).reduce((s,e)=>s+(+e.amount||0),0);
          if(parsed.total&&sameDayTotal>0&&day.slice(0,7)===selMonth)setDupWarning(true);

          setStep("review");
        } catch(err) {
          setAiError("Błąd analizy: "+err.message);
          setStep("upload");
        }
      };

      const updateItem=(id,field,val)=>{
        setItems(prev=>prev.map(i=>i.id===id?{...i,[field]:val}:i));
      };
      const updateItemFields=(id,fields)=>{
        setItems(prev=>prev.map(i=>i.id===id?{...i,...fields}:i));
      };
      const removeItem=(id)=>setItems(prev=>prev.filter(i=>i.id!==id));
      const addItem=()=>setItems(prev=>[...prev,{id:Date.now(),name:"",amount:0,cat:null,subcat:null,confidence:"high",unreadable:false,discountApplied:0}]);

      const itemsSum=items.reduce((s,i)=>s+(+i.amount||0),0);
      const totalNum=+receiptTotal||0;
      const diff=totalNum>0?Math.abs(itemsSum-totalNum):0;
      const diffOk=diff<=0.05;

      const confirm=()=>{
        // Group by cat/subcat
        const groups={};
        items.forEach(i=>{
          if(!i.amount||!i.cat)return;
          const key=(i.cat+(i.subcat?"/"+i.subcat:""));
          groups[key]=(groups[key]||{cat:i.cat,subcat:i.subcat||"",total:0});
          groups[key].total+=(+i.amount||0);
        });

        // Save memory — only high/medium confidence corrections
        const newMem={...memory};
        items.forEach(i=>{
          if(i.cat&&i.name&&i.name!=="?")newMem[i.name.toUpperCase()]=i.cat+(i.subcat?"/"+i.subcat:"");
        });
        setMemory(newMem);

        const store=Object.values(groups)
          .filter(g=>g.total>0)
          .map(g=>({
            id:Date.now()+Math.random(),
            cat:g.cat,subcat:g.subcat,
            desc:"Paragon "+receiptDate,
            amount:Math.round(g.total*100)/100,
            date:receiptDate
          }));

        onConfirm(store,receiptDate);
      };

      const catOptions=(type)=>{
        const cats=type==="exp"?expCats:incCats;
        const opts=[{value:"",label:"— wybierz —"}];
        cats.forEach(c=>{
          opts.push({value:c.name,label:c.name});
          (c.subs||[]).forEach(s=>opts.push({value:c.name+"\x1F"+s,label:"  ↳ "+s}));
        });
        return opts;
      };

      const inputStyle={padding:"6px 10px",borderRadius:8,border:`1.5px solid ${border}`,background:dk?"#0F1F1F":"#FAFCFD",color:dk?"#E8F5F5":"#1C2B3A",fontSize:13,fontFamily:"inherit",width:"100%"};

      return <Modal title="📷 Skanuj paragon" onClose={onClose}>
        {step==="upload"&&<>
          <div style={{marginBottom:12}}>
            <div style={{fontSize:13,color:sub,marginBottom:10}}>Dodaj zdjęcie(a) paragonu. Możesz dodać kilka dla długich paragonów.</div>
            <label style={{display:"block",border:`2px dashed ${border}`,borderRadius:12,padding:"20px",textAlign:"center",cursor:"pointer",background:dk?"#0F1F1F":"#F7FAFA"}}>
              <div style={{fontSize:24,marginBottom:4}}>📷</div>
              <div style={{fontSize:13,fontWeight:600,color:"#0A7C7C"}}>Dodaj zdjęcie</div>
              <div style={{fontSize:11,color:sub,marginTop:2}}>lub kilka zdjęć naraz</div>
              <input type="file" accept="image/*" multiple onChange={addImage} style={{display:"none"}}/>
            </label>
          </div>
          {images.length>0&&<>
            <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}>
              {images.map((img,i)=><div key={i} style={{position:"relative",width:70,height:70}}>
                <img src={img.preview} style={{width:70,height:70,objectFit:"cover",borderRadius:8,border:`1px solid ${border}`}}/>
                <button onClick={()=>removeImage(i)} style={{position:"absolute",top:-6,right:-6,width:20,height:20,borderRadius:10,background:"#E05C5C",color:"#fff",border:"none",cursor:"pointer",fontSize:12,display:"flex",alignItems:"center",justifyContent:"center",lineHeight:1}}>×</button>
              </div>)}
            </div>
            <Btn style={{width:"100%",justifyContent:"center"}} onClick={analyze}>Analizuj paragon{images.length>1?"y":""}</Btn>
          </>}
          {aiError&&<div style={{color:"#E05C5C",fontSize:13,marginTop:8,padding:"10px 12px",background:"#FEE2E2",borderRadius:10}}>{aiError}</div>}
        </>}

        {step==="analyzing"&&<div style={{textAlign:"center",padding:"40px 20px"}}>
          <div style={{fontSize:32,marginBottom:12}}>🔍</div>
          <div style={{fontWeight:600,fontSize:15,marginBottom:6}}>Analizuję paragon...</div>
          <div style={{fontSize:13,color:sub}}>Rozpoznaję pozycje i przypisuję kategorie</div>
        </div>}

        {step==="review"&&<>
          {dupWarning&&<div style={{background:"#FEF3C7",borderRadius:10,padding:"10px 14px",marginBottom:12,fontSize:13,color:"#92400E"}}>
            ⚠️ W tym dniu masz już wpisy kosztów. Możliwy duplikat — sprawdź.
          </div>}

          <div style={{display:"flex",gap:8,marginBottom:12,alignItems:"center"}}>
            <div style={{flex:1}}>
              <div style={{fontSize:11,color:sub,fontWeight:600,marginBottom:3}}>DATA PARAGONU</div>
              <input type="date" value={receiptDate} onChange={e=>setReceiptDate(e.target.value)} style={inputStyle}/>
            </div>
            <div style={{flex:1}}>
              <div style={{fontSize:11,color:sub,fontWeight:600,marginBottom:3}}>KWOTA Z PARAGONU</div>
              <input type="number" value={receiptTotal} onChange={e=>setReceiptTotal(e.target.value)} placeholder="0.00" style={inputStyle}/>
            </div>
          </div>

          <div style={{marginBottom:12}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
              <div style={{fontSize:11,color:sub,fontWeight:600}}>POZYCJE ({items.length})</div>
              <button onClick={addItem} style={{background:"#0A7C7C",color:"#fff",border:"none",borderRadius:8,padding:"4px 10px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>+ Dodaj</button>
            </div>
            {items.map(item=>(
              <div key={item.id} style={{background:item.unreadable?(dk?"#2A1A1A":"#FFF5F5"):(item.cat?( dk?"#0F1F1F":"#F7FAF9"):(dk?"#1A1A2A":"#F5F5FF")),borderRadius:10,padding:"10px 12px",marginBottom:6,border:`1px solid ${item.unreadable?"#E05C5C":item.cat?border:"#A78BFA"}`}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8,marginBottom:6}}>
                  <div style={{flex:1}}>
                    <input value={item.name} onChange={e=>updateItem(item.id,"name",e.target.value)} style={{width:"100%",padding:"4px 8px",borderRadius:7,border:`1px solid ${border}`,background:"transparent",color:dk?"#E8F5F5":"#1C2B3A",fontSize:12,fontWeight:600,fontFamily:"inherit"}}/>
                    {item.discountApplied>0&&<div style={{fontSize:10,color:"#3DAA72"}}>rabat: -{item.discountApplied.toFixed(2)} zł</div>}
                    {item.unreadable&&<div style={{fontSize:10,color:"#E05C5C"}}>⚠️ Nieodczytana pozycja — wpisz kwotę ręcznie</div>}
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:4}}>
                    <input type="number" value={item.amount||""} onChange={e=>updateItem(item.id,"amount",+e.target.value)} placeholder="0.00"
                      style={{width:75,padding:"4px 8px",borderRadius:7,border:`1.5px solid ${border}`,background:dk?"#0F1F1F":"#fff",color:dk?"#E8F5F5":"#1C2B3A",fontSize:13,fontFamily:"inherit",textAlign:"right"}}/>
                    <button onClick={()=>removeItem(item.id)} style={{width:26,height:26,borderRadius:7,background:"#FEE2E2",border:"none",color:"#E05C5C",cursor:"pointer",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>×</button>
                  </div>
                </div>
                <select value={(item.cat&&item.subcat)?item.cat+"\x1F"+item.subcat:(item.cat||"")}
                  onChange={e=>{const val=e.target.value;if(!val){updateItemFields(item.id,{cat:null,subcat:null});}else if(val.includes("\x1F")){const idx=val.indexOf("\x1F");updateItemFields(item.id,{cat:val.slice(0,idx),subcat:val.slice(idx+1)});}else{updateItemFields(item.id,{cat:val,subcat:null});}}}
                  style={{...inputStyle,fontSize:12}}>
                  {catOptions("exp").map(o=><option key={o.value} value={o.value}>{o.label}</option>)}
                </select>
                {item.confidence==="low"&&item.cat&&<div style={{fontSize:10,color:"#F59E0B",marginTop:3}}>⚡ Niska pewność — sprawdź kategorię</div>}
              </div>
            ))}
          </div>

          <div style={{background:dk?"#1A2A2A":"#F0F9F5",borderRadius:10,padding:"12px 14px",marginBottom:12}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
              <span style={{fontSize:13,color:sub}}>Suma pozycji:</span>
              <span style={{fontWeight:700,fontSize:13,color:dk?"#E8F5F5":"#1C2B3A"}}>{itemsSum.toFixed(2)} zł</span>
            </div>
            {totalNum>0&&<div style={{display:"flex",justifyContent:"space-between"}}>
              <span style={{fontSize:13,color:sub}}>Kwota z paragonu:</span>
              <span style={{fontWeight:700,fontSize:13,color:dk?"#E8F5F5":"#1C2B3A"}}>{totalNum.toFixed(2)} zł</span>
            </div>}
            {totalNum>0&&!diffOk&&<div style={{marginTop:6,padding:"6px 10px",background:"#FEF3C7",borderRadius:8,fontSize:12,color:"#92400E"}}>
              ⚠️ Różnica: {diff.toFixed(2)} zł — sprawdź pozycje lub skoryguj kwoty
            </div>}
            {totalNum>0&&diffOk&&<div style={{marginTop:6,fontSize:12,color:"#3DAA72",fontWeight:600}}>✓ Kwoty się zgadzają</div>}
          </div>

          {items.some(i=>!i.cat&&i.amount>0)&&<div style={{background:"#FEF3C7",borderRadius:10,padding:"10px 14px",marginBottom:12,fontSize:12,color:"#92400E"}}>
            ⚠️ {items.filter(i=>!i.cat&&i.amount>0).length} pozycji bez kategorii — nie zostaną dodane do budżetu
          </div>}

          <div style={{display:"flex",gap:8}}>
            <Btn variant="secondary" style={{flex:1,justifyContent:"center"}} onClick={()=>setStep("upload")}>← Wróć</Btn>
            <Btn style={{flex:1,justifyContent:"center"}} onClick={confirm}>Dodaj do budżetu ✓</Btn>
          </div>
        </>}
      </Modal>;
    }


    // ── BUDGET ────────────────────────────────────────────────────────────────
    function CatMgrSection({type,cats,color,border,sub,dk,editCat,setEditCat,moveCat,renameCat,delCat,addSub,moveSub,renameSub,delSub,addCat}) {
      const nameRef=useRef(null);
      const subRefs=useRef({});
      return (
        <div style={{marginBottom:20}}>
          <div style={{fontSize:12,fontWeight:700,color,textTransform:"uppercase",letterSpacing:.5,marginBottom:8}}>{type==="income"?"Przychody":"Koszty"}</div>
          {cats.map((cat,ci)=>(
            <div key={ci} style={{marginBottom:8,border:`1px solid ${border}`,borderRadius:10,overflow:"hidden"}}>
              <div style={{display:"flex",alignItems:"center",gap:4,padding:"8px 10px",background:dk?"#0F1F1F":"#F7F9FB"}}>
                <div style={{display:"flex",flexDirection:"column",gap:0}}>
                  <button onClick={()=>moveCat(type,ci,-1)} disabled={ci===0} style={{background:"none",border:"none",cursor:ci===0?"default":"pointer",color:ci===0?border:sub,fontSize:11,lineHeight:1,padding:"1px 3px"}}>▲</button>
                  <button onClick={()=>moveCat(type,ci,1)} disabled={ci===cats.length-1} style={{background:"none",border:"none",cursor:ci===cats.length-1?"default":"pointer",color:ci===cats.length-1?border:sub,fontSize:11,lineHeight:1,padding:"1px 3px"}}>▼</button>
                </div>
                {editCat&&editCat.type===type&&editCat.catIdx===ci&&editCat.field==="name"
                  ?<><input autoFocus value={editCat.value} onChange={e=>setEditCat(ec=>({...ec,value:e.target.value}))}
                      style={{flex:1,padding:"5px 8px",borderRadius:7,border:`1.5px solid ${color}`,background:dk?"#0F1F1F":"#fff",color:dk?"#E8F5F5":"#1C2B3A",fontSize:14,fontFamily:"inherit"}}/>
                    <button onClick={()=>renameCat(type,ci,editCat.value)} style={{background:color,color:"#fff",border:"none",borderRadius:7,padding:"5px 10px",fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>✓</button>
                    <button onClick={()=>setEditCat(null)} style={{background:"none",border:"none",color:sub,cursor:"pointer",fontSize:16}}>×</button></>
                  :<><span style={{flex:1,fontSize:14,fontWeight:600,color:dk?"#C8E8E8":"#1C2B3A"}}>{cat.name}</span>
                    <button onClick={()=>setEditCat({type,catIdx:ci,field:"name",value:cat.name})} style={{background:"none",border:"none",color:sub,cursor:"pointer",padding:"0 4px",fontSize:13}}>✏️</button>
                    <button onClick={()=>delCat(type,ci)} style={{background:"none",border:"none",color:"#E05C5C",cursor:"pointer",fontSize:16,lineHeight:1}}>×</button></>
                }
              </div>
              {(cat.subs||[]).map((s2,si)=>(
                <div key={si} style={{display:"flex",alignItems:"center",gap:4,padding:"6px 10px 6px 28px",borderTop:`1px solid ${border}`}}>
                  <div style={{display:"flex",flexDirection:"column",gap:0}}>
