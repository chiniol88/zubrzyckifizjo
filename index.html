<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="theme-color" content="#0A7C7C"/>
  <title>ZubrzyckiFizjo</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap');
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;background:#F2F5F7;color:#1C2B3A;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
    input,select,textarea,button{font-family:'DM Sans',sans-serif;-webkit-tap-highlight-color:transparent}
    ::-webkit-scrollbar{display:none}*{scrollbar-width:none}
    .loader{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:16px;background:#F2F5F7}
    .spinner{width:40px;height:40px;border:3px solid #E4EAF0;border-top-color:#0A7C7C;border-radius:50%;animation:spin 0.8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="js/core.js"></script>
  <script type="text/babel">
    function Toast({msg,onDone}) {
      useEffect(()=>{const t=setTimeout(onDone,2200);return()=>clearTimeout(t);},[]);
      return <div style={{position:"fixed",bottom:90,left:"50%",transform:"translateX(-50%)",background:"#1C2B3A",color:"#fff",borderRadius:14,padding:"12px 20px",fontSize:14,fontWeight:600,zIndex:999,boxShadow:"0 4px 20px rgba(0,0,0,.25)",whiteSpace:"nowrap",display:"flex",alignItems:"center",gap:8}}><span style={{color:"#3DAA72",fontSize:16}}>✓</span>{msg}</div>;
    }

    function Modal({title,onClose,children}) {
      const dk=useContext(DarkCtx);
      const scrollRef=useRef(null);
      const scrollPos=useRef(0);
      useEffect(()=>{
        const el=scrollRef.current;
        if(!el)return;
        const save=()=>{scrollPos.current=el.scrollTop;};
        el.addEventListener("scroll",save,{passive:true});
        return()=>el.removeEventListener("scroll",save);
      },[]);
      useEffect(()=>{
        if(scrollRef.current)scrollRef.current.scrollTop=scrollPos.current;
      });
      return <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",zIndex:100,display:"flex",alignItems:"flex-end",justifyContent:"center"}} onClick={e=>e.target===e.currentTarget&&onClose()}>
        <div ref={scrollRef} style={{background:dk?"#0F1F1F":"#fff",borderRadius:"24px 24px 0 0",width:"100%",maxWidth:480,maxHeight:"92vh",overflowY:"auto",padding:"20px 20px 40px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
            <div style={{fontFamily:"'Syne',sans-serif",fontSize:19,fontWeight:700,color:dk?"#E8F5F5":"#1C2B3A"}}>{title}</div>
            <button onClick={onClose} style={{background:dk?"#1A2A2A":"#F2F5F7",border:"none",borderRadius:10,width:32,height:32,cursor:"pointer",fontSize:18,color:"#7A8FA6",display:"flex",alignItems:"center",justifyContent:"center"}}>×</button>
          </div>
          {children}
        </div>
      </div>;
    }

    function Inp({label,value,onChange,type="text",placeholder=""}) {
      const dk=useContext(DarkCtx);
      const s={width:"100%",padding:"13px 16px",border:`1.5px solid ${dk?"#2A4040":"#E4EAF0"}`,borderRadius:12,fontSize:16,outline:"none",background:dk?"#0F1F1F":"#FAFCFD",color:dk?"#E8F5F5":"#1C2B3A",fontFamily:"inherit"};
      return <div style={{marginBottom:14}}>
        {label&&<div style={{fontSize:13,fontWeight:600,color:dk?"#5A8A8A":"#4A6070",marginBottom:5,textTransform:"uppercase",letterSpacing:.5}}>{label}</div>}
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <input type={type} value={value||""} placeholder={placeholder} onChange={e=>onChange(e.target.value)} style={{...s,flex:1}}/>
          {type==="date"&&value&&<button onClick={()=>onChange("")} style={{flexShrink:0,background:"none",border:"none",color:"#E05C5C",fontSize:22,cursor:"pointer",padding:"0 2px",lineHeight:1,fontFamily:"inherit"}}>×</button>}
        </div>
      </div>;
    }
    function Txa({label,value,onChange,rows=3,placeholder=""}) {
      const dk=useContext(DarkCtx);
      const s={width:"100%",padding:"13px 16px",border:`1.5px solid ${dk?"#2A4040":"#E4EAF0"}`,borderRadius:12,fontSize:16,outline:"none",background:dk?"#0F1F1F":"#FAFCFD",color:dk?"#E8F5F5":"#1C2B3A",fontFamily:"inherit",resize:"vertical"};
      return <div style={{marginBottom:14}}>
        {label&&<div style={{fontSize:13,fontWeight:600,color:dk?"#5A8A8A":"#4A6070",marginBottom:5,textTransform:"uppercase",letterSpacing:.5}}>{label}</div>}
        <textarea value={value||""} rows={rows} placeholder={placeholder} onChange={e=>onChange(e.target.value)} style={s}/>
      </div>;
    }
    function Sel({label,value,onChange,options}) {
      const dk=useContext(DarkCtx);
      const s={width:"100%",padding:"13px 16px",border:`1.5px solid ${dk?"#2A4040":"#E4EAF0"}`,borderRadius:12,fontSize:16,outline:"none",background:dk?"#0F1F1F":"#FAFCFD",color:dk?"#E8F5F5":"#1C2B3A",fontFamily:"inherit"};
      return <div style={{marginBottom:14}}>
        {label&&<div style={{fontSize:13,fontWeight:600,color:dk?"#5A8A8A":"#4A6070",marginBottom:5,textTransform:"uppercase",letterSpacing:.5}}>{label}</div>}
        <select value={value} onChange={e=>onChange(e.target.value)} style={s}>
          {options.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}
        </select>
      </div>;
    }
    function TimeSel({label,value,onChange}) {
      const dk=useContext(DarkCtx);
      const s={width:"100%",padding:"13px 16px",border:`1.5px solid ${dk?"#2A4040":"#E4EAF0"}`,borderRadius:12,fontSize:16,outline:"none",background:dk?"#0F1F1F":"#FAFCFD",color:dk?"#E8F5F5":"#1C2B3A",fontFamily:"inherit"};
      const opts=[];
      for(let h=0;h<24;h++)for(let m=0;m<60;m+=5){const hh=String(h).padStart(2,"0"),mm=String(m).padStart(2,"0");opts.push(hh+":"+mm);}
      return <div style={{marginBottom:14}}>
        {label&&<div style={{fontSize:13,fontWeight:600,color:dk?"#5A8A8A":"#4A6070",marginBottom:5,textTransform:"uppercase",letterSpacing:.5}}>{label}</div>}
        <select value={value||"10:00"} onChange={e=>onChange(e.target.value)} style={s}>
          {opts.map(o=><option key={o} value={o}>{o}</option>)}
        </select>
      </div>;
    }
    function PatientPicker({label,value,onChange,onSelect,patients}) {
      const dk=useContext(DarkCtx);
      const [open,setOpen]=useState(false);
      const matches=(patients||[]).filter(p=>value&&p.name.toLowerCase().includes(value.toLowerCase())).slice(0,6);
      return <div style={{marginBottom:14,position:"relative"}}>
        {label&&<div style={{fontSize:13,fontWeight:600,color:dk?"#5A8A8A":"#4A6070",marginBottom:5,textTransform:"uppercase",letterSpacing:.5}}>{label}</div>}
        <input value={value||""} placeholder="Wpisz imię pacjenta..." onChange={e=>{onChange(e.target.value);setOpen(true);}} onFocus={()=>setOpen(true)} onBlur={()=>setTimeout(()=>setOpen(false),150)}
          style={{width:"100%",padding:"13px 16px",border:`1.5px solid ${dk?"#2A4040":"#E4EAF0"}`,borderRadius:12,fontSize:16,outline:"none",background:dk?"#0F1F1F":"#FAFCFD",color:dk?"#E8F5F5":"#1C2B3A",fontFamily:"inherit"}}/>
        {open&&matches.length>0&&<div style={{position:"absolute",top:"100%",left:0,right:0,background:dk?"#1A2A2A":"#fff",borderRadius:12,boxShadow:"0 4px 20px rgba(0,0,0,.18)",zIndex:200,overflow:"hidden"}}>
          {matches.map(p=><div key={p.id} onPointerDown={e=>{e.preventDefault();onChange(p.name);if(onSelect)onSelect(p);setOpen(false);}} style={{padding:"12px 16px",cursor:"pointer",borderBottom:`1px solid ${dk?"#2A4040":"#F2F5F7"}`,fontSize:14,fontWeight:500,color:dk?"#E8F5F5":"#1C2B3A"}}>
            {p.name} <span style={{color:"#7A8FA6",fontSize:12}}>{p.phone}</span>
          </div>)}
        </div>}
      </div>;
    }
    function ClockDisplay() {
      const [t,setT]=useState(()=>new Date().toLocaleTimeString("pl-PL",{hour:"2-digit",minute:"2-digit"}));
      useEffect(()=>{const i=setInterval(()=>setT(new Date().toLocaleTimeString("pl-PL",{hour:"2-digit",minute:"2-digit"})),1000);return()=>clearInterval(i);},[]);
      return <span>{t}</span>;
    }

    const ICS_URL = "https://xqjrlzsdfyjeajfkathx.supabase.co/functions/v1/ics";
    function openICS(arg) {
      const p = new URLSearchParams();
      p.set("title", arg.summary||"");
      const hasTime = (arg.dtStart||"").includes("T");
      if(hasTime) {
        const [d,t] = arg.dtStart.split("T");
        p.set("date", d); p.set("time", t.slice(0,5));
        if(arg.dtEnd&&arg.dtEnd.includes("T")){const[d2,t2]=arg.dtEnd.split("T");p.set("endDate",d2);p.set("endTime",t2.slice(0,5));}
      } else {
        p.set("date", arg.dtStart||""); p.set("allDay","1");
      }
      if(arg.description) p.set("desc", arg.description);
      // Use <a> click — Safari handles text/calendar from real URL correctly
      const a = document.createElement("a");
      a.href = ICS_URL+"?"+p.toString();
      a.rel = "noopener";
      document.body.appendChild(a);
      a.click();
      setTimeout(()=>document.body.removeChild(a), 1000);
    }
    function makeICS(summary, dtStart, dtEnd, description, allDay) {
      return {summary, dtStart, dtEnd, description, allDay};
    }
    function openGCal(summary, dtStart, dtEnd, description, allDay) {
      openICS({summary, dtStart, dtEnd, description, allDay});
    }

    function getHolidays(year) {
      const a=year%19,b=Math.floor(year/100),c=year%100;
      const d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25);
      const g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30;
      const i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7;
      const m=Math.floor((a+11*h+22*l)/451);
      const month=Math.floor((h+l-7*m+114)/31);
      const day=((h+l-7*m+114)%31)+1;
      const easter=new Date(year,month-1,day);
      const fmt=(d)=>{const y=d.getFullYear(),mo=String(d.getMonth()+1).padStart(2,"0"),dd=String(d.getDate()).padStart(2,"0");return y+"-"+mo+"-"+dd;};
      const add=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r;};
      // Mapa: "YYYY-MM-DD" -> nazwa święta
      const holidays=new Map([
        [year+"-01-01","Nowy Rok"],
        [year+"-01-06","Trzech Króli"],
        [fmt(easter),"Wielkanoc"],
        [fmt(add(easter,1)),"Lany Poniedziałek"],
        [year+"-05-01","Święto Pracy"],
        [year+"-05-03","Święto Konstytucji 3 Maja"],
        [fmt(add(easter,60)),"Boże Ciało"],
        [year+"-08-15","Wniebowzięcie NMP"],
        [year+"-11-01","Wszystkich Świętych"],
        [year+"-11-11","Święto Niepodległości"],
        [year+"-12-24","Wigilia"],
        [year+"-12-25","Boże Narodzenie"],
        [year+"-12-26","Drugi dzień Bożego Narodzenia"],
      ]);
      return holidays;
    }

    function MiniCalendar({visits,rentals,today,onEditVisit,onAddVisit,onGoToRental,events,setEvents,patients}) {
      const dk=useContext(DarkCtx);
      const demo=useDemo();
      const [calYear,setCalYear]=useState(()=>+today.slice(0,4));
      const [calMonth,setCalMonth]=useState(()=>+today.slice(5,7));
      const [openDay,setOpenDay]=useState(null);
      const [showEvtModal,setShowEvtModal]=useState(false);
      const [evtForm,setEvtForm]=useState({title:"",date:"",allDay:false,time:"10:00",notes:"",address:"",editId:null});
      const [quickRental,setQuickRental]=useState(null);

      const daysInMonth=new Date(calYear,calMonth,0).getDate();
      const firstDow=new Date(calYear,calMonth-1,1).getDay();
      const startOffset=(firstDow+6)%7;
      const monthStr=calYear+"-"+String(calMonth).padStart(2,"0");
      const prevMonthStr=calMonth===1?`${calYear-1}-12`:`${calYear}-${String(calMonth-1).padStart(2,"0")}`;
      const nextMonthStr=calMonth===12?`${calYear+1}-01`:`${calYear}-${String(calMonth+1).padStart(2,"0")}`;
      const prevMonthDays=new Date(calYear,calMonth-1,0).getDate();

      const prevMonth=()=>{if(calMonth===1){setCalYear(y=>y-1);setCalMonth(12);}else setCalMonth(m=>m-1);setOpenDay(null);};
      const nextMonth=()=>{if(calMonth===12){setCalYear(y=>y+1);setCalMonth(1);}else setCalMonth(m=>m+1);setOpenDay(null);};

      const rentalEventsByDay=useMemo(()=>{
        const m={};
        const add=(dateStr,ev)=>{if(!m[dateStr])m[dateStr]=[];m[dateStr].push(ev);};
        const visibleMonths=[prevMonthStr,monthStr,nextMonthStr];
        rentals.forEach(r=>{
          if(r.status==="zakończone"&&!visibleMonths.some(ms=>r.startDate.startsWith(ms))&&!visibleMonths.some(ms=>(r.endDate||"").startsWith(ms)))return;
          if(!r.renewable){
            if(visibleMonths.some(ms=>(r.startDate||"").startsWith(ms)))add(r.startDate,{type:"start",r});
            if(visibleMonths.some(ms=>(r.endDate||"").startsWith(ms)))add(r.endDate,{type:"end",r});
            if(r.plannedReturn&&visibleMonths.some(ms=>r.plannedReturn.startsWith(ms)))add(r.plannedReturn,{type:"plannedReturn",r});
          } else {
            (r.cycles||[]).filter(c=>!c.cancelled).forEach(c=>{
              const cd=c.dueDate||c.month+"-01";
              if(visibleMonths.includes(cd.slice(0,7))){
                add(cd,{type:"cycle",c,r});
              }
            });
            if(visibleMonths.some(ms=>r.startDate.startsWith(ms))&&!(r.cycles||[]).some(c=>(c.dueDate||c.month+"-01").startsWith(r.startDate.slice(0,7)))){
              add(r.startDate,{type:"start",r});
            }
            if(r.plannedReturn&&visibleMonths.some(ms=>r.plannedReturn.startsWith(ms))){
              add(r.plannedReturn,{type:"plannedReturn",r});
            }
          }
        });
        return m;
      },[rentals,monthStr,prevMonthStr,nextMonthStr]);

      const visitsByDay=useMemo(()=>{
        const m={};
        const visibleMonths=[prevMonthStr,monthStr,nextMonthStr];
        visits.filter(v=>v.date&&visibleMonths.some(ms=>v.date.startsWith(ms))).forEach(v=>{
          if(!m[v.date])m[v.date]=[];
          m[v.date].push(v);
        });
        return m;
      },[visits,monthStr,prevMonthStr,nextMonthStr]);

      const eventsByDay=useMemo(()=>{
        const m={};
        const visibleMonths=[prevMonthStr,monthStr,nextMonthStr];
        (events||[]).filter(e=>e.date&&visibleMonths.some(ms=>e.date.startsWith(ms))).forEach(e=>{
          if(!m[e.date])m[e.date]=[];
          m[e.date].push(e);
        });
        return m;
      },[events,monthStr,prevMonthStr,nextMonthStr]);

      const saveEvt=()=>{
        if(!evtForm.title.trim()||!evtForm.date)return;
        if(evtForm.editId){
          setEvents(es=>(es||[]).map(e=>e.id===evtForm.editId?{...e,title:evtForm.title.trim(),date:evtForm.date,allDay:evtForm.allDay,time:evtForm.allDay?"":evtForm.time,notes:evtForm.notes,address:evtForm.address||""}:e));
        } else {
          setEvents(es=>[...(es||[]),{id:Date.now(),title:evtForm.title.trim(),date:evtForm.date,allDay:evtForm.allDay,time:evtForm.allDay?"":evtForm.time,notes:evtForm.notes,address:evtForm.address||""}]);
        }
        setShowEvtModal(false);
      };

      const DOW=["Pn","Wt","Śr","Cz","Pt","Sb","Nd"];
      const cells=[];
      for(let i=0;i<startOffset;i++)cells.push({d:prevMonthDays-startOffset+1+i,overflow:"prev",ms:prevMonthStr});
      for(let d=1;d<=daysInMonth;d++)cells.push({d,overflow:null,ms:monthStr});
      const remaining=(7-cells.length%7)%7;
      for(let d=1;d<=remaining;d++)cells.push({d,overflow:"next",ms:nextMonthStr});

      const holidays=useMemo(()=>getHolidays(calYear),[calYear]);

      const openDateStr=openDay||null;
      const dayVisits=openDay?(visitsByDay[openDay]||[]).sort((a,b)=>(a.time||"").localeCompare(b.time||"")):[];
      const dayRentals=openDay?(rentalEventsByDay[openDay]||[]):[];
      const dayEvents=openDay?(eventsByDay[openDay]||[]):[];
      const dayAllDay=[
        ...dayEvents.filter(e=>e.allDay).map(x=>({_kind:"event",e:x})),
        ...dayVisits.filter(v=>v.allDay).map(v=>({_kind:"visit",v})),
        ...dayRentals.filter(ev=>(ev.type==="start"?(ev.r.startAllDay||ev.r.allDay):ev.type==="end"?(ev.r.endAllDay||ev.r.allDay):ev.type==="plannedReturn"?(ev.r.plannedReturnAllDay!==false):false)).map(ev=>({_kind:"rental",ev}))
      ].sort((a,b)=>{
        const ta=a._kind==="event"?a.e.title:a._kind==="visit"?a.v.patientName:a.ev.r.patientName;
        const tb=b._kind==="event"?b.e.title:b._kind==="visit"?b.v.patientName:b.ev.r.patientName;
        return ta.localeCompare(tb);
      });
      const dayTimedAll=openDay?[
        ...dayVisits.filter(v=>!v.allDay).map(v=>({_kind:"visit",_time:v.time||"00:00",v})),
        ...dayEvents.filter(e=>!e.allDay).map(e=>({_kind:"event",_time:e.time||"00:00",e})),
        ...dayRentals.filter(ev=>!(ev.type==="start"?(ev.r.startAllDay||ev.r.allDay):ev.type==="end"?(ev.r.endAllDay||ev.r.allDay):ev.type==="plannedReturn"?(ev.r.plannedReturnAllDay!==false):false)).map(ev=>({_kind:"rental",_time:ev.type==="start"?(ev.r.startTime||"00:00"):ev.type==="end"?(ev.r.endTime||"00:00"):ev.type==="plannedReturn"?(ev.r.plannedReturnTime||"00:00"):"00:00",ev}))
      ].sort((a,b)=>a._time.localeCompare(b._time)):[];

      return <div style={{marginTop:16}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <div style={{fontFamily:"'Syne',sans-serif",fontSize:17,fontWeight:700}}>Kalendarz</div>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <button onClick={prevMonth} style={{background:"#E4EAF0",border:"none",borderRadius:8,width:28,height:28,cursor:"pointer",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center"}}>‹</button>
            <span style={{fontSize:13,fontWeight:600,color:"#1C2B3A",minWidth:100,textAlign:"center",textTransform:"capitalize"}}>{new Date(calYear,calMonth-1,15).toLocaleDateString("pl-PL",{month:"long",year:"numeric"})}</span>
            <button onClick={nextMonth} style={{background:"#E4EAF0",border:"none",borderRadius:8,width:28,height:28,cursor:"pointer",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center"}}>›</button>
          </div>
        </div>

        <div style={{background:dk?"#1A2A2A":"#fff",borderRadius:16,padding:"12px 10px",boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",marginBottom:6}}>
            {DOW.map((d,i)=><div key={d} style={{textAlign:"center",fontSize:11,fontWeight:700,color:i>=5?(dk?"#F4A261":"#D0622A"):"#7A8FA6",padding:"2px 0"}}>{d}</div>)}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2}}>
            {cells.map(({d,overflow,ms},i)=>{
              const isOverflow=overflow!==null;
              const dateStr=ms+"-"+String(d).padStart(2,"0");
              const vc=(visitsByDay[dateStr]||[]).length;
              const rc=(rentalEventsByDay[dateStr]||[]).length;
              const ec=(eventsByDay[dateStr]||[]).length;
              const isToday=dateStr===today;
              const isOpen=dateStr===openDay;
              const colIndex=i%7;
              const isWeekend=colIndex>=5;
              const isHoliday=!isOverflow&&holidays.has(dateStr);
              const overflowColor=dk?"#2A3A3A":"#C8D4D8";
              const normalBg=isHoliday?(dk?"#5A0A0A":"#FCCFCF"):isWeekend?(dk?"rgba(244,162,97,0.22)":"rgba(244,162,97,0.28)"):"transparent";
              const normalColor=isHoliday?"#B71C1C":isWeekend?(dk?"#F4A261":"#C0622A"):(dk?"#C8E8E8":"#1C2B3A");
              return <div key={dateStr} onClick={()=>setOpenDay(isOpen?null:dateStr)} style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"5px 2px",borderRadius:10,cursor:"pointer",opacity:isOverflow?0.45:1,background:isOpen?"#0A7C7C":isToday?(dk?"#0A3030":"#E6F4F4"):isOverflow?"transparent":normalBg}}>
                <span style={{fontSize:13,fontWeight:isToday||isOpen?700:400,color:isOpen?"#fff":isToday?"#0A7C7C":isOverflow?overflowColor:normalColor}}>{d}</span>
                <div style={{display:"flex",gap:2,marginTop:2,minHeight:6}}>
                  {vc>0&&[...Array(Math.min(vc,2))].map((_,j)=><div key={"v"+j} style={{width:4,height:4,borderRadius:"50%",background:isOpen?"rgba(255,255,255,.8)":"#0A7C7C"}}/>)}
                  {rc>0&&[...Array(Math.min(rc,2))].map((_,j)=><div key={"r"+j} style={{width:4,height:4,borderRadius:"50%",background:isOpen?"rgba(255,255,255,.6)":"#7C6AF4"}}/>)}
                  {ec>0&&[...Array(Math.min(ec,2))].map((_,j)=><div key={"e"+j} style={{width:4,height:4,borderRadius:"50%",background:isOpen?"rgba(255,255,255,.6)":"#F4A261"}}/>)}

    // ── DASHBOARD ─────────────────────────────────────────────────────────────
    function Dashboard({visits,setVisits,rentals,setRentals,finances,setFinances,patients,allClients,goToRental,nfzCases,goToWozki,todos,setTodos,events,setEvents}) {
      const demo=useDemo();
      const today = todayLocal();
      const dk=useContext(DarkCtx);
      const [showAdd,setShowAdd]=useState(false);
      const [vf,setVf]=useState(emptyVisit);
      const [editV,setEditV]=useState(null);
      const [confirmDel,setConfirmDel]=useState(null);
      const [toast,setToast]=useState(null);

      const todayV = visits.filter(v=>v.date===today).sort((a,b)=>(a.time||"").localeCompare(b.time||""));
      const upcoming = rentals.filter(r=>r.status==="aktywne"&&r.endDate&&!r.renewable&&!r.reserved).sort((a,b)=>a.endDate.localeCompare(b.endDate)).slice(0,5);
      const reservedRentals = rentals.filter(r=>r.status==="aktywne"&&r.reserved).sort((a,b)=>(a.startDate||"9999").localeCompare(b.startDate||"9999"));
      const unpaidCycles = rentals.filter(r=>r.status==="aktywne"&&r.renewable&&(r.cycles||[]).some(c=>!c.paid&&!c.cancelled));

      const wózkiReminders = useMemo(()=>{
        if(!nfzCases) return [];
        return (nfzCases).filter(cas=>{
          if(!cas.orderDate) return false;
          const nd = nextOrderDate(cas);
          if(!nd) return false;
          const dl = dateDiff(today, nd);
          return dl <= 14;
        }).sort((a,b)=>nextOrderDate(a).localeCompare(nextOrderDate(b)));
      },[nfzCases, today]);

      const birthdayReminders = useMemo(()=>{
        return (patients||[]).filter(p=>{
          if(!p.birthday||p.archived) return false;
          const mmdd=p.birthday.length===5?p.birthday:p.birthday.slice(5);
          const b=new Date(todayLocal().slice(0,4)+"-"+mmdd+"T12:00:00");
          const t=new Date(todayLocal()+"T12:00:00");
          if(b<t) b.setFullYear(b.getFullYear()+1);
          return Math.round((b-t)/86400000)<=7;
        }).map(p=>{
          const mmdd=p.birthday.length===5?p.birthday:p.birthday.slice(5);
          const b=new Date(todayLocal().slice(0,4)+"-"+mmdd+"T12:00:00");
          const t=new Date(todayLocal()+"T12:00:00");
          if(b<t) b.setFullYear(b.getFullYear()+1);
          const days=Math.round((b-t)/86400000);
          const hasYear=p.birthday.length===10;
          const age=hasYear?+todayLocal().slice(0,4)-+p.birthday.slice(0,4)-(mmdd<todayLocal().slice(5)?0:mmdd===todayLocal().slice(5)?0:1):null;
          return {...p,_days:days,_age:age};
        }).sort((a,b)=>a._days-b._days);
      },[patients,today]);

      const syncFinance = (v, isNew=false) => {
        const done = v.status==="zakończona" || new Date(v.date+"T"+(v.time||"00:00")+":00")<=new Date();
        if(!done) return;
        const sid = "visit-"+v.id;
        setFinances(fs=>{
          const exists = fs.some(f=>f.sourceId===sid);
          if(isNew && !exists) return [{id:Date.now()+Math.random(),sourceId:sid,date:v.date,type:"przychód",category:"Wizyta",amount:v.price||0,description:"Wizyta – "+v.patientName},...fs];
          if(!isNew && exists) return fs.map(f=>f.sourceId===sid?{...f,amount:v.price,description:"Wizyta – "+v.patientName,date:v.date}:f);
          if(!isNew && !exists) return [{id:Date.now()+Math.random(),sourceId:sid,date:v.date,type:"przychód",category:"Wizyta",amount:v.price||0,description:"Wizyta – "+v.patientName},...fs];
          return fs;
        });
      };

      const saveNew = () => {
        if(!vf.patientName) return;
        const pat=patients.find(p=>p.name===vf.patientName);
        const nv={id:Date.now(),...vf,price:+vf.price,patientId:pat?.id||null};
        setVisits(vs=>[...vs,nv]);
        syncFinance(nv,true);
        setShowAdd(false); setVf(emptyVisit()); setToast("Wizyta zapisana");
      };
      const saveEdit = () => {
        if(!editV) return;
        const u={...editV,price:+editV.price};
        if(u.id) {
          setVisits(vs=>vs.map(v=>v.id===u.id?{...v,...u}:v));
        } else {
          // stara wizyta bez id — dopasuj po date+time+patientName
          setVisits(vs=>vs.map(v=>(!v.id&&v.date===u.date&&v.time===u.time&&v.patientName===u.patientName)?{...v,...u}:v));
        }
        syncFinance(u,false);
        setEditV(null); setToast("Zmiany zapisane");
      };
      const delVisit = id => {
        if(id && id!=="__DEL__") {
          setVisits(vs=>vs.filter(v=>v.id!==id));
          setFinances(fs=>fs.filter(f=>f.sourceId!=="visit-"+id));
        } else if(editV) {
          const {date,time,patientName}=editV;
          setVisits(vs=>vs.filter(v=>!(v.date===date&&v.time===time&&v.patientName===patientName)));
        }
        setConfirmDel(null); setEditV(null);
      };

      const [searchQ,setSearchQ]=useState("");
      const searchResults=useMemo(()=>{
        const q=(searchQ||"").trim().toLowerCase();
        if(q.length<2) return null;
        const res=[];
        const patByName=Object.fromEntries((allClients||patients||[]).map(p=>[p.name,p]));
        // wizyty
        visits.filter(v=>{
          const pat=patByName[v.patientName]||{};
          return (v.patientName||"").toLowerCase().includes(q)||(v.notes||"").toLowerCase().includes(q)||(v.type||"").toLowerCase().includes(q)||((pat.phone||"").replace(/\s/g,"").includes(q.replace(/\s/g,"")));
        }).slice(0,5).forEach(v=>{
          const pat=patByName[v.patientName]||{};
          res.push({kind:"visit",label:"Wizyta",title:(v.allDay?"🗓 ":"⏰ ")+(v.time?v.time+" · ":"")+v.patientName,sub:v.date+" · "+v.type+(v.price?" · "+v.price+" zł":"")+(pat.phone?" · 📞 "+pat.phone:""),item:v});
        });
        // wypożyczenia
        rentals.filter(r=>(r.patientName||"").toLowerCase().includes(q)||(r.equipment||"").toLowerCase().includes(q)||(r.address||"").toLowerCase().includes(q)||((r.phone||"").replace(/\s/g,"").includes(q.replace(/\s/g,"")))).slice(0,5).forEach(r=>res.push({kind:"rental",label:"Sprzęt",title:"📦 "+r.patientName+" – "+(r.equipment||"Do ustalenia"),sub:r.startDate+(r.endDate?" → "+r.endDate:"")+" · "+(r.status||"")+(r.phone?" · 📞 "+r.phone:""),item:r}));
        // pacjenci
        (allClients||patients||[]).filter(p=>(p.name||"").toLowerCase().includes(q)||(p.phone||"").replace(/\s/g,"").includes(q.replace(/\s/g,""))||(p.address||"").toLowerCase().includes(q)).slice(0,3).forEach(p=>res.push({kind:"patient",label:"Klient",title:"👤 "+p.name,sub:(p.phone?"📞 "+p.phone:"")+(p.address?" · "+p.address:""),item:p}));
        // wydarzenia
        events.filter(e=>(e.title||"").toLowerCase().includes(q)||(e.notes||"").toLowerCase().includes(q)).slice(0,3).forEach(e=>res.push({kind:"event",label:"Wydarzenie",title:"📌 "+e.title,sub:e.date+(e.time?" · "+e.time:""),item:e}));
        return res;
      },[searchQ,visits,rentals,patients,events]);
      const [todoInput,setTodoInput]=useState("");
      const [todoOpen,setTodoOpen]=useState(false);
      const [editTodoId,setEditTodoId]=useState(null);
      const [editTodoText,setEditTodoText]=useState("");

      return <>
        <div>
          <div style={{padding:"28px 20px 16px"}}>
            <div style={{fontFamily:"'Syne',sans-serif",fontSize:24,fontWeight:800}}>{dk?"🌙 Pulpit":"Pulpit"}</div>
            <div style={{fontSize:13,color:"#7A8FA6",marginTop:4,display:"flex",justifyContent:"space-between"}}>
              <span>{new Date(today+"T12:00:00").toLocaleDateString("pl-PL",{weekday:"long",day:"numeric",month:"long"})}</span>
              <span style={{fontWeight:600,color:"#0A7C7C"}}><ClockDisplay/></span>
            </div>
          </div>
          <div style={{padding:"0 20px 12px"}}>
            <div style={{position:"relative"}}>
              <input value={searchQ} onChange={e=>setSearchQ(e.target.value)} placeholder="🔍 Szukaj wizyt, sprzętu, pacjentów..." style={{width:"100%",boxSizing:"border-box",padding:"10px 14px",borderRadius:12,border:"1.5px solid "+(dk?"#2A4040":"#E4EAF0"),background:dk?"#1A2A2A":"#F7FAFA",fontSize:14,color:dk?"#E0F0F0":"#1A2E35",fontFamily:"inherit",outline:"none"}}/>
              {searchQ&&<button onClick={()=>setSearchQ("")} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",fontSize:16,cursor:"pointer",color:"#7A8FA6"}}>✕</button>}
            </div>
            {searchResults&&searchResults.length===0&&<div style={{padding:"10px 4px",fontSize:13,color:"#7A8FA6"}}>Brak wyników</div>}
            {searchResults&&searchResults.length>0&&<div style={{background:dk?"#1A2A2A":"#fff",borderRadius:12,boxShadow:"0 2px 12px rgba(0,0,0,.08)",marginTop:6,overflow:"hidden"}}>
              {searchResults.map((r,i)=><div key={i} onClick={()=>{

                  <div onClick={()=>setTodos(ts=>(ts||[]).map(x=>x.id===t.id?{...x,done:!x.done}:x))}
                    style={{width:20,height:20,borderRadius:6,border:`2px solid ${t.done?"#3DAA72":"#E4EAF0"}`,background:t.done?"#3DAA72":"#fff",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,cursor:"pointer"}}>
                    {t.done&&<span style={{color:"#fff",fontSize:12}}>✓</span>}
                  </div>
                  {editTodoId===t.id

                        onBlur={()=>{if(editTodoText.trim())setTodos(ts=>(ts||[]).map(x=>x.id===t.id?{...x,text:editTodoText.trim()}:x));setEditTodoId(null);}}
                        style={{flex:1,padding:"4px 8px",border:`1.5px solid #0A7C7C`,borderRadius:8,fontSize:14,outline:"none",background:dk?"#0F1F1F":"#FAFCFD",color:dk?"#E8F5F5":"#1C2B3A",fontFamily:"inherit"}}/>
                    : <span onDoubleClick={()=>{setEditTodoId(t.id);setEditTodoText(t.text);}} style={{flex:1,fontSize:14,color:t.done?"#7A8FA6":(dk?"#E8F5F5":"#1C2B3A"),textDecoration:t.done?"line-through":"none",cursor:"text"}}>{t.text}</span>
                  }
                  <button onClick={()=>setTodos(ts=>(ts||[]).filter(x=>x.id!==t.id))}
                    style={{background:"none",border:"none",color:"#7A8FA6",fontSize:16,cursor:"pointer",padding:"0 2px",lineHeight:1}}>×</button>
                </div>)}
                {(todos||[]).some(t=>t.done)&&<button onClick={()=>setTodos(ts=>(ts||[]).filter(x=>!x.done))}
                  style={{background:"none",border:"none",fontSize:12,color:"#7A8FA6",cursor:"pointer",fontFamily:"inherit",padding:"8px 0 0",fontWeight:600}}>Usuń ukończone</button>}
              </div>}
            </div>
          </div>
          <div style={{padding:"0 20px"}}>
            <MiniCalendar visits={visits} rentals={rentals} today={today} events={events} setEvents={setEvents} patients={patients}
              onEditVisit={v=>setEditV({...v,price:String(v.price)})}
              onAddVisit={date=>{ setVf({...emptyVisit(),date}); setShowAdd(true); }}
              onGoToRental={goToRental}
            />
            {(upcoming.length>0||wózkiReminders.length>0||unpaidCycles.length>0||birthdayReminders.length>0||reservedRentals.length>0)&&<>
              <div style={{fontFamily:"'Syne',sans-serif",fontSize:17,fontWeight:700,marginBottom:10,marginTop:8}}>Nadchodzące</div>
              {reservedRentals.map(r=>{
                const startDl=r.startDate?dateDiff(today,r.startDate):null;
                const waitDays=r.reservedAt?dateDiff(r.reservedAt,today):0;
                return <Card key={"res-"+r.id} onClick={()=>goToRental(r.id)} style={{borderLeft:"3px solid #7C6AF4"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div>
                      <div style={{fontWeight:600}}>📋 {r.equipment||"❓ Do ustalenia"}</div>
                      <div style={{fontSize:13,color:"#7A8FA6"}}>{demo?"Pacjent":r.patientName}{r.startDate?" · od "+r.startDate:""}</div>
                    </div>
                    <Badge color={startDl!==null?(startDl<0?"#E05C5C":startDl===0?"#F4A261":"#7C6AF4"):"#F4A261"}>
                      {startDl!==null?(startDl<0?Math.abs(startDl)+"d po term.":startDl===0?"Dziś!":"za "+startDl+"d"):"czeka "+waitDays+"d"}
                    </Badge>
                  </div>
                </Card>;
              })}
              {birthdayReminders.map(p=><Card key={"bd-"+p.id} style={{background:"#FFF5F0",border:"1.5px solid #F4A26130"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div>
                    <div style={{fontWeight:600}}>🎂 {demo?"Pacjent":p.name}</div>
                    <div style={{fontSize:13,color:"#7A8FA6"}}>{p._age} lat · {p.birthday.slice(5).split("-").reverse().join(".")}</div>
                  </div>
                  <Badge color={p._days===0?"#F4A261":p._days<=3?"#F4A261":"#3DAA72"}>{p._days===0?"Dziś!":p._days===1?"Jutro":"Za "+p._days+" dni"}</Badge>
                </div>
              </Card>)}
              {upcoming.map(r=>{const d=dateDiff(today,r.endDate);
                const extDue=(r.extensions||[]).reduce((s,e)=>s+(+e.amountDue||0),0);
                const totalAmt=(+r.amount||0)+extDue;
                const totalPaid=calcRentalPaid(r);
                const remaining=totalAmt-totalPaid;
                return(
                <Card key={r.id} onClick={()=>goToRental(r.id)}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div><div style={{fontWeight:600}}>{r.equipment||"❓ Do ustalenia"}</div><div style={{fontSize:13,color:"#7A8FA6"}}>{demo?"Pacjent":r.patientName} · {r.endDate}</div></div>
                    <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4}}>
                      <Badge color={d<0?"#E05C5C":d===0?"#F4A261":d<7?"#F4A261":"#3DAA72"}>{d<0?Math.abs(d)+"d po term.":d===0?"Dziś!":d+"d"}</Badge>
                      {remaining>0&&<Badge color="#E05C5C">{demo?"****":remaining+" zł"}</Badge>}
                    </div>
                  </div>
                </Card>
              );})}
              {wózkiReminders.map(cas=>{
                const nd=nextOrderDate(cas);
                const dl=dateDiff(today,nd);
                return <Card key={cas.id} onClick={()=>goToWozki(cas.id)}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div>
                      <div style={{fontWeight:600}}>🦽 {cas.patientName}</div>
                      <div style={{fontSize:13,color:"#7A8FA6"}}>{cas.hasDisabilityCert?"Z orzeczeniem":"Bez orzeczenia"} · kolejne od {nd}</div>
                    </div>
                    <span style={{fontSize:13,fontWeight:600,color:"#1C2B3A"}}>{dl<=0?"można złożyć":"za "+dl+"d"}</span>
                  </div>
                </Card>;
              })}
              {unpaidCycles.map(r=>{const n=(r.cycles||[]).filter(c=>!c.paid&&!c.cancelled).length;return(
                <Card key={r.id} onClick={()=>goToRental(r.id)} style={{borderLeft:"3px solid #E05C5C"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div><div style={{fontWeight:600}}>{r.equipment||"❓ Do ustalenia"}</div><div style={{fontSize:13,color:"#7A8FA6"}}>{r.patientName}</div></div>
                    <Badge color="#E05C5C">{n} {n===1?"miesiąc":"mies."}</Badge>
                  </div>
                </Card>
              );})}
            </>}
          </div>
        </div>

        {showAdd&&<Modal title="Nowa wizyta" onClose={()=>setShowAdd(false)}>
          <PatientPicker label="Pacjent *" value={vf.patientName} onChange={v=>setVf(f=>({...f,patientName:v}))} onSelect={p=>setVf(f=>({...f,patientName:p.name,patientId:p.id,price:p.defaultPrice?String(p.defaultPrice):f.price}))} patients={allClients||patients}/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <Inp label="Data" value={vf.date} onChange={v=>setVf(f=>({...f,date:v}))} type="date"/>
            {!vf.allDay&&<TimeSel label="Godzina" value={vf.time} onChange={v=>setVf(f=>({...f,time:v}))}/>}
          </div>
          <div style={{marginBottom:14}}>
            <div style={{display:"flex",gap:8}}>{[{v:false,l:"⏰ Z godziną"},{v:true,l:"🗓 Całodniowe"}].map(o=><button key={String(o.v)} onClick={()=>setVf(f=>({...f,allDay:o.v}))} style={{flex:1,padding:"8px",borderRadius:10,border:`2px solid ${(vf.allDay||false)===o.v?"#0A7C7C":"#E4EAF0"}`,background:(vf.allDay||false)===o.v?"#E6F4F4":"#fff",color:(vf.allDay||false)===o.v?"#0A7C7C":"#7A8FA6",fontWeight:600,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>{o.l}</button>)}</div>
          </div>
          <Sel label="Typ" value={vf.type} onChange={v=>setVf(f=>({...f,type:v}))} options={VISIT_TYPES.map(x=>({value:x,label:x}))}/>
          <Inp label="Cena (zł)" value={vf.price} onChange={v=>setVf(f=>({...f,price:v}))} type="number"/>
          <Sel label="Status" value={vf.status} onChange={v=>setVf(f=>({...f,status:v}))} options={[{value:"zaplanowana",label:"📅 Zaplanowana"},{value:"zakończona",label:"✅ Zakończona"}]}/>
          <Txa label="Notatka" value={vf.notes||""} onChange={v=>setVf(f=>({...f,notes:v}))} rows={2} placeholder="Przebieg wizyty, zalecenia..."/>

        </Modal>}

        {editV&&<Modal title="Edytuj wizytę" onClose={()=>setEditV(null)}>

    // ── PATIENTS ──────────────────────────────────────────────────────────────
    function BirthdayInput({value, onChange}) {
      const dk=useContext(DarkCtx);
      const hasYear=value.length===10;
      const knowYear=value===""?true:hasYear;
      const mmdd=hasYear?value.slice(5):value;
      const mm=mmdd?mmdd.slice(0,2):"";
      const dd=mmdd?mmdd.slice(3):"";
      const sel=(extra={})=>({padding:"9px 12px",borderRadius:10,border:`1.5px solid ${dk?"#2A4040":"#E4EAF0"}`,background:dk?"#0F1F1F":"#FAFCFD",color:dk?"#E8F5F5":"#1C2B3A",fontSize:13,fontFamily:"inherit",outline:"none",...extra});
      const months=["Styczeń","Luty","Marzec","Kwiecień","Maj","Czerwiec","Lipiec","Sierpień","Wrzesień","Październik","Listopad","Grudzień"];
      const setMM=(v)=>{const d=dd||"01";knowYear?onChange(value.slice(0,5)+v+"-"+d):onChange(v+"-"+d);};
      const setDD=(v)=>{knowYear?onChange(value.slice(0,8)+v):onChange(mm?mm+"-"+v:"");};
      const setYear=(v)=>{if(mm&&dd)onChange(v+"-"+mm+"-"+dd);};
      const toggleKnowYear=(checked)=>{if(checked){onChange(mm&&dd?todayLocal().slice(0,4)+"-"+mm+"-"+dd:"");}else{onChange(mm&&dd?mm+"-"+dd:"");}};
      return <div style={{marginBottom:14}}>
        <div style={{fontSize:13,fontWeight:600,color:dk?"#5A8A8A":"#4A6070",marginBottom:6,textTransform:"uppercase",letterSpacing:.5}}>Data urodzin</div>
        <div style={{display:"flex",gap:8,marginBottom:8}}>
          <select value={mm} onChange={e=>setMM(e.target.value)} style={{...sel(),flex:2}}>
            <option value="">Miesiąc</option>
            {months.map((m,i)=><option key={i} value={String(i+1).padStart(2,"0")}>{m}</option>)}
          </select>
          <select value={dd} onChange={e=>setDD(e.target.value)} style={{...sel(),flex:1}}>
            <option value="">Dzień</option>
            {Array.from({length:31},(_,i)=><option key={i} value={String(i+1).padStart(2,"0")}>{i+1}</option>)}
          </select>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:knowYear?8:0}}>
          <input type="checkbox" checked={knowYear} onChange={e=>toggleKnowYear(e.target.checked)} style={{width:15,height:15,cursor:"pointer"}}/>
          <span style={{fontSize:12,color:"#7A8FA6",cursor:"pointer"}} onClick={()=>toggleKnowYear(!knowYear)}>Znam rok urodzenia</span>
        </div>
        {knowYear&&<input type="number" min="1900" max={new Date().getFullYear()} value={hasYear?value.slice(0,4):""} onChange={e=>setYear(e.target.value)} placeholder="Rok (np. 1985)" style={{...sel(),width:"100%",boxSizing:"border-box"}}/>}
      </div>;
    }

    function BirthdayCard({birthday, dk}) {
      const today = todayLocal();
      const mmdd=birthday.length===5?birthday:birthday.slice(5);
      const hasYear=birthday.length===10;
      const age=hasYear?+today.slice(0,4)-+birthday.slice(0,4)-(mmdd>today.slice(5)?1:0):null;
      const thisYearBd = today.slice(0,4) + "-" + mmdd;
      const bdDate = new Date(thisYearBd + "T12:00:00");
      const todayDate = new Date(today + "T12:00:00");
      if(bdDate < todayDate) bdDate.setFullYear(bdDate.getFullYear() + 1);
      const daysTo = Math.round((bdDate - todayDate) / 86400000);
      return <Card style={{marginBottom:10,background:"#FFF5F0",border:"1.5px solid #F4A26130"}}>
        <div style={{fontSize:11,fontWeight:700,color:"#F4A261",textTransform:"uppercase",letterSpacing:.5,marginBottom:4}}>Urodziny</div>
        <div style={{fontSize:14,fontWeight:600,color:dk?"#E0F0F0":"#1A2E35"}}>
          {hasYear?new Date(birthday+"T12:00:00").toLocaleDateString("pl-PL",{day:"numeric",month:"long",year:"numeric"})+" · "+age+" lat":new Date(today.slice(0,4)+"-"+mmdd+"T12:00:00").toLocaleDateString("pl-PL",{day:"numeric",month:"long"})}
        </div>
        {daysTo<=7&&<div style={{fontSize:12,color:"#F4A261",fontWeight:700,marginTop:4}}>{daysTo===0?"🎂 Dzisiaj!":daysTo===1?"🎂 Jutro!":"🎂 Za "+daysTo+" dni"}</div>}
      </Card>;
    }

    function Patients({patients,setPatients,visits,setVisits,finances,setFinances,rentals,setRentals,nfzCases,allClients}) {
      const demo=useDemo();
      const dk=useContext(DarkCtx);
      const [selId,setSelId]=useState(null);
      const [showAdd,setShowAdd]=useState(false);
      const [showEdit,setShowEdit]=useState(false);
      const [confirmDelPat,setConfirmDelPat]=useState(false);
      const [editForm,setEditForm]=useState(null);
      const [newForm,setNewForm]=useState({name:"",phone:"",address:"",diagnosis:"",notes:"",defaultPrice:"",birthday:""});
      const [showAddV,setShowAddV]=useState(false);
      const [vf,setVf]=useState(emptyVisit);
      const [editV,setEditV]=useState(null);
      const [confirmDelV,setConfirmDelV]=useState(null);
      const [search,setSearch]=useState("");
      const [sort,setSort]=useState("alpha");
      const [histFilter,setHistFilter]=useState("all");
      const [showArchived,setShowArchived]=useState(false);
      const [pTab,setPTab]=useState("fizjo");
      const [toast,setToast]=useState(null);
      const [showQuickV,setShowQuickV]=useState(false);
      const [quickV,setQuickV]=useState(null);

      const equipClients=useMemo(()=>{
        const byName={};
        (rentals||[]).forEach(r=>{
          if(!r.patientName)return;
          const n=r.patientName;
          if(!byName[n])byName[n]={name:n,phone:"",address:"",rc:0,wc:0,lastDate:""};
          if(r.phone&&!byName[n].phone)byName[n].phone=r.phone;
          if(r.address&&!byName[n].address)byName[n].address=r.address;
          byName[n].rc++;
          if((r.startDate||"")>byName[n].lastDate)byName[n].lastDate=r.startDate||"";
        });
        (nfzCases||[]).forEach(c=>{
          if(!c.patientName)return;
          const n=c.patientName;
          if(!byName[n])byName[n]={name:n,phone:"",address:"",rc:0,wc:0,lastDate:""};
          if(c.phone&&!byName[n].phone)byName[n].phone=c.phone;
          if(c.address&&!byName[n].address)byName[n].address=c.address;
          byName[n].wc++;
          if((c.orderDate||"")>byName[n].lastDate)byName[n].lastDate=c.orderDate||"";
        });
        return Object.values(byName).sort((a,b)=>a.name.localeCompare(b.name,"pl"));
      },[rentals,nfzCases]);

      const pat = selId ? patients.find(p=>p.id===selId) : null;
      if(selId && !pat) { setSelId(null); return null; }

      const patVisits = pat ? visits.filter(v=>v.patientId===pat.id||(v.patientName===pat.name&&!v.patientId)) : [];
      const patRentals = pat ? rentals.filter(r=>r.patientId===pat.id||r.patientName===pat.name) : [];
      const patWozki = pat ? (nfzCases||[]).filter(c=>c.patientId===pat.id||c.patientName===pat.name) : [];
      const history = [...patVisits.map(v=>({...v,_t:"v",_d:v.date||"",_time:v.time||"00:00"})),...patRentals.map(r=>({...r,_t:"r",_d:r.startDate||"",_time:"00:00"})),...patWozki.map(c=>({...c,_t:"w",_d:c.orderDate||"",_time:"00:00"}))].sort((a,b)=>(b._d||"").localeCompare(a._d||"")||(b._time||"").localeCompare(a._time||""));

      const patTotalVisits = pat ? patVisits.filter(v=>visitStatus(v)==="zakończona").reduce((s,v)=>s+(+v.price||0),0) : 0;
      const patTotalRentals = pat ? patRentals.reduce((s,r)=>s+calcRentalPaid(r),0) : 0;
      const patTotalWozki = pat ? patWozki.filter(c=>c.realized).reduce((s,c)=>{const fin=(finances||[]).find(f=>f.sourceId==="wozek-"+c.id);return s+(fin?fin.amount:0);},0) : 0;
      const patTotal = patTotalVisits + patTotalRentals + patTotalWozki;
      const patDoneVisits = pat ? patVisits.filter(v=>visitStatus(v)==="zakończona") : [];
      const patAvgPrice = patDoneVisits.length ? Math.round(patDoneVisits.reduce((s,v)=>s+(+v.price||0),0)/patDoneVisits.length) : 0;
      const patFirstDate = pat ? [...patDoneVisits.map(v=>v.date),...patRentals.map(r=>r.startDate||""),...patWozki.map(c=>c.orderDate||"")].filter(Boolean).sort()[0]||null : null;
      const patSinceMonths = patFirstDate ? Math.round((new Date(todayLocal())-new Date(patFirstDate))/2592000000) : 0;

      const syncFinance = (v,isNew) => {
        const done = v.status==="zakończona"||new Date(v.date+"T"+(v.time||"00:00")+":00")<=new Date();
        if(!done) return;
        const sid="visit-"+v.id;
        setFinances(fs=>{
          const ex=fs.some(f=>f.sourceId===sid);
          if(isNew&&!ex) return [{id:Date.now()+Math.random(),sourceId:sid,date:v.date,type:"przychód",category:"Wizyta",amount:v.price||0,description:"Wizyta – "+v.patientName},...fs];
          if(!isNew) return ex?fs.map(f=>f.sourceId===sid?{...f,amount:v.price,description:"Wizyta – "+v.patientName,date:v.date}:f):[{id:Date.now()+Math.random(),sourceId:sid,date:v.date,type:"przychód",category:"Wizyta",amount:v.price||0,description:"Wizyta – "+v.patientName},...fs];
          return fs;
        });
      };



      if(pat) {
        const maps=pat.address?`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(pat.address)}`:null;
        return <>
          <div>
            <button onClick={()=>setSelId(null)} style={{background:"none",border:"none",display:"flex",alignItems:"center",gap:6,color:"#0A7C7C",fontWeight:600,cursor:"pointer",padding:"20px 20px 0",fontFamily:"inherit",fontSize:14}}>
              <Ico d={I.back} s={18} c="#0A7C7C"/> Pacjenci
            </button>
            <div style={{padding:"16px 20px 0"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
                <div style={{display:"flex",alignItems:"center",gap:12}}>
                  <Av name={pat.name}/>
                  <div><div style={{fontFamily:"'Syne',sans-serif",fontSize:20,fontWeight:800}}>{pat.name}</div><div style={{fontSize:13,color:"#7A8FA6"}}>{pat.phone}</div></div>
                </div>
                <Btn small variant="secondary" onClick={()=>{setEditForm({...pat});setConfirmDelPat(false);setShowEdit(true);}}>✏️ Edytuj</Btn>
              </div>

              <Card style={{marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:pat.address?10:0}}>
                  <div style={{fontSize:14,color:"#7A8FA6"}}>{pat.phone||"Brak telefonu"}</div>
                  {pat.phone&&<div style={{display:"flex",gap:6}}>
                    <a href={`tel:${pat.phone.replace(/\s/g,"")}`} style={{textDecoration:"none"}}><Btn small variant="secondary"><Ico d={I.ph} s={15} c="#0A7C7C"/> Zadzwoń</Btn></a>
                    <a href={`sms:${pat.phone.replace(/\s/g,"")}`} style={{textDecoration:"none"}}><Btn small variant="secondary"><Ico d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" s={15} c="#0A7C7C"/> SMS</Btn></a>
                  </div>}
                </div>
                {pat.address&&<div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div style={{fontSize:14,color:"#7A8FA6",flex:1,paddingRight:8}}>{pat.address}</div>
                  {maps&&<a href={maps} target="_blank" rel="noreferrer" style={{textDecoration:"none",flexShrink:0}}><Btn small variant="secondary">🗺️ Trasa</Btn></a>}
                </div>}
              </Card>
              {pat.diagnosis&&<Card style={{marginBottom:10,background:"#F0EDFF",border:"1.5px solid #7C6AF430"}}>
                <div style={{fontSize:11,fontWeight:700,color:"#7C6AF4",textTransform:"uppercase",letterSpacing:.5,marginBottom:6}}>Diagnoza</div>
                <div style={{fontSize:14,lineHeight:1.6,whiteSpace:"pre-wrap"}}>{pat.diagnosis}</div>
              </Card>}
              {pat.notes&&<Card style={{marginBottom:10,background:"#FFFBF5",border:"1.5px solid #F4A26130"}}>
                <div style={{fontSize:11,fontWeight:700,color:"#F4A261",textTransform:"uppercase",letterSpacing:.5,marginBottom:6}}>Notatki</div>
                <div style={{fontSize:14,lineHeight:1.6,whiteSpace:"pre-wrap"}}>{pat.notes}</div>
              </Card>}
              {pat.defaultPrice&&<Card style={{marginBottom:10,background:"#F0FFF8",border:"1.5px solid #3DAA7230"}}>
                <div style={{fontSize:11,fontWeight:700,color:"#3DAA72",textTransform:"uppercase",letterSpacing:.5,marginBottom:4}}>Domyślna cena wizyty</div>
                <div style={{fontSize:18,fontWeight:800,color:"#3DAA72"}}>{pat.defaultPrice} zł</div>
              </Card>}
              {pat.birthday&&<BirthdayCard birthday={pat.birthday} dk={dk}/>}

              {(patDoneVisits.length>0||patRentals.length>0||patWozki.length>0)&&<Card style={{marginBottom:10,background:dk?"#1A2A2A":"#F7FAFA",border:"1.5px solid #E4EAF0"}}>
                <div style={{fontSize:11,fontWeight:700,color:"#7A8FA6",textTransform:"uppercase",letterSpacing:.5,marginBottom:10}}>Statystyki</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
                  {[
                    patDoneVisits.length>0?{l:"Wizyty",v:patDoneVisits.length,c:"#0A7C7C"}:{l:"Wypożyczenia",v:patRentals.length,c:"#7C6AF4"},
                    patDoneVisits.length>0?{l:"Śr. cena",v:patAvgPrice+" zł",c:"#7C6AF4"}:{l:"Wózki NFZ",v:patWozki.length,c:"#F4A261"},
                    {l:"Klient od",v:patSinceMonths<1?"<1 mies.":patSinceMonths<12?patSinceMonths+" mies.":(patSinceMonths/12).toFixed(1).replace(".0","")+" lat",c:"#F4A261"},
                  ].map((x,i)=><div key={i} style={{background:x.c+"14",borderRadius:12,padding:"10px 8px",textAlign:"center",border:`1.5px solid ${x.c}30`}}>
                    <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:15,color:x.c}}>{x.v}</div>
                    <div style={{fontSize:11,color:"#7A8FA6",marginTop:2}}>{x.l}</div>
                  </div>)}
                </div>
              </Card>}
              {patTotal>0&&<Card style={{marginBottom:10,background:"#E6F4F4",border:"1.5px solid #0A7C7C30"}}>
                <div style={{fontSize:11,fontWeight:700,color:"#0A7C7C",textTransform:"uppercase",letterSpacing:.5,marginBottom:10}}>Łącznie zapłacono</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                  {[{l:"Wizyty",v:patTotalVisits,c:"#0A7C7C"},{l:"Wypożyczenia",v:patTotalRentals,c:"#7C6AF4"},{l:"Wózki",v:patTotalWozki,c:"#F4A261"},{l:"Razem",v:patTotal,c:"#1C2B3A"}].map((x,i)=>(
                    <div key={i} style={{background:"#fff",borderRadius:12,padding:"10px 8px",textAlign:"center",border:"1.5px solid #E4EAF0"}}>
                      <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:14,color:x.c}}>{x.v} zł</div>
                      <div style={{fontSize:11,color:"#7A8FA6",marginTop:2}}>{x.l}</div>
                    </div>
                  ))}
                </div>
              </Card>}

              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <div style={{fontFamily:"'Syne',sans-serif",fontSize:17,fontWeight:700}}>Historia ({history.length})</div>
                <Btn small onClick={()=>{setVf({...emptyVisit(),patientName:pat.name,patientId:pat.id,price:pat.defaultPrice?String(pat.defaultPrice):"150"});setShowAddV(true);}}><Ico d={I.plus} s={15} c="#fff"/> Wizyta</Btn>
              </div>
              <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
                {[{k:"all",l:"Wszystko"},{k:"v",l:"Wizyty"},{k:"r",l:"Wypożyczenia"},{k:"w",l:"Wózki"}].map(x=><button key={x.k} onClick={()=>setHistFilter(x.k)} style={{padding:"6px 12px",borderRadius:16,border:"none",cursor:"pointer",fontWeight:600,fontSize:12,background:histFilter===x.k?"#0A7C7C":"#E4EAF0",color:histFilter===x.k?"#fff":"#7A8FA6",fontFamily:"inherit"}}>{x.l}</button>)}
              </div>
              {history.filter(item=>histFilter==="all"||item._t===histFilter).length===0
                ?<Empty text="Brak wpisów"/>
                :history.filter(item=>histFilter==="all"||item._t===histFilter).map(item=>
                item._t==="v"
                ? <Card key={"v"+item.id} onClick={()=>setEditV({...item,price:String(item.price)})}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                      <div><div style={{fontSize:11,fontWeight:700,color:"#0A7C7C",textTransform:"uppercase",letterSpacing:.5,marginBottom:2}}>Wizyta</div><div style={{fontWeight:600}}>{item.date} · {item.time}</div><div style={{fontSize:13,color:"#7A8FA6"}}>{item.type}</div></div>
                      <div style={{textAlign:"right"}}><div style={{fontWeight:600,marginBottom:4}}>{item.price} zł</div><Badge color={visitStatus(item)==="zakończona"?"#3DAA72":"#0A7C7C"}>{visitStatus(item)}</Badge></div>
                    </div>
                    {item.notes&&<div style={{fontSize:12,color:"#7A8FA6",marginTop:8,paddingTop:8,borderTop:"1px solid #F2F5F7",fontStyle:"italic",whiteSpace:"pre-wrap"}}>📝 {item.notes}</div>}
                  </Card>
                : item._t==="r"
                ? <Card key={"r"+item.id} style={{background:"#F0EDFF"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                      <div><div style={{fontSize:11,fontWeight:700,color:"#7C6AF4",textTransform:"uppercase",letterSpacing:.5,marginBottom:2}}>Wypożyczenie</div><div style={{fontWeight:600}}>{item.equipment}</div><div style={{fontSize:13,color:"#7A8FA6"}}>{item.startDate}{item.endDate?" → "+item.endDate:""}</div></div>
                      <div style={{textAlign:"right"}}><div style={{fontWeight:600,marginBottom:4}}>{item.amount} zł</div><Badge color={item.status==="zakończone"?"#7A8FA6":"#7C6AF4"}>{item.status}</Badge></div>
                    </div>
                  </Card>
                : <Card key={"w"+item.id} style={{background:"#FFF7ED"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                      <div><div style={{fontSize:11,fontWeight:700,color:"#F4A261",textTransform:"uppercase",letterSpacing:.5,marginBottom:2}}>Wózek NFZ</div><div style={{fontWeight:600}}>{item.wheelchairModel||"Model nieznany"}</div><div style={{fontSize:13,color:"#7A8FA6"}}>{item.orderDate||"Brak daty"}{item.hasDisabilityCert?" · orzeczenie":""}</div></div>
                      <Badge color={item.realized?"#3DAA72":"#F4A261"}>{item.realized?"zrealizowany":"oczekuje"}</Badge>
                    </div>
                    {item.notes&&<div style={{fontSize:12,color:"#7A8FA6",marginTop:8,paddingTop:8,borderTop:"1px solid #F2F5F7",fontStyle:"italic",whiteSpace:"pre-wrap"}}>📝 {item.notes}</div>}
                  </Card>
              )}
            </div>
          </div>

          {/* Modal: edytuj pacjenta */}
          {showEdit&&editForm&&<Modal title="Edytuj pacjenta" onClose={()=>{setShowEdit(false);setEditForm(null);setConfirmDelPat(false);}}>
            <Inp label="Imię i nazwisko" value={editForm.name||""} onChange={v=>setEditForm(f=>({...f,name:v}))} placeholder="Jan Kowalski"/>
            <Inp label="Telefon" value={editForm.phone||""} onChange={v=>setEditForm(f=>({...f,phone:v}))} placeholder="600 000 000" type="tel"/>
            <Inp label="Adres" value={editForm.address||""} onChange={v=>setEditForm(f=>({...f,address:v}))} placeholder="ul. Przykładowa 1, Gliwice"/>
            <Txa label="Diagnoza" value={editForm.diagnosis||""} onChange={v=>setEditForm(f=>({...f,diagnosis:v}))} rows={2}/>
            <Txa label="Notatki" value={editForm.notes||""} onChange={v=>setEditForm(f=>({...f,notes:v}))} rows={2}/>
            <Inp label="Domyślna cena wizyty (zł)" value={editForm.defaultPrice||""} onChange={v=>setEditForm(f=>({...f,defaultPrice:v}))} type="number" placeholder="np. 150"/>
            <BirthdayInput value={editForm.birthday||""} onChange={v=>setEditForm(f=>({...f,birthday:v}))}/>
            {!confirmDelPat
              ? <>
                  <Btn style={{width:"100%",justifyContent:"center",marginBottom:8}} onClick={()=>{
                    const _pid=editForm.id;
                    const _old=patients.find(p=>p.id===_pid)?.name||editForm.name;
                    const _new=editForm.name||_old;
                    setPatients(ps=>ps.map(p=>p.id===_pid?{...p,...editForm}:p));
                    if(_new!==_old){
                      setVisits(vs=>vs.map(v=>v.patientId===_pid?{...v,patientName:_new}:v));
                      setFinances(fs=>fs.map(f=>f.description?{...f,description:f.description.split(_old).join(_new)}:f));
                    }
                    setRentals(rs=>rs.map(r=>{
                      if(r.patientId!==_pid&&r.patientName!==_old) return r;
                      return {...r,patientName:_new,phone:editForm.phone,address:editForm.address,patientId:_pid};
                    }));
                    setShowEdit(false);
                    setEditForm(null);
                    setToast("Zapisano zmiany");
                  }}>Zapisz zmiany</Btn>
                  <Btn variant="secondary" style={{width:"100%",justifyContent:"center",marginBottom:8}} onClick={()=>{setPatients(ps=>ps.map(p=>p.id===editForm.id?{...p,archived:!p.archived}:p));setShowEdit(false);setEditForm(null);setSelId(null);setToast(editForm.archived?"Pacjent przywrócony":"Pacjent zarchiwizowany");}}>📦 {editForm.archived?"Przywróć pacjenta":"Archiwizuj pacjenta"}</Btn>
                  <Btn variant="danger" style={{width:"100%",justifyContent:"center"}} onClick={()=>setConfirmDelPat(true)}>🗑️ Usuń pacjenta</Btn>
                </>
              : <>
                  <div style={{background:"#FEE2E2",borderRadius:12,padding:14,marginBottom:12,fontSize:14,color:"#E05C5C",textAlign:"center",fontWeight:600}}>Na pewno usunąć pacjenta i wszystkie jego dane?</div>
                  <div style={{display:"flex",gap:10}}>
                    <Btn variant="secondary" style={{flex:1,justifyContent:"center"}} onClick={()=>setConfirmDelPat(false)}>Anuluj</Btn>
                    <Btn variant="danger" style={{flex:1,justifyContent:"center"}} onClick={()=>{
                      const _pid=editForm.id;
                      const _pn=editForm.name;
                      const _pr=rentals.filter(r=>r.patientId===_pid||r.patientName===_pn);
                      const _vids=visits.filter(v=>v.patientId===_pid).map(v=>v.id);
                      const _pids=_pr.flatMap(r=>(r.payments||[]).map(p=>p.id));
                      const _cids=_pr.flatMap(r=>(r.cycles||[]).map(c=>"cycle-"+r.id+"-"+(c.dueDate||c.month)));
                      const _extPrefixes=_pr.map(r=>"extend-"+r.id+"-");
                      setVisits(vs=>vs.filter(v=>v.patientId!==_pid));
                      setRentals(rs=>rs.filter(r=>r.patientId!==_pid&&r.patientName!==_pn));
                      setFinances(fs=>fs.filter(f=>!_vids.some(id=>f.sourceId==="visit-"+id)&&!_pids.some(id=>f.sourceId==="payment-"+id)&&!_cids.some(cid=>f.sourceId===cid)&&!_extPrefixes.some(pfx=>f.sourceId&&f.sourceId.startsWith(pfx))));

          {editV&&<Modal title="Edytuj wizytę" onClose={()=>setEditV(null)}>

              <TimeSel label="Godzina" value={editV.time} onChange={v=>setEditV(f=>({...f,time:v}))}/>

          {confirmDelV&&<Modal title="Usuń wizytę" onClose={()=>setConfirmDelV(null)}>

      }

      // Lista pacjentów
      const sl=search.toLowerCase(),sn=search.replace(/\s/g,"");
      const filtered=patients.filter(p=>(!!p.archived)===showArchived&&(p.name.toLowerCase().includes(sl)||(p.phone||"").replace(/\s/g,"").includes(sn)||(p.address||"").toLowerCase().includes(sl)||(p.diagnosis||"").toLowerCase().includes(sl)||(p.notes||"").toLowerCase().includes(sl)));
      const lastVisitDate=p=>visits.filter(v=>v.patientId===p.id).map(v=>v.date).sort((a,b)=>b.localeCompare(a))[0]||"";

        </div>
        <div style={{padding:"0 20px"}}>
          <Inp value={search} onChange={setSearch} placeholder="🔍 Szukaj..."/>
          {pTab==="fizjo"&&<>
            <div style={{display:"flex",gap:6,marginBottom:12}}>
              {[{k:"alpha",l:"A–Z"},{k:"recent",l:"Ostatnio aktywni"}].map(x=><button key={x.k} onClick={()=>setSort(x.k)} style={{padding:"7px 14px",borderRadius:20,border:"none",cursor:"pointer",fontWeight:600,fontSize:12,background:sort===x.k?"#0A7C7C":"#E4EAF0",color:sort===x.k?"#fff":"#7A8FA6",fontFamily:"inherit"}}>{x.l}</button>)}
              <button onClick={()=>setShowArchived(a=>!a)} style={{padding:"7px 14px",borderRadius:20,border:"none",cursor:"pointer",fontWeight:600,fontSize:12,background:showArchived?"#7A8FA6":"#E4EAF0",color:showArchived?"#fff":"#7A8FA6",fontFamily:"inherit",marginLeft:"auto"}}>📦 {showArchived?"Aktywni":"Archiwum"}</button>

            {search&&sorted.length===0&&<Empty text="Nie znaleziono pacjenta"/>}
            {sorted.map((p,pi)=>{const lv=lastVisitDate(p);return(<Card key={p.id} onClick={()=>setSelId(p.id)}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{display:"flex",gap:12,alignItems:"center"}}>
                  <Av name={p.name}/>
                  <div>
                    <div style={{fontWeight:600}}>{maskName(demo,p.name,pi)}</div>
                    <div style={{fontSize:13,color:"#7A8FA6"}}>{maskPhone(demo,p.phone)}</div>
                    {sort==="recent"&&lv&&<div style={{fontSize:11,color:"#0A7C7C",marginTop:2}}>ostatnia wizyta: {lv}</div>}
                  </div>
                </div>
                <div style={{display:"flex",gap:6,alignItems:"center"}}>
                  <button onClick={e=>{e.stopPropagation();setQuickV({...emptyVisit(),patientName:p.name,patientId:p.id,price:p.defaultPrice?String(p.defaultPrice):"150"});setShowQuickV(true);}} style={{width:30,height:30,borderRadius:10,background:"#0A7C7C",border:"none",color:"#fff",fontSize:18,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,lineHeight:1}}>+</button>
                  <Ico d="M9 18l6-6-6-6" s={20} c="#7A8FA6"/>
                </div>
              </div>
              {p.diagnosis&&<div style={{fontSize:12,color:"#7A8FA6",marginTop:8,paddingTop:8,borderTop:"1px solid #E4EAF0",whiteSpace:"pre-wrap"}}>{p.diagnosis}</div>}
            </Card>);})}
          </>}
          {pTab==="sprzet"&&<>
            {equipClients.length===0&&<Empty text="Brak klientów sprzętu"/>}
            {search&&equipFiltered.length===0&&equipClients.length>0&&<Empty text="Nie znaleziono"/>}
            {equipFiltered.map((c,ci)=>{
              const inBase=patients.some(p=>p.name===c.name);
              return <Card key={c.name} onClick={()=>{
                const ex=patients.find(p=>p.name===c.name);
                if(ex){setSelId(ex.id);}
                else{const nid=Date.now()+ci;setPatients(ps=>[...(ps||[]),{id:nid,name:c.name,phone:c.phone||"",address:c.address||"",diagnosis:"",notes:"",defaultPrice:"",birthday:""}]);setSelId(nid);}
              }}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div style={{display:"flex",gap:12,alignItems:"center"}}>
                    <Av name={c.name}/>
                    <div>
                      <div style={{fontWeight:600}}>{demo?"Klient":c.name}</div>
                      <div style={{fontSize:13,color:"#7A8FA6"}}>{demo?"***-***-***":c.phone||"Brak telefonu"}</div>
                    </div>
                  </div>
                  <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4}}>
                    <div style={{display:"flex",gap:4}}>
                      {c.rc>0&&<span style={{fontSize:11,fontWeight:700,background:"#F0EDFF",color:"#7C6AF4",borderRadius:8,padding:"2px 7px"}}>🦾 {c.rc}</span>}
                      {c.wc>0&&<span style={{fontSize:11,fontWeight:700,background:"#FFF7ED",color:"#F4A261",borderRadius:8,padding:"2px 7px"}}>🦽 {c.wc}</span>}
                    </div>
                    {!inBase&&<span style={{fontSize:10,color:"#7A8FA6"}}>kliknij → dodaj profil</span>}
                  </div>

        </div>
        {showAdd&&<Modal title="Nowy pacjent" onClose={()=>setShowAdd(false)}>
          <Inp label="Imię i nazwisko *" value={newForm.name} onChange={v=>setNewForm(f=>({...f,name:v}))} placeholder="Jan Kowalski"/>
          <Inp label="Telefon" value={newForm.phone} onChange={v=>setNewForm(f=>({...f,phone:v}))} placeholder="600 000 000" type="tel"/>
          <Inp label="Adres" value={newForm.address} onChange={v=>setNewForm(f=>({...f,address:v}))} placeholder="ul. Przykładowa 1, Gliwice"/>
          <Txa label="Diagnoza" value={newForm.diagnosis} onChange={v=>setNewForm(f=>({...f,diagnosis:v}))} rows={2}/>

          <Inp label="Domyślna cena wizyty (zł)" value={newForm.defaultPrice||""} onChange={v=>setNewForm(f=>({...f,defaultPrice:v}))} type="number" placeholder="np. 150"/>
          <BirthdayInput value={newForm.birthday||""} onChange={v=>setNewForm(f=>({...f,birthday:v}))}/>

        {showQuickV&&quickV&&<Modal title={"Wizyta – "+quickV.patientName} onClose={()=>setShowQuickV(false)}>

          <Sel label="Status" value={quickV.status} onChange={v=>setQuickV(f=>({...f,status:v}))} options={[{value:"zaplanowana",label:"📅 Zaplanowana"},{value:"zakończona",label:"✅ Zakończona"}]}/>
          <Txa label="Notatka" value={quickV.notes||""} onChange={v=>setQuickV(f=>({...f,notes:v}))} rows={2} placeholder="Przebieg wizyty, zalecenia..."/>

            const nv={...quickV,id:Date.now(),price:+quickV.price};

    // ── RENTALS ───────────────────────────────────────────────────────────────
    function PaymentForm({rentalId,rentalAmount,amountPaid,patientName,equipment,setRentals,setFinances}) {
      const [amt,setAmt]=useState("");
      const [date,setDate]=useState(todayLocal);
      const add=()=>{
        const v=+amt; if(!v) return;
        const rem=rentalAmount-(amountPaid||0);
        if(v>rem+0.01){alert(`Wpłata (${v} zł) przekracza pozostałą kwotę (${rem} zł)`);return;}
        const np={id:Date.now(),amount:v,date};
        setRentals(rs=>rs.map(x=>{
          if(x.id!==rentalId)return x;
          const newPayments=[...(x.payments||[]),np];
          const newPaid=newPayments.reduce((s,q)=>s+(+q.amount||0),0);
          return {...x,payments:newPayments,amountPaid:newPaid};
        }));
        setFinances(fs=>[{id:Date.now()+Math.random(),sourceId:"payment-"+np.id,date,type:"przychód",category:"Wypożyczalnia",amount:v,description:"Wypożyczenie – "+patientName+" ("+equipment+")"},...fs]);
        setAmt("");
      };
      return <div style={{marginTop:12,display:"flex",flexDirection:"column",gap:8}}>
        <div style={{display:"flex",gap:8}}>
          <input type="number" value={amt} onChange={e=>setAmt(e.target.value)} placeholder="Kwota wpłaty..." style={{flex:1,padding:"10px 14px",border:"1.5px solid #E4EAF0",borderRadius:12,fontSize:14,outline:"none",background:"#FAFCFD",fontFamily:"inherit"}}/>
          <input type="date" value={date} onChange={e=>setDate(e.target.value)} style={{flex:1,padding:"10px 14px",border:"1.5px solid #E4EAF0",borderRadius:12,fontSize:14,outline:"none",background:"#FAFCFD",fontFamily:"inherit"}}/>
        </div>
        <button onClick={add} style={{background:"#0A7C7C",color:"#fff",border:"none",borderRadius:12,padding:10,fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>+ Dodaj wpłatę</button>
      </div>;
    }

    function HistoryFill({r,setRentals,setFinances}) {
      const cm=todayLocal().slice(0,7);
      // Generate all months from startDate month to current month
      const months=[];
      const [sy,sm]=r.startDate.split("-").map(Number);
      const [cy,cmn]=cm.split("-").map(Number);
      const startDay=r.startDate.split("-")[2]; // e.g. "08"
      let y=sy,m=sm;
      while(y<cy||(y===cy&&m<=cmn)){
        const mStr=y+"-"+String(m).padStart(2,"0");
        // paidDate = same day as startDate but capped to last day of that month
        const lastDay=new Date(y,m,0).getDate();
        const day=Math.min(+startDay,lastDay);
        const paidDate=mStr+"-"+String(day).padStart(2,"0");
        months.push({month:mStr,dueDate:paidDate,paidDate});
        m++;if(m>12){m=1;y++;}
      }
      const [checked,setChecked]=useState(()=>Object.fromEntries(months.map(x=>[x.month,true])));
      const [amounts,setAmounts]=useState(()=>Object.fromEntries(months.map(x=>[x.month,String(r.amount||"")])));
      const [bulkAmt,setBulkAmt]=useState(String(r.amount||""));
      const allChecked=months.every(x=>checked[x.month]);
      return <div>
        <div style={{background:"#FFF8E6",border:"1.5px solid #F4A26140",borderRadius:14,padding:14,marginBottom:14}}>
          <div style={{fontWeight:700,fontSize:14,marginBottom:4}}>📋 Uzupełnij historię płatności</div>
          <div style={{fontSize:13,color:"#7A8FA6",lineHeight:1.5}}>To wypożyczenie trwa od {r.startDate}. Zaznacz które miesiące zostały opłacone i podaj kwoty, następnie zatwierdź.</div>
        </div>
        <div style={{display:"flex",gap:8,marginBottom:14,alignItems:"center"}}>
          <input type="number" value={bulkAmt} onChange={e=>{setBulkAmt(e.target.value);setAmounts(a=>Object.fromEntries(Object.keys(a).map(k=>[k,e.target.value])));}} placeholder="Kwota dla wszystkich..." style={{flex:1,padding:"10px 14px",border:"1.5px solid #E4EAF0",borderRadius:12,fontSize:14,outline:"none",background:"#FAFCFD",fontFamily:"inherit"}}/>
          <button onClick={()=>setChecked(c=>Object.fromEntries(Object.keys(c).map(k=>[k,!allChecked])))} style={{padding:"10px 14px",borderRadius:12,border:"1.5px solid #E4EAF0",background:allChecked?"#0A7C7C":"#fff",color:allChecked?"#fff":"#7A8FA6",fontWeight:600,fontSize:13,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>{allChecked?"✓ Wszystkie":"Zaznacz wszystkie"}</button>
        </div>
        <div style={{borderRadius:12,border:"1.5px solid #E4EAF0",overflow:"hidden",marginBottom:14}}>
          {months.map((x,i)=>{
            const label=new Date(x.month+"-15").toLocaleDateString("pl-PL",{month:"long",year:"numeric"});
            return <div key={x.month} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",borderBottom:i<months.length-1?"1px solid #F2F5F7":"none",background:checked[x.month]?"#F6FFF9":"#FAFCFD"}}>
              <button onClick={()=>setChecked(c=>({...c,[x.month]:!c[x.month]}))} style={{width:22,height:22,borderRadius:6,border:`2px solid ${checked[x.month]?"#3DAA72":"#E4EAF0"}`,background:checked[x.month]?"#3DAA72":"#fff",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,padding:0}}>
                {checked[x.month]&&<span style={{color:"#fff",fontSize:13,lineHeight:1}}>✓</span>}
              </button>
              <div style={{flex:1,fontSize:14,fontWeight:checked[x.month]?600:400,color:checked[x.month]?"#1C2B3A":"#7A8FA6",textTransform:"capitalize"}}>{label}<div style={{fontSize:11,color:"#7A8FA6",fontWeight:400}}>{x.paidDate}</div></div>
              <input type="number" value={amounts[x.month]||""} onChange={e=>setAmounts(a=>({...a,[x.month]:e.target.value}))} disabled={!checked[x.month]} style={{width:80,padding:"7px 10px",border:"1.5px solid #E4EAF0",borderRadius:10,fontSize:13,outline:"none",background:checked[x.month]?"#FAFCFD":"#F2F5F7",fontFamily:"inherit",textAlign:"right",color:checked[x.month]?"#1C2B3A":"#7A8FA6"}}/>
              <span style={{fontSize:13,color:"#7A8FA6"}}>zł</span>
            </div>;
          })}
        </div>
        <Btn style={{width:"100%",justifyContent:"center"}} onClick={()=>{
          const newCycles=months.map(x=>({month:x.month,dueDate:x.dueDate,amount:+(amounts[x.month]||0),paid:!!checked[x.month],paidDate:checked[x.month]?x.paidDate:null}));
          setRentals(rs=>rs.map(rr=>rr.id===r.id?{...rr,cycles:newCycles}:rr));
          const newFinances=months.filter(x=>checked[x.month]&&+(amounts[x.month]||0)>0).map(x=>{
            const label=new Date(x.month+"-15").toLocaleDateString("pl-PL",{month:"long",year:"numeric"});
            return {id:Date.now()+Math.random(),sourceId:"cycle-"+r.id+"-"+x.dueDate,date:x.paidDate,type:"przychód",category:"Wypożyczalnia",amount:+(amounts[x.month]||0),description:"Wypożyczenie – "+r.patientName+" ("+(r.equipment||"Do ustalenia")+") "+label};
          });
          if(newFinances.length)setFinances(fs=>[...newFinances,...fs]);
        }}>✓ Zatwierdź historię ({months.filter(x=>checked[x.month]).length} mies.)</Btn>
      </div>;
    }

    function CycleRow({r,cycle,setRentals,setFinances}) {
      const [amt,setAmt]=useState(String(cycle.amount||""));
      const [payDate,setPayDate]=useState(todayLocal);
      const dueDt=cycle.dueDate||cycle.month+"-15";
      const label=new Date(dueDt+"T12:00:00").toLocaleDateString("pl-PL",{day:"numeric",month:"long",year:"numeric"});
      const sid="cycle-"+r.id+"-"+(cycle.dueDate||cycle.month);
      if(cycle.cancelled) return (
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:"1px solid #F2F5F7",opacity:.5}}>
          <div style={{display:"flex",gap:12,alignItems:"center"}}>
            <div style={{width:8,height:8,borderRadius:"50%",background:"#7A8FA6",flexShrink:0}}/>
            <div><div style={{fontWeight:600,fontSize:14,textTransform:"capitalize",textDecoration:"line-through"}}>{label}</div><div style={{fontSize:12,color:"#7A8FA6"}}>Anulowany</div></div>
          </div>

    // Pomocnik: ile sztuk danego sprzętu było w danym dniu
    // stock = {qty:{eq:n}, history:[{eq,qty,from}]}
    // Migracja ze starego formatu (plain {eq:n}) odbywa się w StockPanel przy zapisie
    function qtyAt(stock, eq, dateStr) {
      // stary format (brak history) — zwróć qty lub 1
      const qty = stock && stock.qty ? stock.qty : stock;
      const history = (stock && stock.history) || [];
      // wpisy dla tego urządzenia posortowane rosnąco po dacie
      const entries = history.filter(h=>h.eq===eq).sort((a,b)=>a.from.localeCompare(b.from));
      if(entries.length===0) return (qty&&qty[eq])||1;
      // znajdź ostatni wpis który był <= dateStr
      let result = (qty&&qty[eq])||1;
      for(const e of entries){
        if(e.from<=dateStr) result=e.qty;
        else break;
      }
      return result;
    }

    function StockPanel({rentals,stock,setStock}) {
      const dk=useContext(DarkCtx);

      const [showEdit,setShowEdit]=useState(false);
      const [draft,setDraft]=useState({});

      // normalizuj stock do nowego formatu jeśli stary
      const qty = stock && stock.qty ? stock.qty : (stock||{});

      const activeCount=useMemo(()=>{
        const m={};
        rentals.filter(r=>r.status==="aktywne").forEach(r=>{m[r.equipment]=(m[r.equipment]||0)+1;});
        return m;
      },[rentals]);

      const total=eq=>qty[eq]||1;

      const summary=useMemo(()=>{
        let free=0,warn=0,occupied=0;
        EQUIPMENT.forEach(eq=>{const tot=total(eq),fr=tot-(activeCount[eq]||0);if(fr===0)occupied++;else if(fr===1&&tot>1)warn++;else free++;});
        return {free,warn,occupied};
      },[activeCount,qty]);

      const saveStock=()=>{
        const today=todayLocal();
        const prevQty=qty;
        const history=[...((stock&&stock.history)||[])];
        // dla każdego eq które się zmieniło — dodaj wpis historii
        EQUIPMENT.forEach(eq=>{
          const newQty=+draft[eq]||1;
          const oldQty=prevQty[eq]||1;
          if(newQty!==oldQty){
            history.push({eq,qty:newQty,from:today});
          }
        });
        const newQty=Object.fromEntries(EQUIPMENT.map(eq=>[eq,+draft[eq]||1]));
        setStock({qty:newQty,history});
        setShowEdit(false);
      };

      return <>
