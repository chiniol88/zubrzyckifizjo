    // ── BUDGET ────────────────────────────────────────────────────────────────
    // Struktura kategorii: [{name: "Wynagrodzenie", subs: ["Patryk", "Ania"]}, ...]
    // Migracja: stare string[] -> [{name, subs:[]}]
    function normCats(arr) {
      if(!arr||!arr.length) return [];
      return arr.map(c=>typeof c==="string"?{name:c,subs:[]}:c);
    }

    function Budget({finances,visits,rentals,budget,setBudget,desk,anthropicKey}) {
      const dk=useContext(DarkCtx);
      const demo=useDemo();
      const bg2=dk?"#1A2A2A":"#fff";
      const border=dk?"#2A4040":"#E4EAF0";
      const sub="#7A8FA6";

      const [selMonth,setSelMonth]=useState(()=>todayLocal().slice(0,7));
      const [showCatMgr,setShowCatMgr]=useState(false);
      const [showScanner,setShowScanner]=useState(false);
      const receiptMemory=useMemo(()=>budget.receiptMemory||{},[budget]);
      const setReceiptMemory=(m)=>setBudget(b=>({...b,receiptMemory:m}));
      const [showAdd,setShowAdd]=useState(null); // "income"|"expense"
      const [editItem,setEditItem]=useState(null);
      const [form,setForm]=useState({cat:"",subcat:"",desc:"",amount:""});
      // cat manager state
      const [editCat,setEditCat]=useState(null); // {type, catIdx, field:"name"|"sub", subIdx, value}
      const [newCatName,setNewCatName]=useState({income:"",expense:""});
      const [newSubName,setNewSubName]=useState({}); // {`${type}-${catIdx}`: ""}
      const [newCatType,setNewCatType]=useState("expense");

      // Normalize cats on read
      const incCats=useMemo(()=>normCats(budget.incomeCategories||[{name:"Wynagrodzenie",subs:[]},{name:"Inne",subs:[]}]).slice().sort((a,b)=>a.name.localeCompare(b.name,"pl")),[budget]);
      const expCats=useMemo(()=>normCats(budget.expenseCategories||[{name:"Mieszkanie",subs:[]},{name:"Jedzenie",subs:[]},{name:"Transport",subs:[]},{name:"Inne",subs:[]}]).slice().sort((a,b)=>a.name.localeCompare(b.name,"pl")),[budget]);

      const monthData=useMemo(()=>(budget.months||{})[selMonth]||{income:[],expenses:[]},[budget,selMonth]);

      const setMonthData=(fn)=>{
        setBudget(b=>{
          const prev=b.months||{};
          const cur=prev[selMonth]||{income:[],expenses:[]};
          return {...b,months:{...prev,[selMonth]:typeof fn==="function"?fn(cur):fn}};
        });
      };

      // Practice income for selMonth
      const practiceCats=useMemo(()=>{
        const map={Wizyta:0,Wypożyczalnia:0};
        // Wizyty: liczymy bezpośrednio z visits (tak jak zakładka Finanse)
        // żeby uwzględnić wizyty zakończone które nie mają jeszcze wpisu w finances
        (visits||[]).filter(v=>v.date&&v.date.startsWith(selMonth)&&visitStatus(v)==="zakończona").forEach(v=>{
          map["Wizyta"]+=(+v.price||0);
        });
        // Wypożyczalnia i reszta: z finances (nie-wizytowe)
        (finances||[]).filter(f=>{
          if(f.type!=="przychód")return false;
          const sid=f.sourceId||"";
          const cat=(f.category||"").toLowerCase();
          if(cat==="wózek"||sid.startsWith("wozek-"))return false;
          if(cat==="wizyta"||sid.startsWith("visit-"))return false; // wizyty już policzone wyżej
          return f.date&&f.date.startsWith(selMonth);
        }).forEach(f=>{
          map["Wypożyczalnia"]+=(+f.amount||0);
        });
        return Object.entries(map).filter(([,v])=>v>0).map(([label,v])=>({label,v}));
      },[finances,visits,selMonth]);

      // Cat helpers
      const setCats=(type,fn)=>{
        const key=type==="income"?"incomeCategories":"expenseCategories";
        setBudget(b=>{const cur=normCats(b[key]||[]);return {...b,[key]:fn(cur)};});
      };

      const addCat=(type,name)=>{
        if(!(name||"").trim())return;
        setCats(type,cats=>[...cats,{name:name.trim(),subs:[]}]);
      };
      const delCat=(type,catIdx)=>{
        setCats(type,cats=>cats.filter((_,i)=>i!==catIdx));
      };
      const moveCat=(type,idx,dir)=>{
        setCats(type,cats=>{
          const a=[...cats];const ni=idx+dir;
          if(ni<0||ni>=a.length)return a;
          [a[idx],a[ni]]=[a[ni],a[idx]];return a;
        });
      };
      const renameCat=(type,catIdx,newName)=>{
        if(!newName.trim())return;
        const key=type==="income"?"incomeCategories":"expenseCategories";
        const mkey=type==="income"?"income":"expenses";
        setBudget(b=>{
          const cats=normCats(b[key]||[]);
          const oldName=cats[catIdx].name;
          const newCats=cats.map((c,i)=>i===catIdx?{...c,name:newName.trim()}:c);
          const months={};
          Object.entries(b.months||{}).forEach(([m,md])=>{
            months[m]={...md,[mkey]:(md[mkey]||[]).map(i=>i.cat===oldName?{...i,cat:newName.trim()}:i)};
          });
          return {...b,[key]:newCats,months};
        });
        setEditCat(null);
      };
      const addSub=(type,catIdx,name)=>{
        if(!(name||"").trim())return;
        setCats(type,cats=>cats.map((c,i)=>i===catIdx?{...c,subs:[...(c.subs||[]),(name||"").trim()]}:c));
      };
      const delSub=(type,catIdx,subIdx)=>{
        setCats(type,cats=>cats.map((c,i)=>i===catIdx?{...c,subs:(c.subs||[]).filter((_,j)=>j!==subIdx)}:c));
      };
      const moveSub=(type,catIdx,subIdx,dir)=>{
        setCats(type,cats=>cats.map((c,i)=>{
          if(i!==catIdx)return c;
          const a=[...(c.subs||[])];const ni=subIdx+dir;
          if(ni<0||ni>=a.length)return c;
          [a[subIdx],a[ni]]=[a[ni],a[subIdx]];
          return {...c,subs:a};
        }));
      };
      const renameSub=(type,catIdx,subIdx,newName)=>{
        if(!newName.trim())return;
        const key=type==="income"?"incomeCategories":"expenseCategories";
        const mkey=type==="income"?"income":"expenses";
        setBudget(b=>{
          const cats=normCats(b[key]||[]);
          const oldName=cats[catIdx].subs[subIdx];
          const newCats=cats.map((c,i)=>i===catIdx?{...c,subs:c.subs.map((s,j)=>j===subIdx?newName.trim():s)}:c);
          const months={};
          Object.entries(b.months||{}).forEach(([m,md])=>{
            months[m]={...md,[mkey]:(md[mkey]||[]).map(it=>it.cat===cats[catIdx].name&&it.subcat===oldName?{...it,subcat:newName.trim()}:it)};
          });
          return {...b,[key]:newCats,months};
        });
        setEditCat(null);
      };

      // Item helpers
      const saveAdd=()=>{
        if(!form.cat||!form.amount||!form.date)return;
        const item={id:Date.now(),cat:form.cat,subcat:form.subcat||"",desc:form.desc,amount:+form.amount,date:form.date};
        const targetMonth=form.date.slice(0,7);
        const mkey=showAdd==="income"?"income":"expenses";
        if(targetMonth!==selMonth){
          setBudget(b=>{
            const tgt=(b.months||{})[targetMonth]||{income:[],expenses:[]};
            return {...b,months:{...(b.months||{}),[targetMonth]:{...tgt,[mkey]:[...(tgt[mkey]||[]),item]}}};
          });
          setSelMonth(targetMonth);
        } else {
          setMonthData(d=>showAdd==="income"
            ?{...d,income:[...(d.income||[]),item]}
            :{...d,expenses:[...(d.expenses||[]),item]});
        }
        setShowAdd(null);
      };
      const saveAddAndNext=()=>{
        if(!form.cat||!form.amount||!form.date)return;
        const item={id:Date.now(),cat:form.cat,subcat:form.subcat||"",desc:form.desc,amount:+form.amount,date:form.date};
        const targetMonth=form.date.slice(0,7);
        const mkey=showAdd==="income"?"income":"expenses";
        if(targetMonth!==selMonth){
          setBudget(b=>{
            const tgt=(b.months||{})[targetMonth]||{income:[],expenses:[]};
            return {...b,months:{...(b.months||{}),[targetMonth]:{...tgt,[mkey]:[...(tgt[mkey]||[]),item]}}};
          });
          setSelMonth(targetMonth);
        } else {
          setMonthData(d=>showAdd==="income"
            ?{...d,income:[...(d.income||[]),item]}
            :{...d,expenses:[...(d.expenses||[]),item]});
        }
        setForm(f=>({...f,desc:"",amount:"",date:targetMonth===selMonth?f.date:todayLocal()}));
      };
      const saveEdit=()=>{
        if(!editItem)return;
        const updated={...editItem.item,cat:form.cat,subcat:form.subcat||"",desc:form.desc,amount:+form.amount,date:form.date||editItem.item.date||selMonth+"-01"};
        const targetMonth=updated.date.slice(0,7);
        const mkey=editItem.type==="income"?"income":"expenses";
        if(targetMonth!==selMonth){
          setBudget(b=>{
            const cur=(b.months||{})[selMonth]||{income:[],expenses:[]};
            const tgt=(b.months||{})[targetMonth]||{income:[],expenses:[]};
            const newCur={...cur,[mkey]:(cur[mkey]||[]).filter(i=>i.id!==updated.id)};
            const newTgt={...tgt,[mkey]:[...(tgt[mkey]||[]),updated]};
            return {...b,months:{...(b.months||{}),[selMonth]:newCur,[targetMonth]:newTgt}};
          });
        } else {
          setMonthData(d=>editItem.type==="income"
            ?{...d,income:(d.income||[]).map(i=>i.id===updated.id?updated:i)}
            :{...d,expenses:(d.expenses||[]).map(i=>i.id===updated.id?updated:i)});
        }
        setEditItem(null);
      };
      const delItem=(type,id)=>{
        setMonthData(d=>type==="income"
          ?{...d,income:(d.income||[]).filter(i=>i.id!==id)}
          :{...d,expenses:(d.expenses||[]).filter(i=>i.id!==id)});
        setEditItem(null);
      };

      const practiceTotal=practiceCats.reduce((s,c)=>s+(c.v||0),0);
      const manualIncTotal=(monthData.income||[]).reduce((s,i)=>s+(+i.amount||0),0);
      // totalInc/Exp including recurring — defined below after recurring state
      const recurringIncTotalEarly=(budget.recurring||[]).filter(r=>r.type==="income"&&(!r.startMonth||r.startMonth.slice(0,7)<=selMonth)&&(!r.endMonth||r.endMonth.slice(0,7)>=selMonth)).reduce((s,r)=>{const ov=(monthData.recurringOverrides||{})[r.id];const amt=ov!==undefined?+ov.amount:+r.amount||0;return s+amt*(r.cycle==="weekly"?4:1);},0);
      const recurringExpTotalEarly=(budget.recurring||[]).filter(r=>r.type==="expense"&&(!r.startMonth||r.startMonth.slice(0,7)<=selMonth)&&(!r.endMonth||r.endMonth.slice(0,7)>=selMonth)).reduce((s,r)=>{const ov=(monthData.recurringOverrides||{})[r.id];const amt=ov!==undefined?+ov.amount:+r.amount||0;return s+amt*(r.cycle==="weekly"?4:1);},0);
      const totalInc=practiceTotal+manualIncTotal+recurringIncTotalEarly;
      const totalExp=(monthData.expenses||[]).reduce((s,i)=>s+(+i.amount||0),0)+recurringExpTotalEarly;

      const [showYear,setShowYear]=useState(false);
      const [showCompare,setShowCompare]=useState(false);
      const [showRecurringList,setShowRecurringList]=useState(false);
      const [showAnalysis,setShowAnalysis]=useState(false);

      const analysisData=useMemo(()=>{
        const months=[];
        for(let i=5;i>=0;i--){
          const d=new Date(selMonth+"-15");d.setMonth(d.getMonth()-i);
          const m=d.toISOString().slice(0,7);
          const mData=(budget.months||{})[m]||{};
          const mOverrides=(mData.recurringOverrides||{});
          const mRecExp=(budget.recurring||[]).filter(r=>r.type==="expense"&&(!r.startMonth||r.startMonth.slice(0,7)<=m)&&(!r.endMonth||r.endMonth.slice(0,7)>=m)).reduce((s,r)=>{const ov=mOverrides[r.id];return s+(ov!==undefined?+ov.amount:+r.amount||0)*(r.cycle==="weekly"?4:1);},0);
          const mRecInc=(budget.recurring||[]).filter(r=>r.type==="income"&&(!r.startMonth||r.startMonth.slice(0,7)<=m)&&(!r.endMonth||r.endMonth.slice(0,7)>=m)).reduce((s,r)=>{const ov=mOverrides[r.id];return s+(ov!==undefined?+ov.amount:+r.amount||0)*(r.cycle==="weekly"?4:1);},0);
          const mManInc=(mData.income||[]).reduce((s,i)=>s+(+i.amount||0),0);
          const mExp=(mData.expenses||[]).reduce((s,i)=>s+(+i.amount||0),0);
          let mPrac=0;
          (visits||[]).filter(v=>v.date&&v.date.startsWith(m)&&visitStatus(v)==="zakończona").forEach(v=>{mPrac+=(+v.price||0);});
          (finances||[]).filter(f=>{
            if(f.type!=="przychód")return false;
            const sid=f.sourceId||"";const cat=(f.category||"").toLowerCase();
            if(cat==="wózek"||sid.startsWith("wozek-"))return false;
            if(cat==="wizyta"||sid.startsWith("visit-"))return false;
            return f.date&&f.date.startsWith(m);
          }).forEach(f=>{mPrac+=(+f.amount||0);});
          const mTotalInc=mPrac+mManInc+mRecInc;
          const mTotalExp=mExp+mRecExp;
          months.push({m,mRecExp,mTotalInc,mTotalExp,pctInc:mTotalInc>0?Math.round(mRecExp/mTotalInc*100):null,pctExp:mTotalExp>0?Math.round(mRecExp/mTotalExp*100):null});
        }
        return months;
      },[budget,selMonth,visits,finances]);
      const [compareMonth,setCompareMonth]=useState(()=>{const d=new Date(todayLocal().slice(0,7)+"-15");d.setMonth(d.getMonth()-1);return d.toISOString().slice(0,7);});
      // If selMonth changes to equal compareMonth, shift compareMonth one month back
      const safeCompareMonth=compareMonth===selMonth?(()=>{const d=new Date(selMonth+"-15");d.setMonth(d.getMonth()-1);return d.toISOString().slice(0,7);})():compareMonth;
      const [showRecurring,setShowRecurring]=useState(null); // "income"|"expense"|null - add modal
      const [editRecurring,setEditRecurring]=useState(null);
      const [rForm,setRForm]=useState({type:"expense",cat:"",subcat:"",desc:"",amount:"",cycle:"monthly",startMonth:selMonth});
      const [editRecurringOverride,setEditRecurringOverride]=useState(null);
      const [openRecurringCats,setOpenRecurringCats]=useState(new Set());

      const recurring=useMemo(()=>budget.recurring||[],[budget]);
      const recurringInc=useMemo(()=>recurring.filter(r=>r.type==="income"&&(!r.startMonth||r.startMonth.slice(0,7)<=selMonth)&&(!r.endMonth||r.endMonth.slice(0,7)>=selMonth)),[recurring,selMonth]);
      const recurringExp=useMemo(()=>recurring.filter(r=>r.type==="expense"&&(!r.startMonth||r.startMonth.slice(0,7)<=selMonth)&&(!r.endMonth||r.endMonth.slice(0,7)>=selMonth)),[recurring,selMonth]);
      const recOverrides=useMemo(()=>monthData.recurringOverrides||{},[monthData]);
      const recAmt=(r)=>recOverrides[r.id]!==undefined?+recOverrides[r.id].amount:+r.amount;
      const recDesc=(r)=>recOverrides[r.id]!==undefined?(recOverrides[r.id].desc||r.desc||r.cat):(r.desc||r.cat);
      // monthly equivalent: weekly×4, monthly×1
      const recurringIncTotal=recurringInc.reduce((s,r)=>s+recAmt(r)*(r.cycle==="weekly"?4:1),0);
      const recurringExpTotal=recurringExp.reduce((s,r)=>s+recAmt(r)*(r.cycle==="weekly"?4:1),0);

      const saveRecurring=()=>{
        if(!rForm.cat||!rForm.amount)return;
        const item={id:Date.now(),type:rForm.type,cat:rForm.cat,subcat:rForm.subcat||"",desc:rForm.desc,amount:+rForm.amount,cycle:rForm.cycle,startMonth:rForm.startMonth||selMonth};
        setBudget(b=>({...b,recurring:[...(b.recurring||[]),item]}));
        setShowRecurring(null);
      };
      const updateRecurring=()=>{
        if(!editRecurring)return;
        setBudget(b=>({...b,recurring:(b.recurring||[]).map(r=>r.id===editRecurring.id?{...editRecurring,...rForm,amount:+rForm.amount,startMonth:rForm.startMonth||selMonth}:r)}));
        setEditRecurring(null);
      };
      const deleteRecurring=(id)=>{
        setBudget(b=>({...b,recurring:(b.recurring||[]).filter(r=>r.id!==id)}));
        setEditRecurring(null);
      };

      // Previous month helpers
      const prevMonth=useMemo(()=>{const d=new Date(selMonth+"-15");d.setMonth(d.getMonth()-1);return d.toISOString().slice(0,7);},[selMonth]);
      const prevMonthData=useMemo(()=>(budget.months||{})[prevMonth]||{income:[],expenses:[]},[budget,prevMonth]);
      const prevPracticeTotal=useMemo(()=>{
        let total=0;
        (visits||[]).filter(v=>v.date&&v.date.startsWith(prevMonth)&&visitStatus(v)==="zakończona").forEach(v=>{total+=(+v.price||0);});
        (finances||[]).filter(f=>{
          if(f.type!=="przychód")return false;
          const sid=f.sourceId||"";const cat=(f.category||"").toLowerCase();
          if(cat==="wózek"||sid.startsWith("wozek-"))return false;
          if(cat==="wizyta"||sid.startsWith("visit-"))return false;
          return f.date&&f.date.startsWith(prevMonth);
        }).forEach(f=>{total+=(+f.amount||0);});
        return total;
      },[finances,visits,prevMonth]);
      const prevOv=useMemo(()=>prevMonthData.recurringOverrides||{},[prevMonthData]);
      const prevRecInc=useMemo(()=>(budget.recurring||[]).filter(r=>r.type==="income"&&(!r.startMonth||r.startMonth.slice(0,7)<=prevMonth)&&(!r.endMonth||r.endMonth.slice(0,7)>=prevMonth)).reduce((s,r)=>{const ov=prevOv[r.id];const amt=ov!==undefined?+ov.amount:+r.amount||0;return s+amt*(r.cycle==="weekly"?4:1);},0),[budget,prevMonth,prevOv]);
      const prevRecExp=useMemo(()=>(budget.recurring||[]).filter(r=>r.type==="expense"&&(!r.startMonth||r.startMonth.slice(0,7)<=prevMonth)&&(!r.endMonth||r.endMonth.slice(0,7)>=prevMonth)).reduce((s,r)=>{const ov=prevOv[r.id];const amt=ov!==undefined?+ov.amount:+r.amount||0;return s+amt*(r.cycle==="weekly"?4:1);},0),[budget,prevMonth,prevOv]);
      const prevTotalInc=prevPracticeTotal+(prevMonthData.income||[]).reduce((s,i)=>s+(+i.amount||0),0)+prevRecInc;
      const prevTotalExp=(prevMonthData.expenses||[]).reduce((s,i)=>s+(+i.amount||0),0)+prevRecExp;
      const diffInc=prevTotalInc>0?Math.round((totalInc-prevTotalInc)/prevTotalInc*100):null;
      const diffExp=prevTotalExp>0?Math.round((totalExp-prevTotalExp)/prevTotalExp*100):null;

      const onScannerConfirm=(items,date)=>{
        const targetMonth=date?date.slice(0,7):selMonth;
        setBudget(b=>{
          const prev=b.months||{};
          const cur=prev[targetMonth]||{income:[],expenses:[]};
          return {...b,months:{...prev,[targetMonth]:{...cur,expenses:[...(cur.expenses||[]),...items.map(i=>({id:Date.now()+Math.random(),cat:i.cat,subcat:i.subcat||"",desc:i.desc,amount:i.amount,date}))]}}};
        });
        setShowScanner(false);
      };

      // Year summary
      const yearMonths=useMemo(()=>{
        const yr=selMonth.slice(0,4);
        const all=new Set();
        for(let m=1;m<=12;m++)all.add(yr+"-"+String(m).padStart(2,"0"));
        Object.keys(budget.months||{}).filter(m=>m.startsWith(yr)).forEach(m=>all.add(m));
        return Array.from(all).sort();
      },[selMonth,budget]);

      const monthsList=useMemo(()=>{
        const s=new Set();
        const cur=todayLocal().slice(0,7);s.add(cur);s.add(selMonth);
        Object.keys(budget.months||{}).forEach(m=>s.add(m));
        for(let i=1;i<=5;i++){const d=new Date(cur+"-15");d.setMonth(d.getMonth()-i);s.add(d.toISOString().slice(0,7));}
        for(let i=1;i<=3;i++){const d=new Date(cur+"-15");d.setMonth(d.getMonth()+i);s.add(d.toISOString().slice(0,7));}
        return Array.from(s).sort((a,b)=>b.localeCompare(a));
      },[budget,selMonth]);

      const getCats=(type)=>type==="income"?incCats:expCats;
      const getColor=(type)=>type==="income"?"#3DAA72":"#E05C5C";

      // CatMgrSection is defined outside Budget to prevent remount on keystroke

      // ItemForm defined outside Budget

      const [expandedCats,setExpandedCats]=useState({});
      const toggleCat=(key)=>setExpandedCats(e=>({...e,[key]:!e[key]}));

      const renderItems=(type,cats,color)=>{
        const items=type==="income"?monthData.income||[]:monthData.expenses||[];
        const recItems=type==="income"?recurringInc:recurringExp;
        const catsWithTotals=cats.map(cat=>{
          const catItems=items.filter(i=>i.cat===cat.name);
          const catRec=recItems.filter(r=>r.cat===cat.name);
          const catTotal=catItems.reduce((s,i)=>s+(+i.amount||0),0)+catRec.reduce((s,r)=>s+recAmt(r),0);
          return {cat,catItems,catRec,catTotal};
        }).filter(({catItems,catRec})=>catItems.length||catRec.length);
        const sorted=type==="expense"?[...catsWithTotals].sort((a,b)=>b.catTotal-a.catTotal):catsWithTotals;
        return sorted.map(({cat,catItems,catRec,catTotal})=>{
          if(!catItems.length&&!catRec.length)return null;
          const hasSubs=(cat.subs||[]).length>0;
          const expKey=type+"-"+cat.name;
          const isOpen=!!expandedCats[expKey];
          return <div key={cat.name}>
            {/* Category header — clickable, shows only sum */}
            <div onClick={()=>toggleCat(expKey)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 16px",background:dk?"#111E1E":type==="income"?"#F0F9F5":"#FDF7F7",cursor:"pointer",borderBottom:`1px solid ${border}`}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:11,color:isOpen?color:sub,transition:"transform .2s",display:"inline-block",transform:isOpen?"rotate(90deg)":"rotate(0deg)"}}>▶</span>
                <span style={{fontSize:13,fontWeight:700,color:dk?"#C8E8E8":"#1C2B3A"}}>{cat.name}</span>
                <span style={{fontSize:11,color:sub}}>{catItems.length+catRec.length} {(catItems.length+catRec.length)===1?"wpis":"wpisów"}</span>
              </div>
              <span style={{fontWeight:800,fontSize:14,color}}>{demo?"****":catTotal.toFixed(2)} zł</span>
            </div>
            {/* Expanded: subcategories as sums, or items if no subcats */}
            {isOpen&&<div style={{background:dk?"#0D1A1A":type==="income"?"#F7FCF9":"#FDF5F5"}}>
              {hasSubs
                ? (cat.subs||[]).map(s=>{
                    const subItems=catItems.filter(i=>i.subcat===s);
                    const subRec=catRec.filter(r=>r.subcat===s);
                    if(!subItems.length&&!subRec.length)return null;
                    const subTotal=subItems.reduce((a,i)=>a+(+i.amount||0),0)+subRec.reduce((a,r)=>a+recAmt(r),0);
                    const subKey=expKey+"-"+s;
                    const subOpen=!!expandedCats[subKey];
                    const subCount=subItems.length+subRec.length;
                    return <div key={s}>
                      {/* Subcategory row — shows sum, click to expand items */}
                      <div onClick={()=>setExpandedCats(e=>({...e,[subKey]:!e[subKey]}))}
                        style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 16px 9px 28px",background:dk?"#0F1B1B":type==="income"?"#EBF7F1":"#FAF0F0",borderBottom:`1px solid ${border}`,cursor:"pointer"}}>
                        <div style={{display:"flex",alignItems:"center",gap:6}}>
                          <span style={{fontSize:10,color:subOpen?color:sub,display:"inline-block",transform:subOpen?"rotate(90deg)":"rotate(0deg)"}}>▶</span>
                          <span style={{fontSize:13,fontWeight:600,color:dk?"#C8E8E8":"#1C2B3A"}}>↳ {s}</span>
                          <span style={{fontSize:10,color:sub}}>{subCount} {subCount===1?"wpis":"wpisów"}</span>
                        </div>
                        <span style={{fontWeight:700,fontSize:13,color}}>{demo?"****":subTotal.toFixed(2)} zł</span>
                      </div>
                      {/* Expanded subcategory items */}
                      {subOpen&&<>
                        {subItems.slice().sort((a,b)=>(a.date||"").localeCompare(b.date||"")).map(item=><div key={item.id} onClick={()=>{setForm({cat:item.cat,subcat:item.subcat||"",desc:item.desc||"",amount:String(item.amount),date:item.date||selMonth+"-01"});setEditItem({type,item});}}
                          style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 16px 8px 44px",borderBottom:`1px solid ${border}`,cursor:"pointer"}}>
                          <div style={{minWidth:0,flex:1}}>
                            <span style={{fontSize:12,color:sub}}>{demo?"••••":item.desc||item.subcat||item.cat}</span>
                            {item.date&&<span style={{fontSize:10,color:sub,marginLeft:6,opacity:.7}}>{new Date(item.date+"T12:00:00").toLocaleDateString("pl-PL",{day:"numeric",month:"short"})}</span>}
                          </div>
                          <span style={{fontWeight:600,fontSize:12,color,flexShrink:0}}>{demo?"****":(+item.amount).toFixed(2)} zł</span>
                        </div>)}
                        {catRec.filter(r=>r.subcat===s).map(r=><div key={r.id} onClick={()=>setEditRecurringOverride({r,type})}
                          style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 16px 8px 44px",borderBottom:`1px solid ${border}`,cursor:"pointer"}}>
                          <div style={{display:"flex",alignItems:"center",gap:6}}>
                            <span style={{fontSize:11,color,opacity:.6}}>{recOverrides[r.id]!==undefined?"↻*":"↻"}</span>
                            <span style={{fontSize:12,color:sub}}>{demo?"••••":recDesc(r)}</span>
                          </div>
                          <span style={{fontWeight:600,fontSize:12,color}}>{demo?"****":recAmt(r).toFixed(2)} zł</span>
                        </div>)}
                      </>}
                    </div>;
                  })
                : null
              }
              {catItems.filter(i=>!i.subcat).slice().sort((a,b)=>(a.date||"").localeCompare(b.date||"")).map(item=><div key={item.id} onClick={()=>{setForm({cat:item.cat,subcat:"",desc:item.desc||"",amount:String(item.amount),date:item.date||selMonth+"-01"});setEditItem({type,item});}}
                style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 16px",borderBottom:`1px solid ${border}`,cursor:"pointer"}}>
                <div style={{minWidth:0,flex:1}}>
                  <span style={{fontSize:12,color:sub}}>{demo?"••••":item.desc||item.cat}</span>
                  {item.date&&<span style={{fontSize:10,color:sub,marginLeft:6,opacity:.7}}>{new Date(item.date+"T12:00:00").toLocaleDateString("pl-PL",{day:"numeric",month:"short"})}</span>}
                </div>
                <span style={{fontWeight:600,fontSize:12,color,flexShrink:0}}>{demo?"****":(+item.amount).toFixed(2)} zł</span>
              </div>)}
              {catRec.filter(r=>!r.subcat).map(r=><div key={r.id} onClick={()=>setEditRecurringOverride({r,type})}
                style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 16px",borderBottom:`1px solid ${border}`,cursor:"pointer"}}>
                <div style={{display:"flex",alignItems:"center",gap:6}}>
                  <span style={{fontSize:12,color,opacity:.6}}>{recOverrides[r.id]!==undefined?"↻*":"↻"}</span>
                  <span style={{fontSize:12,color:sub}}>{demo?"••••":recDesc(r)}</span>
                </div>
                <span style={{fontWeight:600,fontSize:12,color}}>{demo?"****":recAmt(r).toFixed(2)} zł</span>
              </div>)}
            </div>}
          </div>;
        });
      };

      return <div style={{padding:"0 20px 40px"}}>
        {/* Month selector — kompaktowy */}
        <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:16}}>
          <button onClick={()=>{const d=new Date(selMonth+"-15");d.setMonth(d.getMonth()-1);setSelMonth(d.toISOString().slice(0,7));}} style={{flexShrink:0,width:36,height:36,borderRadius:10,border:`1.5px solid ${border}`,background:"none",cursor:"pointer",fontWeight:700,fontSize:18,color:dk?"#7ABABA":"#4A6070",fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"center"}}>‹</button>
          <div style={{flex:1,textAlign:"center",fontWeight:700,fontSize:16,color:dk?"#E8F5F5":"#1C2B3A",fontFamily:"'Syne',sans-serif"}}>

              <span style={{fontWeight:700,fontSize:13,color:"#3DAA72"}}>{demo?"****":c.v.toFixed(2)} zł</span>
            </div>)}
          </>}
          {renderItems("income",incCats,"#3DAA72")}
          {(monthData.income||[]).length===0&&practiceCats.length===0&&recurringInc.length===0&&<div style={{padding:16,textAlign:"center",color:sub,fontSize:13}}>Brak przychodów</div>}
        </div>

        {/* KOSZTY */}
        <div style={{background:bg2,borderRadius:16,marginBottom:12,boxShadow:"0 1px 4px rgba(0,0,0,.06)",overflow:"hidden"}}>
          <div style={{padding:"12px 16px",borderBottom:`1px solid ${border}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <div>
                <span style={{fontSize:11,fontWeight:700,color:sub,textTransform:"uppercase",letterSpacing:.5}}>Koszty</span>
                {diffExp!==null&&<span style={{marginLeft:6,background:diffExp<=0?"#3DAA7220":"#E05C5C20",borderRadius:6,padding:"2px 6px",fontSize:10,fontWeight:700,color:diffExp<=0?"#3DAA72":"#E05C5C"}}>{diffExp>=0?"+":""}{diffExp}%</span>}
              </div>
              <span style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:15,color:"#E05C5C",whiteSpace:"nowrap"}}>{demo?"****":totalExp.toFixed(2)} zł</span>
            </div>
            <div style={{display:"flex",gap:6}}>
              <button onClick={()=>{const c=expCats[0];setForm({cat:c?c.name:"",subcat:"",desc:"",amount:"",date:selMonth===todayLocal().slice(0,7)?todayLocal():selMonth+"-01"});setShowAdd("expense");}} style={{flex:1,padding:"8px 10px",borderRadius:10,border:"none",background:"#E05C5C",color:"#fff",fontWeight:600,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>+ Dodaj</button>
              <button onClick={()=>{const c=expCats[0];setRForm({type:"expense",cat:c?c.name:"",subcat:"",desc:"",amount:"",cycle:"monthly",startMonth:selMonth});setShowRecurring("expense");}} style={{padding:"8px 12px",borderRadius:10,border:`1.5px solid ${border}`,background:"none",color:sub,fontWeight:600,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>↻</button>
            </div>
          </div>
          {renderItems("expense",expCats,"#E05C5C")}
          {(monthData.expenses||[]).length===0&&recurringExp.length===0&&<div style={{padding:16,textAlign:"center",color:sub,fontSize:13}}>Brak kosztów</div>}
        </div>
        </div>{/* end side-by-side grid */}

        {/* HISTORIA MIESIĄCA */}
        {(()=>{
          const allEntries=[
            ...(practiceCats.map(c=>({id:"prac-"+c.label,date:selMonth+"-01",cat:"Praktyka",subcat:c.label,desc:c.label+" (auto)",amount:c.v,type:"income"}))),
            ...(recurringInc.map(r=>({id:"rec-"+r.id,date:selMonth+"-"+(r.dayOfMonth||1).toString().padStart(2,"0"),cat:r.cat,subcat:r.subcat||"",desc:recDesc(r),amount:recAmt(r),type:"income"}))),
            ...(recurringExp.map(r=>({id:"rec-"+r.id,date:selMonth+"-"+(r.dayOfMonth||1).toString().padStart(2,"0"),cat:r.cat,subcat:r.subcat||"",desc:recDesc(r),amount:recAmt(r),type:"expense"}))),
            ...(monthData.income||[]).map(i=>({...i,type:"income",date:i.date||selMonth+"-01"})),
            ...(monthData.expenses||[]).map(e=>({...e,type:"expense",date:e.date||selMonth+"-01"})),
          ].sort((a,b)=>b.date.localeCompare(a.date)||(a.type==="income"?-1:1));
          if(!allEntries.length)return null;
          return <div style={{background:bg2,borderRadius:16,marginBottom:12,boxShadow:"0 1px 4px rgba(0,0,0,.06)",overflow:"hidden"}}>
            <div style={{padding:"10px 16px",borderBottom:`1px solid ${border}`,fontSize:11,fontWeight:700,color:sub,textTransform:"uppercase",letterSpacing:.5}}>Wszystkie wpisy</div>
            {allEntries.map((e,i)=>{
              const isPrac=String(e.id).startsWith("prac-");
              const isRec=String(e.id).startsWith("rec-");
              const handleClick=isPrac?null:isRec?()=>{
                const rid=+String(e.id).slice(4);
                const r=(budget.recurring||[]).find(x=>x.id===rid);
                if(r)setEditRecurringOverride({r,type:e.type});
              }:()=>{
                setForm({cat:e.cat,subcat:e.subcat||"",desc:e.desc||"",amount:String(e.amount),date:e.date||selMonth+"-01"});
                setEditItem({type:e.type,item:e});
              };
              return <div key={e.id||i} onClick={handleClick||undefined}
                style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 16px",borderBottom:i<allEntries.length-1?`1px solid ${border}`:"none",cursor:isPrac?"default":"pointer"}}>
                <div style={{minWidth:0,flex:1}}>
                  <div style={{fontSize:13,fontWeight:500,color:dk?"#C8E8E8":"#1C2B3A",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{demo?"••••":e.desc||e.cat}</div>
                  <div style={{fontSize:11,color:sub,marginTop:1}}>{e.cat}{e.subcat?" · "+e.subcat:""} · {new Date(e.date+"T12:00:00").toLocaleDateString("pl-PL",{day:"numeric",month:"short"})}{isRec?" · ↻":isPrac?" · auto":""}</div>
                </div>
                <span style={{fontWeight:700,fontSize:13,color:e.type==="income"?"#3DAA72":"#E05C5C",flexShrink:0,marginLeft:8}}>{e.type==="income"?"+":"-"}{demo?"****":(+e.amount).toFixed(2)} zł</span>
              </div>;
            })}
          </div>;
        })()}

        {showAdd&&<BudgetItemForm type={showAdd} cats={showAdd==="income"?incCats:expCats} form={form} setForm={setForm} title={showAdd==="income"?"Nowy przychód":"Nowy koszt"} onSave={saveAdd} onSaveAndNext={saveAddAndNext} onClose={()=>setShowAdd(null)}/>}

        {editItem&&<BudgetEditItemForm
          cats={getCats(editItem.type)}
          initial={form}
          selMonth={selMonth}
          onSave={saveEdit}
          onDelete={()=>delItem(editItem.type,editItem.item.id)}
          onClose={()=>setEditItem(null)}
          onFormChange={setForm}
        />}

        {showRecurring&&<BudgetRecurringForm
          type={showRecurring}
          cats={getCats(showRecurring)}
          initial={rForm}
          selMonth={selMonth}
          dk={dk}
          border={border}
          title={showRecurring==="income"?"Nowy cykliczny przychód":"Nowy cykliczny koszt"}
          onSave={(f)=>{setBudget(b=>({...b,recurring:[...(b.recurring||[]),{...f,id:Date.now(),amount:+f.amount}]}));setShowRecurring(null);}}
          onClose={()=>setShowRecurring(null)}
        />}

        {editRecurringOverride&&<BudgetRecurringOverrideForm
          r={editRecurringOverride.r}
          selMonth={selMonth}
          overrideVal={recOverrides[editRecurringOverride.r.id]}
          dk={dk}
          border={border}
          onSave={(ov)=>{
            setMonthData(d=>({...d,recurringOverrides:{...(d.recurringOverrides||{}),[editRecurringOverride.r.id]:ov}}));
            setEditRecurringOverride(null);
          }}
          onReset={()=>{
            const ov={...(monthData.recurringOverrides||{})};
            delete ov[editRecurringOverride.r.id];
            setMonthData(d=>({...d,recurringOverrides:ov}));
            setEditRecurringOverride(null);
          }}
          onEditGlobal={()=>{
            const r=editRecurringOverride.r;
            setRForm({type:r.type,cat:r.cat,subcat:r.subcat||"",desc:r.desc,amount:String(r.amount),cycle:"monthly",startMonth:(r.startMonth||selMonth+"-01").length===7?(r.startMonth||selMonth)+"-01":(r.startMonth||selMonth+"-01"),endMonth:r.endMonth?(r.endMonth.length===7?r.endMonth+"-01":r.endMonth):""});
            setEditRecurring(r);
            setEditRecurringOverride(null);
          }}
          onClose={()=>setEditRecurringOverride(null)}
        />}

        {editRecurring&&<BudgetEditRecurringForm
          type={editRecurring.type}
          cats={getCats(editRecurring.type)}
          initial={rForm}
          selMonth={selMonth}
          dk={dk}
          border={border}
          onSave={(f)=>{setBudget(b=>({...b,recurring:(b.recurring||[]).map(r=>r.id===editRecurring.id?{...r,...f,amount:+f.amount}:r)}));setEditRecurring(null);}}
          onDelete={()=>deleteRecurring(editRecurring.id)}
          onClose={()=>setEditRecurring(null)}
        />}

        {showScanner&&<ReceiptScanner
          onClose={()=>setShowScanner(false)}
          onConfirm={onScannerConfirm}
          expCats={expCats}
          incCats={incCats}
          memory={receiptMemory}
          setMemory={setReceiptMemory}
          selMonth={selMonth}
          existingExpenses={(monthData.expenses||[])}
          anthropicKey={anthropicKey}
        />}

        {showCatMgr&&<Modal title="Zarządzaj kategoriami" onClose={()=>setShowCatMgr(false)}>
          <CatMgrSection type="income" cats={incCats} color="#3DAA72" border={border} sub={sub} dk={dk} editCat={editCat} setEditCat={setEditCat} moveCat={moveCat} renameCat={renameCat} delCat={delCat} addSub={addSub} moveSub={moveSub} renameSub={renameSub} delSub={delSub} addCat={addCat}/>
          <CatMgrSection type="expense" cats={expCats} color="#E05C5C" border={border} sub={sub} dk={dk} editCat={editCat} setEditCat={setEditCat} moveCat={moveCat} renameCat={renameCat} delCat={delCat} addSub={addSub} moveSub={moveSub} renameSub={renameSub} delSub={delSub} addCat={addCat}/>
        </Modal>}
      </div>;
    }


    const emptyNFZ = () => ({patientName:"",address:"",phone:"",hasDisabilityCert:false,wheelchairModel:"",orderDate:"",notes:""});

    const nextOrderDate = (cas) => {
      if(!cas.orderDate) return null;
      const [y,m,d] = cas.orderDate.split("-").map(Number);
      const years = cas.hasDisabilityCert ? 1 : 4;
      return new Date(y+years,m-1,d).getFullYear()+"-"+String(new Date(y+years,m-1,d).getMonth()+1).padStart(2,"0")+"-"+String(new Date(y+years,m-1,d).getDate()).padStart(2,"0");
    };

    function NFZ({nfzCases,setNfzCases,initialSel,onSelCleared,setFinances,patients,setPatients,allClients}) {
      const dk = useContext(DarkCtx);
      const demo = useDemo();
      const [showAdd,setShowAdd] = useState(false);
      const [form,setForm] = useState(emptyNFZ);
      const [selId,setSelId] = useState(null);
      const [editForm,setEditForm] = useState(null);
      const [confirmDel,setConfirmDel] = useState(false);
      const [toast,setToast] = useState(null);
      const [tab,setTab] = useState("orzeczenie");
      const [payModal,setPayModal] = useState(null); // {casId, date, name}
      const [payAmount,setPayAmount] = useState("");

      useEffect(()=>{if(initialSel!=null){setSelId(initialSel);}}, [initialSel]);
      const closeDetail=()=>{setSelId(null);if(onSelCleared)onSelCleared();};

      const cases = nfzCases || [];
      const today = todayLocal();

      const withCert  = cases.filter(c=>c.hasDisabilityCert);
      const withoutCert = cases.filter(c=>!c.hasDisabilityCert);
      const sortByNext = arr => [...arr].sort((a,b)=>{
        const na=nextOrderDate(a)||"9999", nb=nextOrderDate(b)||"9999";
        return na.localeCompare(nb);
      });

      if (selId !== null) {
        const cas = cases.find(c => c.id === selId);
        if (!cas) { setSelId(null); return null; }
        const nd = nextOrderDate(cas);
        const daysLeft = nd ? dateDiff(today, nd) : null;
        return <>
          <div>
            <button onClick={()=>setSelId(null)} style={{background:"none",border:"none",display:"flex",alignItems:"center",gap:6,color:"#0A7C7C",fontWeight:600,cursor:"pointer",padding:"20px 20px 0",fontFamily:"inherit",fontSize:14}}>
              <Ico d={I.back} s={18} c="#0A7C7C"/> Wózki
            </button>
            <div style={{padding:"16px 20px 0"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
                <div style={{fontFamily:"'Syne',sans-serif",fontSize:22,fontWeight:800}}>{demo?"Pacjent":cas.patientName}</div>
                <Btn small variant="secondary" onClick={()=>setEditForm({...cas})}>✏️ Edytuj</Btn>
              </div>
              <Card style={{marginBottom:10}}>
                <div style={{fontSize:11,fontWeight:700,color:"#7A8FA6",textTransform:"uppercase",letterSpacing:.5,marginBottom:10}}>Dane pacjenta</div>
                <div style={{display:"grid",gap:10}}>
                  {cas.phone&&<div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span style={{fontSize:14,color:dk?"#C8E8E8":"#1C2B3A"}}>{maskPhone(demo,cas.phone)}</span>
                    {!demo&&<div style={{display:"flex",gap:6}}>
                      <a href={`tel:${cas.phone.replace(/\s/g,"")}`} style={{textDecoration:"none"}}><Btn small variant="secondary"><Ico d={I.ph} s={15} c="#0A7C7C"/> Zadzwoń</Btn></a>
                      <a href={`sms:${cas.phone.replace(/\s/g,"")}`} style={{textDecoration:"none"}}><Btn small variant="secondary"><Ico d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" s={15} c="#0A7C7C"/> SMS</Btn></a>
                    </div>}
                  </div>}
                  {cas.address&&<div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span style={{fontSize:14,color:"#7A8FA6",flex:1,paddingRight:8}}>{maskAddr(demo,cas.address)}</span>
                    {!demo&&<a href={`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(cas.address)}`} target="_blank" rel="noreferrer" style={{textDecoration:"none",flexShrink:0}}><Btn small variant="secondary">🗺️ Trasa</Btn></a>}
                  </div>}
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <div style={{width:18,height:18,borderRadius:5,border:`2px solid ${cas.hasDisabilityCert?"#3DAA72":"#E4EAF0"}`,background:cas.hasDisabilityCert?"#3DAA72":"#fff",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                      {cas.hasDisabilityCert&&<span style={{color:"#fff",fontSize:11}}>✓</span>}
                    </div>
                    <span style={{fontSize:14,color:dk?"#C8E8E8":"#1C2B3A"}}>Orzeczenie o niepełnosprawności (stopień znaczny)</span>
                  </div>
                </div>
              </Card>
              {(cas.wheelchairModel||cas.orderDate)&&<Card style={{marginBottom:10}}>
                <div style={{fontSize:11,fontWeight:700,color:"#7A8FA6",textTransform:"uppercase",letterSpacing:.5,marginBottom:10}}>Wózek</div>
                {cas.wheelchairModel&&<div style={{marginBottom:6}}><span style={{fontSize:12,color:"#7A8FA6"}}>Model: </span><span style={{fontWeight:600,fontSize:14}}>{cas.wheelchairModel}</span></div>}
                {cas.orderDate&&<div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
                  <div><span style={{fontSize:12,color:"#7A8FA6"}}>Data zamówienia: </span><span style={{fontWeight:600,fontSize:14}}>{cas.orderDate}</span></div>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    {cas.realized&&<span style={{fontSize:12,color:"#3DAA72",fontWeight:600}}>✓ Zrealizowano</span>}
                    <div onClick={()=>{if(!cas.realized){setPayModal({casId:cas.id,date:cas.orderDate,name:cas.patientName});setPayAmount("");}else{setNfzCases(cs=>cs.map(x=>x.id===cas.id?{...x,realized:false}:x));setToast("Cofnięto realizację");}}}
                      style={{width:24,height:24,borderRadius:7,border:`2px solid ${cas.realized?"#3DAA72":"#E4EAF0"}`,background:cas.realized?"#3DAA72":"#fff",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0}}>
                      {cas.realized&&<span style={{color:"#fff",fontSize:13}}>✓</span>}
                    </div>
                  </div>
                </div>}
                {nd&&<div style={{marginTop:10,paddingTop:10,borderTop:"1px solid #E4EAF0"}}>
                  <div style={{fontSize:12,color:"#7A8FA6",marginBottom:4}}>Kolejne zamówienie możliwe od:</div>
                  <div style={{fontWeight:700,fontSize:15}}>{nd}</div>
                  <div style={{fontSize:13,marginTop:4,color:daysLeft<=0?"#3DAA72":daysLeft<=30?"#F4A261":"#7A8FA6"}}>
                    {daysLeft<=0?"✓ Można już składać wniosek":daysLeft===1?"Jutro":daysLeft<0?`${Math.abs(daysLeft)} dni temu`:`za ${daysLeft} dni`}
                  </div>
                </div>}
              </Card>}
              {cas.notes&&<Card style={{marginBottom:10,background:"#FFFBF5",border:"1.5px solid #F4A26130"}}>
                <div style={{fontSize:11,fontWeight:700,color:"#F4A261",textTransform:"uppercase",letterSpacing:.5,marginBottom:6}}>Notatki</div>
                <div style={{fontSize:14,lineHeight:1.6,whiteSpace:"pre-wrap"}}>{cas.notes}</div>
              </Card>}
              <Btn variant="danger" style={{width:"100%",justifyContent:"center",marginTop:4}} onClick={()=>setConfirmDel(true)}>🗑️ Usuń</Btn>
            </div>
          </div>
          {editForm&&<Modal title="Edytuj" onClose={()=>setEditForm(null)}>
            <PatientPicker label="Klient" value={editForm.patientName} onChange={v=>setEditForm(f=>({...f,patientName:v}))} onSelect={p=>setEditForm(f=>({...f,patientName:p.name,phone:p.phone||f.phone,address:p.address||f.address,patientId:p.id}))} patients={allClients||patients||[]}/>
            <Inp label="Adres" value={editForm.address||""} onChange={v=>setEditForm(f=>({...f,address:v}))} placeholder="ul. Przykładowa 1, Gliwice"/>
            <Inp label="Telefon" value={editForm.phone||""} onChange={v=>setEditForm(f=>({...f,phone:v}))} type="tel"/>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14,cursor:"pointer"}} onClick={()=>setEditForm(f=>({...f,hasDisabilityCert:!f.hasDisabilityCert}))}>
              <div style={{width:22,height:22,borderRadius:6,border:`2px solid ${editForm.hasDisabilityCert?"#3DAA72":"#E4EAF0"}`,background:editForm.hasDisabilityCert?"#3DAA72":"#fff",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                {editForm.hasDisabilityCert&&<span style={{color:"#fff",fontSize:13}}>✓</span>}
              </div>
              <span style={{fontSize:14,fontWeight:500}}>Orzeczenie o niepełnosprawności (stopień znaczny)</span>
            </div>
            <Inp label="Model wózka" value={editForm.wheelchairModel||""} onChange={v=>setEditForm(f=>({...f,wheelchairModel:v}))} placeholder="np. Wózek aktywny X"/>
            <Inp label="Data zamówienia" value={editForm.orderDate||""} onChange={v=>setEditForm(f=>({...f,orderDate:v}))} type="date"/>
            <Txa label="Notatki" value={editForm.notes||""} onChange={v=>setEditForm(f=>({...f,notes:v}))} rows={2}/>
            <Btn style={{width:"100%",justifyContent:"center"}} onClick={()=>{setNfzCases(cs=>cs.map(x=>x.id===selId?{...x,...editForm}:x));setEditForm(null);setToast("Zapisano zmiany");}}>Zapisz zmiany</Btn>
          </Modal>}
          {confirmDel&&<Modal title="Usuń" onClose={()=>setConfirmDel(false)}>
            <div style={{fontSize:15,marginBottom:20}}>Na pewno usunąć tę pozycję?</div>
            <div style={{display:"flex",gap:10}}>
              <Btn variant="secondary" style={{flex:1,justifyContent:"center"}} onClick={()=>setConfirmDel(false)}>Anuluj</Btn>
              <Btn variant="danger" style={{flex:1,justifyContent:"center"}} onClick={()=>{setFinances(fs=>fs.filter(f=>f.sourceId!=="wozek-"+selId));setNfzCases(cs=>cs.filter(x=>x.id!==selId));setConfirmDel(false);setSelId(null);}}>Usuń</Btn>
            </div>
          </Modal>}
          {payModal&&<Modal title="Kwota przychodu" onClose={()=>setPayModal(null)}>
            <div style={{fontSize:14,color:"#7A8FA6",marginBottom:14}}>{payModal.name} · {payModal.date}</div>
            <Inp label="Kwota (zł) *" value={payAmount} onChange={setPayAmount} type="number" placeholder="0"/>
            <Btn disabled={!payAmount||+payAmount<=0} style={{width:"100%",justifyContent:"center"}} onClick={()=>{
              const sid="wozek-"+payModal.casId;
              setFinances(fs=>[{id:Date.now(),sourceId:sid,date:payModal.date,type:"przychód",category:"Wózek",amount:+payAmount,description:"Wózek – "+payModal.name},...(fs||[])]);
              setNfzCases(cs=>cs.map(x=>x.id===payModal.casId?{...x,realized:true}:x));
              setPayModal(null);setPayAmount("");setToast("Dodano do finansów");
            }}>Zapisz i oznacz jako zrealizowany</Btn>
          </Modal>}
          {toast&&<Toast msg={toast} onDone={()=>setToast(null)}/>}
        </>;
      }

      const listItems = sortByNext(tab==="orzeczenie" ? withCert : withoutCert);
      return <div>
        <div style={{padding:"28px 20px 12px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{fontFamily:"'Syne',sans-serif",fontSize:24,fontWeight:800}}>Wózki</div>
          <Btn small onClick={()=>{setForm(emptyNFZ());setShowAdd(true);}}><Ico d={I.plus} s={16} c="#fff"/> Nowy</Btn>
        </div>
        <div style={{display:"flex",gap:6,padding:"0 20px 14px"}}>
          {[{k:"orzeczenie",l:`Z orzeczeniem (${withCert.length})`},{k:"bez",l:`Bez orzeczenia (${withoutCert.length})`}].map(t=>
            <button key={t.k} onClick={()=>setTab(t.k)} style={{padding:"8px 14px",borderRadius:20,border:"none",cursor:"pointer",fontWeight:600,fontSize:13,whiteSpace:"nowrap",background:tab===t.k?"#0A7C7C":"#E4EAF0",color:tab===t.k?"#fff":"#7A8FA6",fontFamily:"inherit"}}>{t.l}</button>
          )}
        </div>
        <div style={{padding:"0 20px"}}>
          {listItems.length===0&&<Empty text="Brak wpisów"/>}
          {listItems.map(cas=>{
            const nd=nextOrderDate(cas);
            const dl=nd?dateDiff(today,nd):null;
            return <Card key={cas.id} onClick={()=>setSelId(cas.id)}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:15,marginBottom:3}}>{demo?"Pacjent":cas.patientName}</div>
                  <div style={{fontSize:13,color:"#7A8FA6",display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
                    {cas.wheelchairModel&&<span>🦽 {cas.wheelchairModel}</span>}
                    {cas.orderDate&&<span>📅 {cas.orderDate}</span>}
                    {cas.realized&&<span style={{color:"#3DAA72",fontWeight:600}}>✓ zrealizowany</span>}
                  </div>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:10,flexShrink:0,paddingLeft:10}}>
                  <div onClick={e=>{e.stopPropagation();if(!cas.realized){setPayModal({casId:cas.id,date:cas.orderDate||"",name:cas.patientName});setPayAmount("");}else{setNfzCases(cs=>cs.map(x=>x.id===cas.id?{...x,realized:false}:x));}}}
                    style={{width:24,height:24,borderRadius:7,border:`2px solid ${cas.realized?"#3DAA72":"#E4EAF0"}`,background:cas.realized?"#3DAA72":"#fff",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}>
                    {cas.realized&&<span style={{color:"#fff",fontSize:13}}>✓</span>}
                  </div>
                  <div style={{textAlign:"right"}}>
                    {nd&&<div style={{fontSize:12,color:dl<=0?"#3DAA72":"#7A8FA6",fontWeight:dl<=0?700:400}}>{dl<=0?"➜ można złożyć":"➜ "+nd}</div>}
                    <Ico d="M9 18l6-6-6-6" s={18} c="#7A8FA6"/>
                  </div>
                </div>
              </div>
            </Card>;
          })}
        </div>
        {showAdd&&<Modal title="Nowy wózek" onClose={()=>setShowAdd(false)}>
          <PatientPicker label="Klient *" value={form.patientName} onChange={v=>setForm(f=>({...f,patientName:v}))} onSelect={p=>setForm(f=>({...f,patientName:p.name,phone:p.phone||f.phone,address:p.address||f.address,patientId:p.id}))} patients={allClients||patients||[]}/>
          <Inp label="Adres" value={form.address} onChange={v=>setForm(f=>({...f,address:v}))} placeholder="ul. Przykładowa 1, Gliwice"/>
          <Inp label="Telefon" value={form.phone} onChange={v=>setForm(f=>({...f,phone:v}))} type="tel"/>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14,cursor:"pointer"}} onClick={()=>setForm(f=>({...f,hasDisabilityCert:!f.hasDisabilityCert}))}>
            <div style={{width:22,height:22,borderRadius:6,border:`2px solid ${form.hasDisabilityCert?"#3DAA72":"#E4EAF0"}`,background:form.hasDisabilityCert?"#3DAA72":"#fff",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
              {form.hasDisabilityCert&&<span style={{color:"#fff",fontSize:13}}>✓</span>}
            </div>
            <span style={{fontSize:14,fontWeight:500}}>Orzeczenie o niepełnosprawności (stopień znaczny)</span>
          </div>
          <Inp label="Model wózka" value={form.wheelchairModel} onChange={v=>setForm(f=>({...f,wheelchairModel:v}))} placeholder="np. Wózek aktywny X"/>
          <Inp label="Data zamówienia" value={form.orderDate} onChange={v=>setForm(f=>({...f,orderDate:v}))} type="date"/>
          <Txa label="Notatki" value={form.notes} onChange={v=>setForm(f=>({...f,notes:v}))} rows={2}/>
          <Btn disabled={!form.patientName} style={{width:"100%",justifyContent:"center"}} onClick={()=>{if(!form.patientName)return;setNfzCases(cs=>[{...form,id:Date.now()},...(cs||[])]);if(setPatients&&!(patients||[]).find(p=>p.name===form.patientName)){setPatients(ps=>[...(ps||[]),{id:Date.now()+1,name:form.patientName,phone:form.phone||"",address:form.address||"",diagnosis:"",notes:"",defaultPrice:"",birthday:""}]);}setForm(emptyNFZ());setShowAdd(false);setToast("Dodano");}}>Dodaj</Btn>
        </Modal>}
        {toast&&<Toast msg={toast} onDone={()=>setToast(null)}/>}
      </div>;

    // ── SERVICE ───────────────────────────────────────────────────────────────

    function Service({rentals,machines,setMachines,setFinances}) {
      const dk=useContext(DarkCtx);
      const demo=useDemo();
      const [selId,setSelId]=useState(null);
      const [showAdd,setShowAdd]=useState(false);
      const [showAddSrv,setShowAddSrv]=useState(null);
      const [editId,setEditId]=useState(null);
      const [confirmDel,setConfirmDel]=useState(null);
      const today=todayLocal();
      const bg=dk?"#0F1F1F":"#F7FAFA";
      const borderC=dk?"#1A3030":"#E4EAF0";
      const textC=dk?"#E8F5F5":"#1C2B3A";
      const subC=dk?"#5A8A8A":"#7A8FA6";

      const emptyMachine=()=>({type:EQUIPMENT[0],name:"",serialNo:"",purchaseDate:"",lastServiceDate:"",servicePeriodDays:365,notes:""});
      const emptySrv=()=>({date:today,type:"Przegląd",notes:"",cost:""});
      const [form,setForm]=useState(emptyMachine);
      const [srvForm,setSrvForm]=useState(emptySrv);

      const getStatus=m=>{
        if(!m.lastServiceDate)return "brak";
        const days=Math.round((new Date(today)-new Date(m.lastServiceDate))/86400000);
        const left=(+m.servicePeriodDays||365)-days;
        if(left<0)return "zaległy";
        if(left<30)return "wkrótce";
        return "ok";
      };
      const getDaysLeft=m=>{
        if(!m.lastServiceDate)return null;
        const days=Math.round((new Date(today)-new Date(m.lastServiceDate))/86400000);
        return (+m.servicePeriodDays||365)-days;
      };

      const activeByType=useMemo(()=>{
        const map={};
        (rentals||[]).filter(r=>r.status!=="zakończone"&&(!r.endDate||r.endDate>=today)).forEach(r=>{
          if(!r.equipment)return;
          if(!map[r.equipment])map[r.equipment]=[];
          map[r.equipment].push(r);
        });
        return map;
      },[rentals,today]);

      const rentalCountByType=useMemo(()=>{
        const map={};
        (rentals||[]).forEach(r=>{if(r.equipment)map[r.equipment]=(map[r.equipment]||0)+1;});
        return map;
      },[rentals]);

      const getMachineLoc=m=>{
        const sameType=(machines||[]).filter(x=>x.type===m.type);
        const idx=sameType.findIndex(x=>x.id===m.id);
        const active=[...(activeByType[m.type]||[])].sort((a,b)=>(a.startDate||"").localeCompare(b.startDate||""));
        return active[idx]||null;
      };

      const deleteSrvEntry=(machineId,entryId)=>{
        setMachines(ms=>ms.map(m=>{
          if(m.id!==machineId)return m;
          const log=(m.serviceLog||[]).filter(s=>s.id!==entryId);
          const lastServiceDate=log.length>0?log.reduce((a,b)=>(a.date>b.date?a:b)).date:null;
          return{...m,serviceLog:log,lastServiceDate};
        }));
        setFinances(fs=>fs.filter(f=>f.sourceId!==("serwis-"+machineId+"-"+entryId)));
      };

      const stCol=s=>s==="zaległy"?"#E05C5C":s==="wkrótce"?"#F4A261":s==="ok"?"#3DAA72":"#7A8FA6";
      const stLbl=s=>s==="zaległy"?"zaległy":s==="wkrótce"?"wkrótce":s==="ok"?"OK":"brak danych";

      const needSrv=(machines||[]).filter(m=>["zaległy","wkrótce"].includes(getStatus(m))).length;
      const occupied=(machines||[]).filter(m=>getMachineLoc(m)).length;
      const total=(machines||[]).length;
      const [toast,setToast]=useState(null);

      return <div style={{padding:"0 0 80px"}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:12}}>
          {[{l:"Maszyn",v:total,c:"#0A7C7C"},{l:"U klientów",v:occupied,c:"#2E86AB"},{l:"Serwis",v:needSrv,c:needSrv>0?"#E05C5C":"#3DAA72"}].map((x,i)=>(
            <div key={i} style={{background:x.c+"14",borderRadius:12,padding:"10px 8px",textAlign:"center",border:`1.5px solid ${x.c}30`}}>
              <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:22,color:x.c}}>{demo?"?":x.v}</div>
              <div style={{fontSize:10,color:subC,marginTop:2}}>{x.l}</div>
            </div>
          ))}
        </div>

        {total===0&&<Card style={{textAlign:"center",color:subC,padding:28}}>
          <div style={{fontSize:13,fontWeight:600,marginBottom:6}}>Brak maszyn</div>
          <div style={{fontSize:12}}>Dodaj swój sprzęt żeby śledzić serwisy i lokalizację</div>
        </Card>}

        {(machines||[]).map(m=>{
          const status=getStatus(m);
          const loc=getMachineLoc(m);
          const daysLeft=getDaysLeft(m);
          const isSel=selId===m.id;
          const sColor=stCol(status);
          const rentCount=rentalCountByType[m.type]||0;
          return <Card key={m.id} style={{marginBottom:8,padding:0,overflow:"hidden"}}>
            <div onClick={()=>setSelId(isSel?null:m.id)} style={{cursor:"pointer",padding:"12px 14px"}}>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <div style={{width:10,height:10,borderRadius:"50%",background:sColor,flexShrink:0,marginTop:2}}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:14,color:textC}}>{m.name||m.type}</div>
                  <div style={{fontSize:12,color:subC,marginTop:1}}>
                    {loc?<span style={{color:"#0A7C7C"}}>u {demo?"[klient]":loc.patientName} · zwrot {loc.endDate||"?"}</span>:<span>Wolny</span>}
                  </div>
                </div>
                <div style={{textAlign:"right",flexShrink:0}}>
                  <Badge color={sColor}>{stLbl(status)}</Badge>
                  <div style={{fontSize:10,color:subC,marginTop:3}}>{rentCount} wynaj.</div>
                </div>
              </div>
              {m.lastServiceDate&&<div style={{marginTop:8,fontSize:11,color:subC}}>
                Ostatni serwis: {m.lastServiceDate}
                {daysLeft!==null&&<span style={{marginLeft:6,color:daysLeft<0?"#E05C5C":daysLeft<30?"#F4A261":subC}}>
                  ({daysLeft<0?Math.abs(daysLeft)+" dni po terminie":daysLeft===0?"dziś":daysLeft+" dni do serwisu"})
                </span>}
              </div>}
            </div>

            {isSel&&<div style={{borderTop:`1px solid ${borderC}`,padding:"12px 14px",background:dk?"#0A1818":"#FAFCFC"}}>
              {(m.serialNo||m.purchaseDate||m.notes)&&<div style={{marginBottom:10}}>
                {m.serialNo&&<div style={{fontSize:12,color:subC,marginBottom:2}}>S/N: {m.serialNo}</div>}
                {m.purchaseDate&&<div style={{fontSize:12,color:subC,marginBottom:2}}>Zakup: {m.purchaseDate}</div>}
                {m.notes&&<div style={{fontSize:12,color:subC}}>{m.notes}</div>}
              </div>}

              <div style={{fontSize:11,fontWeight:700,color:subC,textTransform:"uppercase",letterSpacing:.5,marginBottom:8}}>Historia serwisów</div>
              {(m.serviceLog||[]).length===0
                ?<div style={{fontSize:12,color:subC,marginBottom:10}}>Brak wpisów</div>
                :(m.serviceLog||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)).map(s=>(
                  <div key={s.id} style={{background:bg,borderRadius:8,padding:"8px 10px",marginBottom:6,border:`1px solid ${borderC}`}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                      <div style={{fontSize:13,fontWeight:600,color:textC}}>{s.type}</div>
                      <div style={{display:"flex",alignItems:"center",gap:6}}>
                        <div style={{fontSize:11,color:subC}}>{s.date}</div>
                        <button onClick={e=>{e.stopPropagation();deleteSrvEntry(m.id,s.id);}} style={{background:"none",border:"none",color:"#E05C5C",fontSize:16,cursor:"pointer",padding:"2px 4px",lineHeight:1}}>×</button>
                      </div>
                    </div>
                    {s.notes&&<div style={{fontSize:12,color:subC,marginTop:2}}>{s.notes}</div>}
                    {+s.cost>0&&<div style={{fontSize:12,color:"#0A7C7C",marginTop:2}}>{s.cost} zł</div>}
                  </div>
              ))}

              <div style={{display:"flex",gap:8,marginTop:8}}>
                <Btn small onClick={()=>{setSrvForm(emptySrv());setShowAddSrv(m.id);}} style={{flex:1,justifyContent:"center"}}>+ Serwis</Btn>
                <Btn small variant="secondary" onClick={()=>{setEditId(m.id);setForm({type:m.type,name:m.name||"",serialNo:m.serialNo||"",purchaseDate:m.purchaseDate||"",lastServiceDate:m.lastServiceDate||"",servicePeriodDays:String(m.servicePeriodDays||365),notes:m.notes||""});}} style={{flex:1,justifyContent:"center"}}>Edytuj</Btn>
                <Btn small variant="danger" onClick={()=>setConfirmDel(m.id)} style={{justifyContent:"center"}}>Usuń</Btn>
              </div>
            </div>}
          </Card>;
        })}

        <Btn onClick={()=>{setForm(emptyMachine());setShowAdd(true);}} style={{width:"100%",justifyContent:"center",marginTop:4}}>+ Dodaj maszynę</Btn>

        {(showAdd||editId!==null)&&<Modal title={editId!==null?"Edytuj maszynę":"Nowa maszyna"} onClose={()=>{setShowAdd(false);setEditId(null);}}>
          <Sel label="Typ sprzętu" value={form.type} onChange={v=>setForm(f=>({...f,type:v}))} options={EQUIPMENT.map(e=>({value:e,label:e}))}/>
          <Inp label="Nazwa własna (np. CPM #1)" value={form.name} onChange={v=>setForm(f=>({...f,name:v}))} placeholder="CPM #1"/>
          <Inp label="Numer seryjny" value={form.serialNo} onChange={v=>setForm(f=>({...f,serialNo:v}))} placeholder="opcjonalnie"/>
          <Inp label="Data zakupu" value={form.purchaseDate} onChange={v=>setForm(f=>({...f,purchaseDate:v}))} type="date"/>
          <Inp label="Ostatni serwis" value={form.lastServiceDate} onChange={v=>setForm(f=>({...f,lastServiceDate:v}))} type="date"/>
          <Inp label="Serwis co ile dni" value={String(form.servicePeriodDays)} onChange={v=>setForm(f=>({...f,servicePeriodDays:v}))} type="number"/>
          <Txa label="Notatki" value={form.notes||""} onChange={v=>setForm(f=>({...f,notes:v}))} rows={2}/>
          <Btn onClick={()=>{
            if(editId!==null){
              setMachines(ms=>ms.map(m=>m.id===editId?{...m,...form,servicePeriodDays:+form.servicePeriodDays||365}:m));
              setEditId(null);
            } else {
              setMachines(ms=>[...(ms||[]),{...form,id:Date.now(),servicePeriodDays:+form.servicePeriodDays||365,serviceLog:[]}]);
              setShowAdd(false);
            }
            setToast("Zapisano");
          }} style={{width:"100%",justifyContent:"center"}}>Zapisz</Btn>
        </Modal>}

        {showAddSrv&&<Modal title="Wpis serwisowy" onClose={()=>setShowAddSrv(null)}>
          <Inp label="Data" value={srvForm.date} onChange={v=>setSrvForm(f=>({...f,date:v}))} type="date"/>
          <Sel label="Typ" value={srvForm.type} onChange={v=>setSrvForm(f=>({...f,type:v}))} options={["Przegląd","Naprawa","Wymiana części","Kalibracja","Czyszczenie","Inne"].map(x=>({value:x,label:x}))}/>
          <Txa label="Opis" value={srvForm.notes||""} onChange={v=>setSrvForm(f=>({...f,notes:v}))} rows={2}/>
          <Inp label="Koszt (zł)" value={srvForm.cost} onChange={v=>setSrvForm(f=>({...f,cost:v}))} type="number" placeholder="0"/>
          <Btn onClick={()=>{
            const entry={id:Date.now(),date:srvForm.date,type:srvForm.type,notes:srvForm.notes,cost:+srvForm.cost||0};
            const mach=(machines||[]).find(m=>m.id===showAddSrv);
            setMachines(ms=>ms.map(m=>m.id===showAddSrv?{...m,lastServiceDate:srvForm.date,serviceLog:[...(m.serviceLog||[]),entry]}:m));
            if(+srvForm.cost>0&&mach&&setFinances){
              setFinances(fs=>[{id:Date.now()+Math.random(),sourceId:"serwis-"+showAddSrv+"-"+entry.id,date:srvForm.date,type:"koszt",category:"Serwis",amount:+srvForm.cost,description:srvForm.type+(srvForm.notes?" – "+srvForm.notes:"")+" ("+(mach.name||mach.type)+")"},...(fs||[])]);
            }
            setShowAddSrv(null);
            setToast("Serwis dodany");
          }} style={{width:"100%",justifyContent:"center"}}>Zapisz</Btn>
        </Modal>}

        {confirmDel&&<Modal title="Usuń maszynę?" onClose={()=>setConfirmDel(null)}>
          <div style={{fontSize:14,color:subC,marginBottom:16}}>Usunięcie maszyny nie usuwa historii wypożyczeń.</div>
          <div style={{display:"flex",gap:10}}>
            <Btn variant="secondary" style={{flex:1,justifyContent:"center"}} onClick={()=>setConfirmDel(null)}>Anuluj</Btn>
            <Btn variant="danger" style={{flex:1,justifyContent:"center"}} onClick={()=>{setMachines(ms=>ms.filter(x=>x.id!==confirmDel));setSelId(null);setConfirmDel(null);}}>Usuń</Btn>
          </div>
        </Modal>}

        {toast&&<Toast msg={toast} onDone={()=>setToast(null)}/>}
      </div>;
    }

    // ── APP ───────────────────────────────────────────────────────────────────
    const TABS=[{id:"dashboard",i:I.home,l:"Pulpit"},{id:"patients",i:I.users,l:"Pacjenci"},{id:"rentals",i:I.equip,l:"Sprzęt"},{id:"nfz",i:"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z",l:"Wózki"},{id:"finances",i:I.fin,l:"Finanse"},{id:"serwis",i:I.wrench,l:"Serwis"},{id:"settings",i:"M12 15a3 3 0 100-6 3 3 0 000 6zM19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z",l:"Ustawienia"}];

    function useIsDesktop(){
      const [desk,setDesk]=React.useState(()=>window.innerWidth>=900);
      React.useEffect(()=>{const h=()=>setDesk(window.innerWidth>=900);window.addEventListener("resize",h);return()=>window.removeEventListener("resize",h);},[]);
      return desk;
    }

    function App({visits,setVisits,patients,setPatients,rentals,setRentals,finances,setFinances,stock,setStock,nfzCases,setNfzCases,todos,setTodos,events,setEvents,dark,setDark,settings,setSettings,exportData,importData,demo,setDemo,budget,setBudget,machines,setMachines}) {
      const [tab,setTab]=useState(()=>{const h=window.location.hash.replace("#","").split("-")[0];return["dashboard","patients","rentals","finances","nfz","serwis","settings"].includes(h)?h:"dashboard";});
      useEffect(()=>{if(tab!=="finances")window.location.replace("#"+tab);},[tab]);
      const [dlRental,setDlRental]=useState(null);
      const [dlReturnTab,setDlReturnTab]=useState("rentals");
      const [dlBackLabel,setDlBackLabel]=useState("Wypożyczalnia");
      const [wozkiSel,setWozkiSel]=useState(null);
      const [rentalsView,setRentalsView]=useState("aktywne");
      const goToRental=(id,returnTab="rentals")=>{setDlReturnTab(returnTab);setDlBackLabel(returnTab==="dashboard"?"Pulpit":"Wypożyczalnia");setDlRental(id);setTab("rentals");};
      const goToWozki=id=>{setWozkiSel(id);setTab("nfz");};
      const allClients=useMemo(()=>{
        const existing=new Set((patients||[]).map(p=>p.name));
        const extras=[];const seen=new Set();
        [...(rentals||[]),...(nfzCases||[])].forEach(item=>{
          const n=item.patientName;
          if(!n||existing.has(n)||seen.has(n))return;
          seen.add(n);
          extras.push({id:'ac-'+n,name:n,phone:item.phone||"",address:item.address||""});
        });
        return [...(patients||[]),...extras];
      },[patients,rentals,nfzCases]);
      const dk=dark;
      const desk=useIsDesktop();

      const [isSaving,setIsSaving]=useState(false);
      useEffect(()=>{
        const h=e=>setIsSaving(e.detail);
        window.addEventListener("fizjo-save",h);
        return()=>window.removeEventListener("fizjo-save",h);
      },[]);
      const [saveError,setSaveError]=useState(false);
      useEffect(()=>{
        const h=e=>setSaveError(e.detail);
        window.addEventListener("fizjo-save-error",h);
        return()=>window.removeEventListener("fizjo-save-error",h);
      },[]);

      const activeRentals=(rentals||[]).filter(r=>r.status==="aktywne").length;
      const todayVisits=(visits||[]).filter(v=>v.date===todayLocal()).length;
      const unpaidCount=(rentals||[]).filter(r=>r.status==="aktywne"&&r.renewable&&(r.cycles||[]).some(c=>!c.paid&&!c.cancelled)).length;

      const content = <>
        {tab==="dashboard"&&<Dashboard visits={visits} setVisits={setVisits} rentals={rentals} setRentals={setRentals} finances={finances} setFinances={setFinances} patients={patients} allClients={allClients} goToRental={id=>goToRental(id,"dashboard")} nfzCases={nfzCases} goToWozki={goToWozki} todos={todos} setTodos={setTodos} events={events} setEvents={setEvents}/>}
        {tab==="patients"&&<Patients patients={patients} setPatients={setPatients} visits={visits} setVisits={setVisits} finances={finances} setFinances={setFinances} rentals={rentals} setRentals={setRentals} nfzCases={nfzCases} allClients={allClients}/>}
        {tab==="rentals"&&<Rentals key={dlRental??0} rentals={rentals} setRentals={setRentals} finances={finances} setFinances={setFinances} patients={patients} setPatients={setPatients} allClients={allClients} initialDetail={dlRental} backLabel={dlBackLabel} onDetailClosed={()=>{setDlRental(null);setDlBackLabel("Wypożyczalnia");setDlReturnTab("rentals");setTab(dlReturnTab);}} rentalsView={rentalsView} setRentalsView={setRentalsView} stock={stock} setStock={setStock} settings={settings}/>}
        {tab==="finances"&&<Finances finances={finances} setFinances={setFinances} visits={visits} setVisits={setVisits} rentals={rentals} setRentals={setRentals} nfzCases={nfzCases} setNfzCases={setNfzCases} budget={budget} setBudget={setBudget} desk={desk} anthropicKey={settings.anthropicKey||""} stock={stock} setStock={setStock} machines={machines} setMachines={setMachines}/>}
        {tab==="nfz"&&<NFZ nfzCases={nfzCases} setNfzCases={setNfzCases} initialSel={wozkiSel} onSelCleared={()=>setWozkiSel(null)} setFinances={setFinances} patients={patients} setPatients={setPatients} allClients={allClients}/>}
