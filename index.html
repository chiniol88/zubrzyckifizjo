<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="theme-color" content="#0A7C7C"/>
  <title>ZubrzyckiFizjo</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap');
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;background:#F2F5F7;color:#1C2B3A;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
    input,select,textarea,button{font-family:'DM Sans',sans-serif;-webkit-tap-highlight-color:transparent}
    ::-webkit-scrollbar{display:none}*{scrollbar-width:none}
    .loader{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:16px;background:#F2F5F7}
    .spinner{width:40px;height:40px;border:3px solid #E4EAF0;border-top-color:#0A7C7C;border-radius:50%;animation:spin 0.8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="js/core.js"></script>
  <script type="text/babel" src="js/ui.js"></script>
  <script type="text/babel" src="js/dashboard.js"></script>
  <script type="text/babel" src="js/patients.js"></script>
  <script type="text/babel" src="js/rentals.js"></script>
  <script type="text/babel" src="js/finances.js"></script>
  <script type="text/babel" src="js/budget.js"></script>
  <script type="text/babel" src="js/nfz.js"></script>
  <script type="text/babel">




    // ── SERVICE ───────────────────────────────────────────────────────────────

    function Service({rentals,machines,setMachines,setFinances}) {
      const dk=useContext(DarkCtx);
      const demo=useDemo();
      const [selId,setSelId]=useState(null);
      const [showAdd,setShowAdd]=useState(false);
      const [showAddSrv,setShowAddSrv]=useState(null);
      const [editId,setEditId]=useState(null);
      const [confirmDel,setConfirmDel]=useState(null);
      const today=todayLocal();
      const bg=dk?"#0F1F1F":"#F7FAFA";
      const borderC=dk?"#1A3030":"#E4EAF0";
      const textC=dk?"#E8F5F5":"#1C2B3A";
      const subC=dk?"#5A8A8A":"#7A8FA6";

      const emptyMachine=()=>({type:EQUIPMENT[0],name:"",serialNo:"",purchaseDate:"",lastServiceDate:"",servicePeriodDays:365,notes:""});
      const emptySrv=()=>({date:today,type:"Przegląd",notes:"",cost:""});
      const [form,setForm]=useState(emptyMachine);
      const [srvForm,setSrvForm]=useState(emptySrv);

      const getStatus=m=>{
        if(!m.lastServiceDate)return "brak";
        const days=Math.round((new Date(today)-new Date(m.lastServiceDate))/86400000);
        const left=(+m.servicePeriodDays||365)-days;
        if(left<0)return "zaległy";
        if(left<30)return "wkrótce";
        return "ok";
      };
      const getDaysLeft=m=>{
        if(!m.lastServiceDate)return null;
        const days=Math.round((new Date(today)-new Date(m.lastServiceDate))/86400000);
        return (+m.servicePeriodDays||365)-days;
      };

      const activeByType=useMemo(()=>{
        const map={};
        (rentals||[]).filter(r=>r.status!=="zakończone"&&(!r.endDate||r.endDate>=today)).forEach(r=>{
          if(!r.equipment)return;
          if(!map[r.equipment])map[r.equipment]=[];
          map[r.equipment].push(r);
        });
        return map;
      },[rentals,today]);

      const rentalCountByType=useMemo(()=>{
        const map={};
        (rentals||[]).forEach(r=>{if(r.equipment)map[r.equipment]=(map[r.equipment]||0)+1;});
        return map;
      },[rentals]);

      const getMachineLoc=m=>{
        const sameType=(machines||[]).filter(x=>x.type===m.type);
        const idx=sameType.findIndex(x=>x.id===m.id);
        const active=[...(activeByType[m.type]||[])].sort((a,b)=>(a.startDate||"").localeCompare(b.startDate||""));
        return active[idx]||null;
      };

      const deleteSrvEntry=(machineId,entryId)=>{
        setMachines(ms=>ms.map(m=>{
          if(m.id!==machineId)return m;
          const log=(m.serviceLog||[]).filter(s=>s.id!==entryId);
          const lastServiceDate=log.length>0?log.reduce((a,b)=>(a.date>b.date?a:b)).date:null;
          return{...m,serviceLog:log,lastServiceDate};
        }));
        setFinances(fs=>fs.filter(f=>f.sourceId!==("serwis-"+machineId+"-"+entryId)));
      };

      const stCol=s=>s==="zaległy"?"#E05C5C":s==="wkrótce"?"#F4A261":s==="ok"?"#3DAA72":"#7A8FA6";
      const stLbl=s=>s==="zaległy"?"zaległy":s==="wkrótce"?"wkrótce":s==="ok"?"OK":"brak danych";

      const needSrv=(machines||[]).filter(m=>["zaległy","wkrótce"].includes(getStatus(m))).length;
      const occupied=(machines||[]).filter(m=>getMachineLoc(m)).length;
      const total=(machines||[]).length;
      const [toast,setToast]=useState(null);

      return <div style={{padding:"0 0 80px"}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:12}}>
          {[{l:"Maszyn",v:total,c:"#0A7C7C"},{l:"U klientów",v:occupied,c:"#2E86AB"},{l:"Serwis",v:needSrv,c:needSrv>0?"#E05C5C":"#3DAA72"}].map((x,i)=>(
            <div key={i} style={{background:x.c+"14",borderRadius:12,padding:"10px 8px",textAlign:"center",border:`1.5px solid ${x.c}30`}}>
              <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:22,color:x.c}}>{demo?"?":x.v}</div>
              <div style={{fontSize:10,color:subC,marginTop:2}}>{x.l}</div>
            </div>
          ))}
        </div>

        {total===0&&<Card style={{textAlign:"center",color:subC,padding:28}}>
          <div style={{fontSize:13,fontWeight:600,marginBottom:6}}>Brak maszyn</div>
          <div style={{fontSize:12}}>Dodaj swój sprzęt żeby śledzić serwisy i lokalizację</div>
        </Card>}

        {(machines||[]).map(m=>{
          const status=getStatus(m);
          const loc=getMachineLoc(m);
          const daysLeft=getDaysLeft(m);
          const isSel=selId===m.id;
          const sColor=stCol(status);
          const rentCount=rentalCountByType[m.type]||0;
          return <Card key={m.id} style={{marginBottom:8,padding:0,overflow:"hidden"}}>
            <div onClick={()=>setSelId(isSel?null:m.id)} style={{cursor:"pointer",padding:"12px 14px"}}>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <div style={{width:10,height:10,borderRadius:"50%",background:sColor,flexShrink:0,marginTop:2}}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:14,color:textC}}>{m.name||m.type}</div>
                  <div style={{fontSize:12,color:subC,marginTop:1}}>
                    {loc?<span style={{color:"#0A7C7C"}}>u {demo?"[klient]":loc.patientName} · zwrot {loc.endDate||"?"}</span>:<span>Wolny</span>}
                  </div>
                </div>
                <div style={{textAlign:"right",flexShrink:0}}>
                  <Badge color={sColor}>{stLbl(status)}</Badge>
                  <div style={{fontSize:10,color:subC,marginTop:3}}>{rentCount} wynaj.</div>
                </div>
              </div>
              {m.lastServiceDate&&<div style={{marginTop:8,fontSize:11,color:subC}}>
                Ostatni serwis: {m.lastServiceDate}
                {daysLeft!==null&&<span style={{marginLeft:6,color:daysLeft<0?"#E05C5C":daysLeft<30?"#F4A261":subC}}>
                  ({daysLeft<0?Math.abs(daysLeft)+" dni po terminie":daysLeft===0?"dziś":daysLeft+" dni do serwisu"})
                </span>}
              </div>}
            </div>

            {isSel&&<div style={{borderTop:`1px solid ${borderC}`,padding:"12px 14px",background:dk?"#0A1818":"#FAFCFC"}}>
              {(m.serialNo||m.purchaseDate||m.notes)&&<div style={{marginBottom:10}}>
                {m.serialNo&&<div style={{fontSize:12,color:subC,marginBottom:2}}>S/N: {m.serialNo}</div>}
                {m.purchaseDate&&<div style={{fontSize:12,color:subC,marginBottom:2}}>Zakup: {m.purchaseDate}</div>}
                {m.notes&&<div style={{fontSize:12,color:subC}}>{m.notes}</div>}
              </div>}

              <div style={{fontSize:11,fontWeight:700,color:subC,textTransform:"uppercase",letterSpacing:.5,marginBottom:8}}>Historia serwisów</div>
              {(m.serviceLog||[]).length===0
                ?<div style={{fontSize:12,color:subC,marginBottom:10}}>Brak wpisów</div>
                :(m.serviceLog||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)).map(s=>(
                  <div key={s.id} style={{background:bg,borderRadius:8,padding:"8px 10px",marginBottom:6,border:`1px solid ${borderC}`}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                      <div style={{fontSize:13,fontWeight:600,color:textC}}>{s.type}</div>
                      <div style={{display:"flex",alignItems:"center",gap:6}}>
                        <div style={{fontSize:11,color:subC}}>{s.date}</div>
                        <button onClick={e=>{e.stopPropagation();deleteSrvEntry(m.id,s.id);}} style={{background:"none",border:"none",color:"#E05C5C",fontSize:16,cursor:"pointer",padding:"2px 4px",lineHeight:1}}>×</button>
                      </div>
                    </div>
                    {s.notes&&<div style={{fontSize:12,color:subC,marginTop:2}}>{s.notes}</div>}
                    {+s.cost>0&&<div style={{fontSize:12,color:"#0A7C7C",marginTop:2}}>{s.cost} zł</div>}
                  </div>
              ))}

              <div style={{display:"flex",gap:8,marginTop:8}}>
                <Btn small onClick={()=>{setSrvForm(emptySrv());setShowAddSrv(m.id);}} style={{flex:1,justifyContent:"center"}}>+ Serwis</Btn>
                <Btn small variant="secondary" onClick={()=>{setEditId(m.id);setForm({type:m.type,name:m.name||"",serialNo:m.serialNo||"",purchaseDate:m.purchaseDate||"",lastServiceDate:m.lastServiceDate||"",servicePeriodDays:String(m.servicePeriodDays||365),notes:m.notes||""});}} style={{flex:1,justifyContent:"center"}}>Edytuj</Btn>
                <Btn small variant="danger" onClick={()=>setConfirmDel(m.id)} style={{justifyContent:"center"}}>Usuń</Btn>
              </div>
            </div>}
          </Card>;
        })}

        <Btn onClick={()=>{setForm(emptyMachine());setShowAdd(true);}} style={{width:"100%",justifyContent:"center",marginTop:4}}>+ Dodaj maszynę</Btn>

        {(showAdd||editId!==null)&&<Modal title={editId!==null?"Edytuj maszynę":"Nowa maszyna"} onClose={()=>{setShowAdd(false);setEditId(null);}}>
          <Sel label="Typ sprzętu" value={form.type} onChange={v=>setForm(f=>({...f,type:v}))} options={EQUIPMENT.map(e=>({value:e,label:e}))}/>
          <Inp label="Nazwa własna (np. CPM #1)" value={form.name} onChange={v=>setForm(f=>({...f,name:v}))} placeholder="CPM #1"/>
          <Inp label="Numer seryjny" value={form.serialNo} onChange={v=>setForm(f=>({...f,serialNo:v}))} placeholder="opcjonalnie"/>
          <Inp label="Data zakupu" value={form.purchaseDate} onChange={v=>setForm(f=>({...f,purchaseDate:v}))} type="date"/>
          <Inp label="Ostatni serwis" value={form.lastServiceDate} onChange={v=>setForm(f=>({...f,lastServiceDate:v}))} type="date"/>
          <Inp label="Serwis co ile dni" value={String(form.servicePeriodDays)} onChange={v=>setForm(f=>({...f,servicePeriodDays:v}))} type="number"/>
          <Txa label="Notatki" value={form.notes||""} onChange={v=>setForm(f=>({...f,notes:v}))} rows={2}/>
          <Btn onClick={()=>{
            if(editId!==null){
              setMachines(ms=>ms.map(m=>m.id===editId?{...m,...form,servicePeriodDays:+form.servicePeriodDays||365}:m));
              setEditId(null);
            } else {
              setMachines(ms=>[...(ms||[]),{...form,id:Date.now(),servicePeriodDays:+form.servicePeriodDays||365,serviceLog:[]}]);
              setShowAdd(false);
            }
            setToast("Zapisano");
          }} style={{width:"100%",justifyContent:"center"}}>Zapisz</Btn>
        </Modal>}

        {showAddSrv&&<Modal title="Wpis serwisowy" onClose={()=>setShowAddSrv(null)}>
          <Inp label="Data" value={srvForm.date} onChange={v=>setSrvForm(f=>({...f,date:v}))} type="date"/>
          <Sel label="Typ" value={srvForm.type} onChange={v=>setSrvForm(f=>({...f,type:v}))} options={["Przegląd","Naprawa","Wymiana części","Kalibracja","Czyszczenie","Inne"].map(x=>({value:x,label:x}))}/>
          <Txa label="Opis" value={srvForm.notes||""} onChange={v=>setSrvForm(f=>({...f,notes:v}))} rows={2}/>
          <Inp label="Koszt (zł)" value={srvForm.cost} onChange={v=>setSrvForm(f=>({...f,cost:v}))} type="number" placeholder="0"/>
          <Btn onClick={()=>{
            const entry={id:Date.now(),date:srvForm.date,type:srvForm.type,notes:srvForm.notes,cost:+srvForm.cost||0};
            const mach=(machines||[]).find(m=>m.id===showAddSrv);
            setMachines(ms=>ms.map(m=>m.id===showAddSrv?{...m,lastServiceDate:srvForm.date,serviceLog:[...(m.serviceLog||[]),entry]}:m));
            if(+srvForm.cost>0&&mach&&setFinances){
              setFinances(fs=>[{id:Date.now()+Math.random(),sourceId:"serwis-"+showAddSrv+"-"+entry.id,date:srvForm.date,type:"koszt",category:"Serwis",amount:+srvForm.cost,description:srvForm.type+(srvForm.notes?" – "+srvForm.notes:"")+" ("+(mach.name||mach.type)+")"},...(fs||[])]);
            }
            setShowAddSrv(null);
            setToast("Serwis dodany");
          }} style={{width:"100%",justifyContent:"center"}}>Zapisz</Btn>
        </Modal>}

        {confirmDel&&<Modal title="Usuń maszynę?" onClose={()=>setConfirmDel(null)}>
          <div style={{fontSize:14,color:subC,marginBottom:16}}>Usunięcie maszyny nie usuwa historii wypożyczeń.</div>
          <div style={{display:"flex",gap:10}}>
            <Btn variant="secondary" style={{flex:1,justifyContent:"center"}} onClick={()=>setConfirmDel(null)}>Anuluj</Btn>
            <Btn variant="danger" style={{flex:1,justifyContent:"center"}} onClick={()=>{setMachines(ms=>ms.filter(x=>x.id!==confirmDel));setSelId(null);setConfirmDel(null);}}>Usuń</Btn>
          </div>
        </Modal>}

        {toast&&<Toast msg={toast} onDone={()=>setToast(null)}/>}
      </div>;
    }

    // ── APP ───────────────────────────────────────────────────────────────────
    const TABS=[{id:"dashboard",i:I.home,l:"Pulpit"},{id:"patients",i:I.users,l:"Pacjenci"},{id:"rentals",i:I.equip,l:"Sprzęt"},{id:"nfz",i:"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z",l:"Wózki"},{id:"finances",i:I.fin,l:"Finanse"},{id:"serwis",i:I.wrench,l:"Serwis"},{id:"settings",i:"M12 15a3 3 0 100-6 3 3 0 000 6zM19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z",l:"Ustawienia"}];

    function useIsDesktop(){
      const [desk,setDesk]=React.useState(()=>window.innerWidth>=900);
      React.useEffect(()=>{const h=()=>setDesk(window.innerWidth>=900);window.addEventListener("resize",h);return()=>window.removeEventListener("resize",h);},[]);
      return desk;
    }

    function App({visits,setVisits,patients,setPatients,rentals,setRentals,finances,setFinances,stock,setStock,nfzCases,setNfzCases,todos,setTodos,events,setEvents,dark,setDark,settings,setSettings,exportData,importData,demo,setDemo,budget,setBudget,machines,setMachines}) {
      const [tab,setTab]=useState(()=>{const h=window.location.hash.replace("#","").split("-")[0];return["dashboard","patients","rentals","finances","nfz","serwis","settings"].includes(h)?h:"dashboard";});
      useEffect(()=>{if(tab!=="finances")window.location.replace("#"+tab);},[tab]);
      const [dlRental,setDlRental]=useState(null);
      const [dlReturnTab,setDlReturnTab]=useState("rentals");
      const [dlBackLabel,setDlBackLabel]=useState("Wypożyczalnia");
      const [wozkiSel,setWozkiSel]=useState(null);
      const [rentalsView,setRentalsView]=useState("aktywne");
      const goToRental=(id,returnTab="rentals")=>{setDlReturnTab(returnTab);setDlBackLabel(returnTab==="dashboard"?"Pulpit":"Wypożyczalnia");setDlRental(id);setTab("rentals");};
      const goToWozki=id=>{setWozkiSel(id);setTab("nfz");};
      const allClients=useMemo(()=>{
        const existing=new Set((patients||[]).map(p=>p.name));
        const extras=[];const seen=new Set();
        [...(rentals||[]),...(nfzCases||[])].forEach(item=>{
          const n=item.patientName;
          if(!n||existing.has(n)||seen.has(n))return;
          seen.add(n);
          extras.push({id:'ac-'+n,name:n,phone:item.phone||"",address:item.address||""});
        });
        return [...(patients||[]),...extras];
      },[patients,rentals,nfzCases]);
      const dk=dark;
      const desk=useIsDesktop();

      const [isSaving,setIsSaving]=useState(false);
      useEffect(()=>{
        const h=e=>setIsSaving(e.detail);
        window.addEventListener("fizjo-save",h);
        return()=>window.removeEventListener("fizjo-save",h);
      },[]);
      const [saveError,setSaveError]=useState(false);
      useEffect(()=>{
        const h=e=>setSaveError(e.detail);
        window.addEventListener("fizjo-save-error",h);
        return()=>window.removeEventListener("fizjo-save-error",h);
      },[]);

      const activeRentals=(rentals||[]).filter(r=>r.status==="aktywne").length;
      const todayVisits=(visits||[]).filter(v=>v.date===todayLocal()).length;
      const unpaidCount=(rentals||[]).filter(r=>r.status==="aktywne"&&r.renewable&&(r.cycles||[]).some(c=>!c.paid&&!c.cancelled)).length;

      const content = <>
        {tab==="dashboard"&&<Dashboard visits={visits} setVisits={setVisits} rentals={rentals} setRentals={setRentals} finances={finances} setFinances={setFinances} patients={patients} allClients={allClients} goToRental={id=>goToRental(id,"dashboard")} nfzCases={nfzCases} goToWozki={goToWozki} todos={todos} setTodos={setTodos} events={events} setEvents={setEvents}/>}
        {tab==="patients"&&<Patients patients={patients} setPatients={setPatients} visits={visits} setVisits={setVisits} finances={finances} setFinances={setFinances} rentals={rentals} setRentals={setRentals} nfzCases={nfzCases} allClients={allClients}/>}
        {tab==="rentals"&&<Rentals key={dlRental??0} rentals={rentals} setRentals={setRentals} finances={finances} setFinances={setFinances} patients={patients} setPatients={setPatients} allClients={allClients} initialDetail={dlRental} backLabel={dlBackLabel} onDetailClosed={()=>{setDlRental(null);setDlBackLabel("Wypożyczalnia");setDlReturnTab("rentals");setTab(dlReturnTab);}} rentalsView={rentalsView} setRentalsView={setRentalsView} stock={stock} setStock={setStock} settings={settings}/>}
        {tab==="finances"&&<Finances finances={finances} setFinances={setFinances} visits={visits} setVisits={setVisits} rentals={rentals} setRentals={setRentals} nfzCases={nfzCases} setNfzCases={setNfzCases} budget={budget} setBudget={setBudget} desk={desk} anthropicKey={settings.anthropicKey||""} stock={stock} setStock={setStock} machines={machines} setMachines={setMachines}/>}
        {tab==="nfz"&&<NFZ nfzCases={nfzCases} setNfzCases={setNfzCases} initialSel={wozkiSel} onSelCleared={()=>setWozkiSel(null)} setFinances={setFinances} patients={patients} setPatients={setPatients} allClients={allClients}/>}
        {tab==="serwis"&&<Service rentals={rentals} machines={machines} setMachines={setMachines} setFinances={setFinances}/>}
        {tab==="settings"&&<Settings dark={dark} setDark={setDark} settings={settings} setSettings={setSettings} exportData={exportData} importData={importData} demo={demo} setDemo={setDemo} setRentals={setRentals} setFinances={setFinances}/>}
      </>;

      if(desk) {
        const sb=dk?"#0A1818":"#0F2A2A";
        const sbHov=dk?"#1A3030":"#163333";
        const sbAct="#0A7C7C";
        return <div style={{display:"flex",minHeight:"100vh",background:dk?"#0A1A1A":"#EAEFF4",color:dk?"#E8F5F5":"#1C2B3A"}}>
          {(isSaving||saveError)&&<div style={{position:"fixed",bottom:16,right:16,zIndex:200,background:saveError?"#E05C5C":"#0A7C7C",color:"#fff",borderRadius:10,padding:"8px 14px",fontSize:12,fontWeight:600,display:"flex",alignItems:"center",gap:6,boxShadow:"0 4px 16px rgba(0,0,0,.18)"}}>
            <div style={{width:7,height:7,borderRadius:"50%",background:"#fff",opacity:.85,animation:saveError?"none":"spin .8s linear infinite"}}/>
            {saveError?"⚠ Brak połączenia — próbuję dalej zapisać":"Zapisywanie…"}
          </div>}
          {/* Sidebar */}
          <div style={{width:230,flexShrink:0,background:sb,display:"flex",flexDirection:"column",position:"fixed",top:0,left:0,height:"100vh",zIndex:100,boxShadow:"4px 0 24px rgba(0,0,0,.18)",overflow:"hidden"}}>

    function AppWithSync({visits,setVisits,patients,setPatients,rentals,setRentals,finances,setFinances,stock,setStock,nfzCases,setNfzCases,todos,setTodos,events,setEvents,dark,setDark,settings,setSettings,exportData,importData,demo,setDemo,budget,setBudget,machines,setMachines,rentalsLoaded,financesLoaded}) {
      // Auto-generate next cycle 30 days after the previous one (or on startDate for new rentals)
      useEffect(()=>{
        if(!rentals)return;
        const today=todayLocal();
        const currMonthStart=today.slice(0,7)+"-01";
        const needsUpdate=rentals.some(r=>{
          if(r.status!=="aktywne"||!r.renewable)return false;
          const cyc=r.cycles||[];
          if(cyc.length===0){
            if(r.startDate<currMonthStart)return false; // HistoryFill handles old rentals
            return r.startDate<=today;
          }
          const last=[...cyc].sort((a,b)=>(b.dueDate||b.month+"-01").localeCompare(a.dueDate||a.month+"-01"))[0];
          return addDays(last.dueDate||last.month+"-01",30)<=today;
        });
        if(!needsUpdate)return;
        setRentals(rs=>rs.map(r=>{
          if(r.status!=="aktywne"||!r.renewable)return r;
          let cyc=[...(r.cycles||[])];
          if(cyc.length===0){
            if(r.startDate<currMonthStart||r.startDate>today)return r;
            cyc=[{dueDate:r.startDate,month:r.startDate.slice(0,7),amount:+(r.amount||0),paid:false,paidDate:null}];
          }
          let last=[...cyc].sort((a,b)=>(b.dueDate||b.month+"-01").localeCompare(a.dueDate||a.month+"-01"))[0];
          let nd=addDays(last.dueDate||last.month+"-01",30);
          while(nd<=today){
            if(cyc.some(c=>(c.dueDate||c.month+"-01")===nd))break;
            cyc=[...cyc,{dueDate:nd,month:nd.slice(0,7),amount:last.amount,paid:false,paidDate:null}];
            last=cyc[cyc.length-1];nd=addDays(nd,30);
          }
          return cyc.length===(r.cycles||[]).length?r:{...r,cycles:cyc};
        }));
      },[]);
      useEffect(()=>{
        if(!rentalsLoaded||!financesLoaded||!visits||!rentals||!finances)return;
        const now=new Date(),ex=new Set(finances.map(f=>f.sourceId).filter(Boolean)),toAdd=[];
        visits.forEach(v=>{
          const sid="visit-"+v.id; if(ex.has(sid))return;
          const done=v.status==="zakończona"||new Date(v.date+"T"+(v.time||"00:00")+":00")<=now;
          if(done)toAdd.push({id:Date.now()+Math.random(),sourceId:sid,date:v.date,type:"przychód",category:"Wizyta",amount:v.price||0,description:"Wizyta – "+v.patientName});
        });
        rentals.forEach(r=>(r.payments||[]).forEach(p=>{
          const sid="payment-"+p.id; if(ex.has(sid))return;
          toAdd.push({id:Date.now()+Math.random(),sourceId:sid,date:p.date,type:"przychód",category:"Wypożyczalnia",amount:p.amount,description:"Wypożyczenie – "+r.patientName+" ("+(r.equipment||"Do ustalenia")+")"});
        }));
        rentals.forEach(r=>(r.cycles||[]).filter(c=>c.paid&&!c.cancelled).forEach(c=>{
          const sid="cycle-"+r.id+"-"+(c.dueDate||c.month); if(ex.has(sid))return;
          const dueDt=c.dueDate||c.month+"-15";
          const label=new Date(dueDt+"T12:00:00").toLocaleDateString("pl-PL",{day:"numeric",month:"long",year:"numeric"});
          toAdd.push({id:Date.now()+Math.random(),sourceId:sid,date:c.paidDate||dueDt,type:"przychód",category:"Wypożyczalnia",amount:c.amount,description:"Wypożyczenie – "+r.patientName+" ("+(r.equipment||"Do ustalenia")+") "+label});
        }));
        if(toAdd.length)setFinances(prev=>[...toAdd,...prev]);
      },[visits,rentals,rentalsLoaded,financesLoaded]);
      return <App visits={visits} setVisits={setVisits} patients={patients} setPatients={setPatients} rentals={rentals} setRentals={setRentals} finances={finances} setFinances={setFinances} stock={stock} setStock={setStock} nfzCases={nfzCases} setNfzCases={setNfzCases} todos={todos} setTodos={setTodos} events={events} setEvents={setEvents} dark={dark} setDark={setDark} settings={settings} setSettings={setSettings} exportData={exportData} importData={importData} demo={demo} setDemo={setDemo} budget={budget} setBudget={setBudget} machines={machines} setMachines={setMachines}/>;
    }


    function SocialLinks({settings,setSettings,dk,txt,sub,border}) {

      const upd=(id,field,val)=>setLinks(ls=>ls.map(l=>l.id===id?{...l,[field]:val}:l));
      const blur=(newLinks)=>saveToSettings(newLinks);
      const del=(id)=>{const newLinks=links.filter(l=>l.id!==id);setLinks(newLinks);saveToSettings(newLinks);};
      const inp=(extra={})=>({padding:"9px 12px",borderRadius:10,border:`1.5px solid ${border}`,background:dk?"#0F1F1F":"#FAFCFD",color:dk?"#E8F5F5":"#1C2B3A",fontSize:13,fontFamily:"inherit",outline:"none",...extra});
      return <div style={{paddingTop:8,paddingBottom:4}}>

          <span style={{fontSize:13,color:sub,minWidth:20,textAlign:"right"}}>{i+1}.</span>
          <input value={l.name} onChange={e=>upd(l.id,"name",e.target.value)} onBlur={()=>blur(links.map(x=>x.id===l.id?{...x,name:x.name}:x))} placeholder="Nazwa (np. Facebook)" style={{...inp(),flex:"0 0 120px"}}/>
          <input value={l.url} onChange={e=>upd(l.id,"url",e.target.value)} onBlur={()=>blur(links.map(x=>x.id===l.id?{...x,url:x.url}:x))} placeholder="https://..." style={{...inp(),flex:1,minWidth:0}}/>
          {l.url&&<a href={l.url} target="_blank" rel="noreferrer" style={{fontSize:18,textDecoration:"none"}}>🔗</a>}
          <button onClick={()=>del(l.id)} style={{background:"none",border:"none",cursor:"pointer",fontSize:18,color:"#E05C5C",padding:"0 2px",flexShrink:0}}>×</button>
        </div>)}
        <button onClick={add} style={{background:dk?"#1E3A3A":"#F2F5F7",border:"none",borderRadius:10,padding:"9px 16px",fontSize:13,fontWeight:600,color:"#0A7C7C",cursor:"pointer",fontFamily:"inherit",width:"100%",textAlign:"left"}}>+ Dodaj kolejny</button>
      </div>;
    }

    function ImportCSV({setRentals,setFinances,dk,txt,sub}) {
      const [csv,setCsv]=useState("");
      const [parsed,setParsed]=useState(null);
      const [done,setDone]=useState(false);

      const parseDate=s=>{
        if(!s||!s.trim())return"";
        s=s.trim();
        if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
        const m=s.match(/^(\d{1,2})[.\-\/](\d{1,2})[.\-\/](\d{4})$/);
        if(m)return`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
        return s;
      };

      const parseNum=s=>{
        if(!s||!String(s).trim())return 0;
        return parseFloat(String(s).trim().replace(",","."))||0;
      };

      const parseRows=()=>{
        const lines=csv.trim().split("\n").filter(l=>l.trim());
        const rows=[];
        for(const line of lines){
          const sep=line.includes("\t")?"\t":line.includes(";")?";":","
          const cols=line.split(sep).map(c=>c.trim().replace(/^"|"$/g,""));
          if(!cols[0]&&!cols[2])continue;
          rows.push({
            patientName:cols[0]||"",
            phone:cols[1]||"",
            equipment:cols[2]||"",
            startDate:parseDate(cols[3]),
            endDate:parseDate(cols[4]||""),
            amount:parseNum(cols[5]),
            amountPaid:parseNum(cols[6]),
            notes:cols[7]||""
          });
        }
        setParsed(rows);
        setDone(false);
      };

      const doImport=()=>{
        const now=Date.now();
        const today=todayLocal();
        const newRentals=parsed.map((r,i)=>{
          const pid=now+i;
          const isFinished=r.endDate&&r.endDate<today;
          const payId=now+10000+i;
          const payments=r.amountPaid>0?[{id:payId,amount:r.amountPaid,date:r.endDate||r.startDate||today}]:[];
          return{
            id:pid,status:isFinished?"zakończone":"aktywne",
            equipment:r.equipment,patientName:r.patientName,phone:r.phone,
            address:"",startDate:r.startDate,startAllDay:true,endDate:r.endDate,endAllDay:true,
            renewable:false,amount:r.amount||"",amountPaid:r.amountPaid||0,
            payments,transport:"",notes:r.notes,source:"import"
          };
        });
        const newFinances=[];
        parsed.forEach((r,i)=>{
          if(r.amountPaid>0){
            const payId=now+10000+i;
            newFinances.push({
              id:now+20000+i,sourceId:"payment-"+payId,
              date:r.endDate||r.startDate||today,
              type:"przychód",category:"Wypożyczalnia",amount:r.amountPaid,
              description:"Wypożyczenie – "+r.patientName+(r.equipment?" ("+r.equipment+")":"")
            });
          }
        });
        setRentals(rs=>[...newRentals,...(rs||[])]);
        if(newFinances.length>0)setFinances(fs=>[...newFinances,...(fs||[])]);
        setDone(true);setCsv("");setParsed(null);
      };

      const rowCount=csv.trim()?csv.trim().split("\n").filter(l=>l.trim()).length:0;
      return <div style={{padding:"12px 0"}}>
        <div style={{fontSize:12,color:sub,marginBottom:8,lineHeight:1.6}}>
          Wklej dane z Excela lub Google Sheets (Tab lub średnik jako separator):<br/>
          <b style={{color:txt}}>Kolumny:</b> pacjent · telefon · sprzęt · data_od · data_do · kwota · zapłacono · notatki
        </div>
        {done&&<div style={{fontSize:13,color:"#3DAA72",marginBottom:8,fontWeight:600}}>✓ Import zakończony pomyślnie!</div>}
        <textarea value={csv} onChange={e=>{setCsv(e.target.value);setParsed(null);setDone(false);}} rows={6}
          placeholder={"Jan Kowalski\t600123456\tCPM Artromot K1\t01.03.2024\t14.03.2024\t420\t420"}
          style={{width:"100%",padding:"10px 12px",borderRadius:10,border:`1.5px solid ${dk?"#2A4040":"#E4EAF0"}`,background:dk?"#0F1F1F":"#FAFCFD",color:dk?"#E8F5F5":"#1C2B3A",fontSize:13,fontFamily:"inherit",boxSizing:"border-box",resize:"vertical"}}
        />
        <div style={{display:"flex",gap:8,marginTop:8}}>
          <button onClick={parseRows} disabled={!csv.trim()} style={{flex:1,padding:"9px",borderRadius:10,background:"#E6F4F4",border:"none",fontWeight:700,fontSize:13,color:"#0A7C7C",cursor:csv.trim()?"pointer":"default",fontFamily:"inherit"}}>
            Podgląd ({rowCount} {rowCount===1?"wiersz":rowCount<5?"wiersze":"wierszy"})
          </button>
          {parsed&&parsed.length>0&&<button onClick={doImport} style={{flex:1,padding:"9px",borderRadius:10,background:"#0A7C7C",border:"none",fontWeight:700,fontSize:13,color:"#fff",cursor:"pointer",fontFamily:"inherit"}}>
            Importuj {parsed.length} →
          </button>}
        </div>
        {parsed&&parsed.length>0&&<div style={{marginTop:12,overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
            <thead><tr>{["Pacjent","Sprzęt","Od","Do","Kwota","Zapłacono"].map(h=><th key={h} style={{textAlign:"left",padding:"4px 6px",color:sub,fontWeight:700,borderBottom:`1px solid ${dk?"#2A4040":"#E4EAF0"}`}}>{h}</th>)}</tr></thead>
            <tbody>
              {parsed.slice(0,6).map((r,i)=><tr key={i}>
                <td style={{padding:"4px 6px",color:txt}}>{r.patientName||"—"}</td>
                <td style={{padding:"4px 6px",color:txt}}>{r.equipment||"—"}</td>
                <td style={{padding:"4px 6px",color:txt}}>{r.startDate||"—"}</td>
                <td style={{padding:"4px 6px",color:txt}}>{r.endDate||"—"}</td>
                <td style={{padding:"4px 6px",color:txt}}>{r.amount||"—"}</td>
                <td style={{padding:"4px 6px",color:txt}}>{r.amountPaid||"—"}</td>
              </tr>)}
              {parsed.length>6&&<tr><td colSpan={6} style={{padding:"4px 6px",color:sub,fontStyle:"italic"}}>...i {parsed.length-6} więcej</td></tr>}
            </tbody>
          </table>
        </div>}
      </div>;
    }

    function PasswordResetScreen() {
      const dk=useContext(DarkCtx);
      const [pwd,setPwd]=React.useState("");
      const [pwd2,setPwd2]=React.useState("");
      const [status,setStatus]=React.useState(null);
      const [error,setError]=React.useState("");
      const handleSave=async()=>{
        if(pwd.length<6){setError("Hasło musi mieć min. 6 znaków");return;}
        if(pwd!==pwd2){setError("Hasła nie są identyczne");return;}
        setStatus("saving");setError("");
        try{
          const r=await fetch(`${SUPA_URL}/auth/v1/user`,{
            method:"PUT",
            headers:{"Content-Type":"application/json","apikey":SUPA_ANON,"Authorization":`Bearer ${_supaToken}`},
            body:JSON.stringify({password:pwd})
          });
          if(r.ok){setStatus("done");}
          else{const d=await r.json();setError(d.message||"Błąd");setStatus(null);}
        }catch{setError("Błąd połączenia");setStatus(null);}
      };
      const inputStyle={width:"100%",padding:"13px 16px",borderRadius:12,border:`1.5px solid ${error?"#E05C5C":dk?"#2A4040":"#E4EAF0"}`,background:dk?"#0F1F1F":"#FAFCFD",color:dk?"#E8F5F5":"#1C2B3A",fontSize:16,fontFamily:"inherit",boxSizing:"border-box",marginBottom:10};
      return <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",background:dk?"#0A1A1A":"#F2F5F7",padding:24}}>
        <div style={{fontFamily:"'Syne',sans-serif",fontSize:28,fontWeight:800,color:"#0A7C7C",marginBottom:8}}>ZubrzyckiFizjo</div>
        <div style={{fontSize:14,color:"#7A8FA6",marginBottom:32}}>Ustaw nowe hasło</div>
        <div style={{background:dk?"#1A2A2A":"#fff",borderRadius:16,padding:24,width:"100%",maxWidth:320,boxShadow:"0 4px 20px rgba(0,0,0,.1)"}}>
          {status==="done"
            ? <div style={{textAlign:"center"}}>
                <div style={{fontSize:40,marginBottom:12}}>✅</div>
                <div style={{fontWeight:700,fontSize:16,color:dk?"#E8F5F5":"#1C2B3A",marginBottom:8}}>Hasło zmienione!</div>
                <button onClick={()=>{_supaToken=null;sessionStorage.removeItem("fizjo-token");sessionStorage.removeItem("fizjo-refresh");window.location.href=window.location.pathname;}} style={{width:"100%",padding:"13px",borderRadius:12,background:"#0A7C7C",color:"#fff",border:"none",fontSize:16,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>Zaloguj się</button>
              </div>
            : <>
                <input type="password" value={pwd} onChange={e=>{setPwd(e.target.value);setError("");}} placeholder="Nowe hasło" style={inputStyle}/>
                <input type="password" value={pwd2} onChange={e=>{setPwd2(e.target.value);setError("");}} onKeyDown={e=>e.key==="Enter"&&handleSave()} placeholder="Powtórz hasło" style={{...inputStyle,marginBottom:error?6:16}}/>
                {error&&<div style={{fontSize:13,color:"#E05C5C",marginBottom:10}}>{error}</div>}
                <button onClick={handleSave} disabled={status==="saving"||!pwd||!pwd2} style={{width:"100%",padding:"13px",borderRadius:12,background:"#0A7C7C",color:"#fff",border:"none",fontSize:16,fontWeight:700,cursor:status==="saving"?"wait":"pointer",fontFamily:"inherit",opacity:status==="saving"?0.7:1}}>
                  {status==="saving"?"Zapisywanie...":"Zapisz hasło"}
                </button>
              </>
          }
        </div>
      </div>;
    }

    function LockScreen({onUnlock}) {
      const dk=useContext(DarkCtx);
      const [email,setEmail]=React.useState("");
      const [pwd,setPwd]=React.useState("");
      const [error,setError]=React.useState("");
      const [loading,setLoading]=React.useState(false);
      const check=async()=>{
        if(!email||!pwd)return;
        setLoading(true);setError("");
        const res=await supaSignIn(email,pwd);
        setLoading(false);
        if(res.ok){onUnlock();}
        else{setError(res.error);setPwd("");}
      };
      const inputStyle={width:"100%",padding:"13px 16px",borderRadius:12,border:`1.5px solid ${error?"#E05C5C":dk?"#2A4040":"#E4EAF0"}`,background:dk?"#0F1F1F":"#FAFCFD",color:dk?"#E8F5F5":"#1C2B3A",fontSize:16,fontFamily:"inherit",boxSizing:"border-box",marginBottom:10};
      return <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",background:dk?"#0A1A1A":"#F2F5F7",padding:24}}>
        <div style={{fontFamily:"'Syne',sans-serif",fontSize:28,fontWeight:800,color:"#0A7C7C",marginBottom:8}}>ZubrzyckiFizjo</div>
        <div style={{fontSize:14,color:"#7A8FA6",marginBottom:32}}>Zaloguj się aby kontynuować</div>
        <div style={{background:dk?"#1A2A2A":"#fff",borderRadius:16,padding:24,width:"100%",maxWidth:320,boxShadow:"0 4px 20px rgba(0,0,0,.1)"}}>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&check()}
            autoFocus placeholder="Email" style={inputStyle}/>
          <input type="password" value={pwd} onChange={e=>{setPwd(e.target.value);setError("");}}
            onKeyDown={e=>e.key==="Enter"&&check()}
            placeholder="Hasło" style={inputStyle}/>
          {error&&<div style={{fontSize:13,color:"#E05C5C",marginBottom:10}}>{error}</div>}
          <button onClick={check} disabled={loading||!email||!pwd}
            style={{width:"100%",padding:"13px",borderRadius:12,background:"#0A7C7C",color:"#fff",border:"none",fontSize:16,fontWeight:700,cursor:loading?"wait":"pointer",fontFamily:"inherit",opacity:loading?0.7:1}}>
            {loading?"Logowanie...":"Zaloguj się"}
          </button>
        </div>
      </div>;
    }

    function AppWrapper() {
      const [unlocked,setUnlocked]=React.useState(false);
      const [authChecked,setAuthChecked]=React.useState(false);
      const [isRecovery,setIsRecovery]=React.useState(false);

      React.useEffect(()=>{
        const hash=window.location.hash;
        if(hash&&hash.includes("type=recovery")&&hash.includes("access_token=")){
          try{
            const params=new URLSearchParams(hash.slice(1));
            const token=params.get("access_token");
            if(token){_supaToken=token;setIsRecovery(true);setAuthChecked(true);return;}
          }catch{}
        }
        const t=sessionStorage.getItem("fizjo-token");
        if(t){
          // Weryfikuj token przez testowe zapytanie
          _supaToken=t;
          fetch(`${SUPA_URL}/rest/v1/app_data?key=eq.fizjo-settings&select=key`,
            {headers:{"apikey":SUPA_ANON,"Authorization":`Bearer ${t}`}})
          .then(r=>{
            if(r.status===200||r.status===201){
              setUnlocked(true);setAuthChecked(true);
            } else {
              // Token wygasł — spróbuj refresh
              supaRefresh().then(ok=>{
                if(ok){setUnlocked(true);}
                else{sessionStorage.removeItem("fizjo-token");sessionStorage.removeItem("fizjo-refresh");}
                setAuthChecked(true);
              });
            }
          }).catch(()=>{setAuthChecked(true);});
        } else {
          setAuthChecked(true);
        }
      },[]);

      const [visits,setVisits,v1]=usePersistedState("fizjo-visits",[],unlocked);
      const [patients,setPatients,v2]=usePersistedState("fizjo-patients",[],unlocked);
      // Migracja: nadaj id wizytom które go nie mają — uruchamia się po załadowaniu z Supabase
      React.useEffect(()=>{
        if(!v1) return; // czekaj na załadowanie
        setVisits(vs=>{
          const needsMigration=vs.some(v=>!v.id);
          if(!needsMigration) return vs;
          return vs.map(v=>v.id?v:{...v,id:Date.now()+Math.random()});
        });
      },[v1]);
      React.useEffect(()=>{
        if(!v2) return;
        setPatients(ps=>{
          const needsMigration=ps.some(p=>!p.id);
          if(!needsMigration) return ps;
          return ps.map(p=>p.id?p:{...p,id:Date.now()+Math.random()});
        });
      },[v2]);
      const [rentals,setRentals,v3]=usePersistedState("fizjo-rentals",[],unlocked);
      const [finances,setFinances,v4]=usePersistedState("fizjo-finances",[],unlocked);
      const [stock,setStock,v5]=usePersistedState("fizjo-stock",{},unlocked);
      const [nfzCases,setNfzCases,v6]=usePersistedState("fizjo-nfz",[],unlocked);
      const [todos,setTodos,v7]=usePersistedState("fizjo-todos",[],unlocked);
      const [events,setEvents,v9]=usePersistedState("fizjo-events",[],unlocked);
      const [settings,setSettings,v8]=usePersistedState("fizjo-settings",{backupReminder:true},unlocked);
      const [budget,setBudget,v10]=usePersistedState("fizjo-budget",{},unlocked);
      const [machines,setMachines,v11]=usePersistedState("fizjo-machines",[],unlocked);
      const [dark,setDark]=useState(false);
      const [demo,setDemo]=useState(false);
      const [showBackupBanner,setShowBackupBanner]=useState(false);
      const [showConflictBanner,setShowConflictBanner]=useState(false);

      React.useEffect(()=>{
        const h=()=>setShowConflictBanner(true);
        window.addEventListener("fizjo-conflict",h);
        return()=>window.removeEventListener("fizjo-conflict",h);
      },[]);

      const exportData=()=>{
        const data={visits,patients,rentals,finances,stock,nfzCases,todos,events,budget,exportedAt:new Date().toISOString()};
        const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
        const url=URL.createObjectURL(blob);
        const a=document.createElement("a");
        a.href=url;
        a.download="fizjo-backup-"+new Date().toISOString().slice(0,10)+".json";
        a.click();
        URL.revokeObjectURL(url);
        setShowBackupBanner(false);
      };

      const importData=(e)=>{
        const file=e.target.files[0];
        if(!file)return;
        const reader=new FileReader();
        reader.onload=(ev)=>{
          try{
            const d=JSON.parse(ev.target.result);
            if(d.visits)setVisits(d.visits);
            if(d.patients)setPatients(d.patients);
            if(d.rentals)setRentals(d.rentals);
            if(d.finances)setFinances(d.finances);
            if(d.stock)setStock(d.stock);
            if(d.nfzCases)setNfzCases(d.nfzCases);
            if(d.todos)setTodos(d.todos);
            if(d.events)setEvents(d.events);
            if(d.budget)setBudget(d.budget);
            alert("Import zakończony pomyślnie!");
          }catch(err){alert("Błąd importu: "+err.message);}
        };
        reader.readAsText(file);
      };

      // Backup reminder at 20:00 Warsaw time
      React.useEffect(()=>{
        if(settings&&settings.backupReminder===false)return;
        const check=()=>{
          const now=new Date();
          const warsaw=new Date(now.toLocaleString("en-US",{timeZone:"Europe/Warsaw"}));
          const h=warsaw.getHours();
          const m=warsaw.getMinutes();
          if(h===20&&m<5)setShowBackupBanner(true);
        };
        check();
        const id=setInterval(check,60000);
        return()=>clearInterval(id);
      },[settings]);

      if(!authChecked)return<div className="loader"><div className="spinner"/><div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,color:"#0A7C7C",fontSize:18}}>ZubrzyckiFizjo</div></div>;
      if(isRecovery)return<DarkCtx.Provider value={dark}><PasswordResetScreen/></DarkCtx.Provider>;
      if(!unlocked)return<DarkCtx.Provider value={dark}><LockScreen onUnlock={()=>setUnlocked(true)}/></DarkCtx.Provider>;
      if(!v1||!v2||!v3||!v4||!v5||!v6||!v7||!v10)return<div className="loader"><div className="spinner"/><div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,color:"#0A7C7C",fontSize:18}}>ZubrzyckiFizjo</div><div style={{fontSize:13,color:"#7A8FA6"}}>Wczytywanie danych...</div></div>;
      return <DarkCtx.Provider value={dark}><DemoCtx.Provider value={demo}>
        <div>
          {showConflictBanner&&<div style={{position:"fixed",top:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,background:"#E05C5C",zIndex:10000,padding:"10px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
            <span style={{fontWeight:700,fontSize:13,color:"#fff",flex:1}}>⚠️ Inne urządzenie zapisało zmiany. Możesz stracić swoje dane.</span>
            <div style={{display:"flex",gap:8,flexShrink:0}}>
              <button onClick={()=>window.location.reload()} style={{background:"#fff",border:"none",borderRadius:8,padding:"6px 12px",fontSize:12,fontWeight:700,color:"#E05C5C",cursor:"pointer",fontFamily:"inherit"}}>Odśwież</button>
              <button onClick={()=>setShowConflictBanner(false)} style={{background:"transparent",border:"none",fontSize:18,cursor:"pointer",color:"#fff"}}>×</button>
            </div>
          </div>}
          {showBackupBanner&&<div style={{position:"fixed",top:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,background:"#F4A261",zIndex:9999,padding:"10px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontWeight:700,fontSize:13,color:"#1C2B3A"}}>💾 Czas na backup!</span>
            <div style={{display:"flex",gap:8}}>
              <button onClick={exportData} style={{background:"#1C2B3A",border:"none",borderRadius:8,padding:"6px 12px",fontSize:12,fontWeight:700,color:"#fff",cursor:"pointer",fontFamily:"inherit"}}>Pobierz</button>
              <button onClick={()=>setShowBackupBanner(false)} style={{background:"transparent",border:"none",fontSize:18,cursor:"pointer",color:"#1C2B3A"}}>×</button>
            </div>
          </div>}
          <AppWithSync visits={visits} setVisits={setVisits} patients={patients} setPatients={setPatients} rentals={rentals} setRentals={setRentals} finances={finances} setFinances={setFinances} stock={stock} setStock={setStock} nfzCases={nfzCases} setNfzCases={setNfzCases} todos={todos} setTodos={setTodos} events={events} setEvents={setEvents} dark={dark} setDark={setDark} settings={settings} setSettings={setSettings} exportData={exportData} importData={importData} demo={demo} setDemo={setDemo} budget={budget} setBudget={setBudget} machines={machines} setMachines={setMachines} rentalsLoaded={v3} financesLoaded={v4}/>
        </div>
      </DemoCtx.Provider></DarkCtx.Provider>;
    }

    class ErrorBoundary extends React.Component {
      constructor(props){super(props);this.state={err:null};}
      static getDerivedStateFromError(e){return {err:e};}
      render(){
        if(this.state.err){
          return React.createElement('div',{style:{padding:24,fontFamily:"monospace",fontSize:13,background:"#FEE2E2",minHeight:"100vh",color:"#1C2B3A"}},
            React.createElement('div',{style:{fontWeight:700,fontSize:16,marginBottom:12,color:"#E05C5C"}},"Blad aplikacji"),
            React.createElement('div',{style:{marginBottom:8,wordBreak:"break-all"}},String(this.state.err)),
            React.createElement('div',{style:{fontSize:11,color:"#7A8FA6",wordBreak:"break-all",whiteSpace:"pre-wrap"}},this.state.err&&this.state.err.stack),
            React.createElement('button',{onClick:()=>this.setState({err:null}),style:{marginTop:16,padding:"8px 16px",background:"#0A7C7C",color:"#fff",border:"none",borderRadius:8,cursor:"pointer"}},"Sprobuj ponownie")
          );
        }
        return this.props.children;
      }
    }
    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(ErrorBoundary,null,React.createElement(AppWrapper)));
  </script>
</body>
</html>
