<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="theme-color" content="#3E6FB0"/>
  <title>ZubrzyckiFizjo</title>
  <script src="vendor/react.production.min.js"></script>

  <link rel="stylesheet" href="fonts/fonts.css"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;background:#EFF3FA;color:#1C2B3A;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
    input,select,textarea,button{font-family:'DM Sans',sans-serif;-webkit-tap-highlight-color:transparent}
    ::-webkit-scrollbar{display:none}*{scrollbar-width:none}
    .loader{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:16px;background:#EFF3FA}
    .spinner{width:40px;height:40px;border:3px solid #D9E2F0;border-top-color:#3E6FB0;border-radius:50%;animation:spin 0.8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="root"></div>
  <!-- Kod aplikacji: js/*.js to zrodla, dist/*.js to ich skompilowana wersja (python3 build.py). Edytujemy tylko js/. -->
